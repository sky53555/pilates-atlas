//drive.google.com/file/d/12O1XoSCC4tL1KzcxP4JDsLMDms-KvQxG/view","group":"Barrel"},{"file":"046_Barrel - Ballet Stretch (발레 스트레치).jpg","name":"Barrel - Ballet Stretch (발레 스트레치)","url":"https://drive.google.com/file/d/1TLDnaI6QgM31KOnu-rplZo9oPFwA0YrB/view","group":"Barrel"},{"file":"Reference - Handwritten Pilates Study Notes (필라테스 필기 정리).jpg","name":"Reference - Handwritten Pilates Study Notes (필라테스 필기 정리)","url":"https://drive.google.com/file/d/1Uw9WKexsrfNc8WqqZy0jslhVfnXXBXxc/view","group":"Other Equipment"}];const detail={"reformer-page-10":{"target":"SOURCE · Reformer Single Leg Footwork — 1. Bicycle (p.10). Why: 골반·몸통 안정화, 협응력 향상, 발목 움직임 인지력과 가동성, Hip Flexor & Extensor 활성화. COACHING · 편측 다리 움직임에서 좌우 골반의 균형과 복부 지지 유지.","alignment":"SOURCE · 등을 대고 누워 두 다리는 골반너비, 뒤꿈치를 살짝 들고 발의 볼(ball of foot)을 풋바에 올린 뒤 골반 중립, 한 다리는 대각선으로 뻗는다. 사진 3컷: 대각선으로 뻗은 다리 → 한쪽 무릎을 접고 반대 다리를 풋바에 지지 → 대각선 뻗기로 복귀. COACHING · 시선은 천장 방향, 머리·흉곽·골반이 캐리지에 안정적으로 닿도록 한다. 지지 발은 앞꿈치로 풋바를 누르고 무릎은 발끝과 같은 방향으로 정렬한다.","breath":"SOURCE · INHALE Ready → EXHALE One Leg Leg Fold (원문 표현 그대로) → INHALE Return to Starting Position.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Hip & Knee Flexion/Extension; Ankle Dorsi Flexion/Plantar Flexion. Watch Point: 골반을 뒤로 기울이지 말고 중립 유지; 골반 회전이나 한쪽이 올라가지 않게 주의; 다리 정렬과 고관절 굴곡·신전 움직임 확인. COACHING · 지지 발의 압력이 바뀌어 캐리지가 튀지 않게 속도를 조절하고 목·어깨 힘을 최소화한다. 빨간 손글씨는 인쇄 SOURCE가 아님.","regress":"COACHING · 무릎 접는 범위를 줄이고 지지 발의 풋바 접촉을 먼저 안정화한다. 이 항목은 인쇄된 별도 회귀 단계가 아니다.","variations":"SOURCE · 발의 뒤꿈치를 풋바 위에 두기; Leg Fold 생략(대각선으로 뻗은 다리를 유지하며 캐리지 움직임만 하기)."},"reformer-page-11":{"target":"SOURCE · Reformer Single Leg Footwork — 2. Reach Leg (p.11). Why: 골반·몸통 안정화, 협응력 향상, 발목 움직임 인지력과 가동성, Hip Flexor & Extensor 활성화. COACHING · 풋바 지지 다리와 공중 다리의 서로 다른 움직임을 조절한다.","alignment":"SOURCE · 등을 대고 누워 두 다리는 골반너비, 뒤꿈치를 살짝 들고 발의 볼을 풋바에 올린 뒤 골반 중립, 한 다리는 대각선으로 뻗는다. 사진 5컷: 대각선 다리 → 공중 다리 접기 → 캐리지 밀면서 다리를 천장으로 뻗기 → 다리 접기 → 시작 위치 복귀. COACHING · 시선은 천장, 지지 발의 앞꿈치 접촉을 유지하고 뻗는 다리의 고관절 굴곡 범위가 골반 후방경사를 만들지 않도록 조절한다.","breath":"SOURCE · INHALE Ready → EXHALE Reach Leg to The Ceiling → INHALE Return to Starting Position. 사진에는 중간 무릎 접기와 다리 뻗기가 나타나지만 해당 전환마다 별도 호흡 지시는 인쇄되지 않음.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Hip & Knee Flexion/Extension; Ankle Dorsi Flexion/Plantar Flexion. Watch Point: 골반 후방경사 방지, 골반 회전·편측 상승 방지, 다리 정렬 및 고관절 굴곡·신전 확인, 두 다리가 동시에 펴지도록 조절. COACHING · 캐리지 이동과 공중 다리의 수직 뻗기 타이밍을 맞추되 반동을 사용하지 않는다.","regress":"COACHING · 공중 다리의 뻗는 높이를 줄이고 지지 다리의 캐리지 이동 범위를 조절한다. 원본의 별도 회귀 지시는 아니다.","variations":"SOURCE · 발의 뒤꿈치를 풋바 위에 두기."},"reformer-page-8":{"target":"SOURCE · Running, printed p.8. Why: 발목 움직임의 인지력 향상 및 가동성 증진. COACHING · 좌우 발목의 교대 움직임과 골반 안정성을 훈련.","alignment":"SOURCE · 척추와 골반 중립, 두 다리를 모아 발가락을 풋바에 올리고 뒤꿈치를 살짝 들며 양팔을 골반 옆에 길게 둔다. 사진 1–7: 무릎 굽힌 시작 → 양다리 뻗어 캐리지 이동 → 좌우 교대 뒤꿈치 내리기/올리기 → 무릎 굽혀 복귀. COACHING · 시선 천장, 어깨와 후두부는 헤드레스트에 편안히 두고 발 앞부분이 풋바에서 미끄러지지 않도록 확인.","breath":"SOURCE · INHALE Ready → EXHALE push carriage out → IN-EX Running → INHALE Carriage out → EXHALE Running → INHALE carriage out → EXHALE Return to starting position.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Hip Flexion / Extension; Knee Flexion / Extension; Pelvic & Scapula Stabilizer; Ankle Dorsi Flexion / Plantar Flexion. Watch Point: 골반 중립 유지, 다리 정렬과 발목 움직임 집중, 골반 회전 방지. COACHING · 고관절과 무릎을 과하게 흔들지 않고 발목 움직임을 분리한다. 빨간 필기 메모는 인쇄 SOURCE가 아님.","regress":"COACHING · 작은 발목 가동범위로 시작하고 캐리지 복귀를 천천히 조절한다.","variations":"SOURCE · Single Leg Running; 아킬레스건 스트레치. COACHING · 한쪽 다리로 수행할 때 골반 회전과 발 지지를 더 주의한다."},"reformer-page-9":{"target":"SOURCE · Hip Rolls, printed p.9. Why: 둔근 및 슬괵근 강화; 복근 및 고관절 신전근, 배측굴곡근, 척추기립근 단련. COACHING · 브리지 자세에서 척추 분절과 캐리지 조절을 구분한다.","alignment":"SOURCE · 두 다리는 외회전하여 무릎을 접어 풋바에 발바닥을 두고 천장을 바라보며 눕는다. 골반 중립, 양손은 골반 옆에 편안히 내려놓는다. 사진 1–5: 누운 자세 → 골반을 들어 척추 분절 롤업 → 브리지 유지하며 캐리지 밀기 → 당기기 → 척추 분절해 내려오기. COACHING · 발바닥 전체 지지, 시선은 천장, 무릎과 발끝 정렬을 유지하고 허리 과신전을 피한다.","breath":"SOURCE · INHALE Ready → EXHALE Roll Up → INHALE Keep → EXHALE Carriage Out → INHALE Carriage In (2–5회 반복) → EXHALE Return to Starting Position.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Articulation; Hip Extension. Watch Point: 어깨와 목 긴장 주의, 척추·골반 중립 유지하며 다리 움직임, 다리 정렬 및 발 모양 집중, 척추 분절 중 캐리지 움직이지 않게 주의. COACHING · 척추 분절 구간과 캐리지 이동 구간을 명확히 분리하고 경추에 체중을 싣지 않는다.","regress":"COACHING · 캐리지 밀기 없이 브리지 롤업/롤다운만 먼저 연습한다.","variations":"SOURCE · 캐리지 밀어내기 제외; 팔 천장으로 들기. COACHING · 팔을 들면 몸통 안정화 요구가 커진다."},"reformer-page-5":{"target":"SOURCE · Footwork — 1. Heels on Footbar (printed p.5). Why: 움직임을 통한 골반 안정화, Hip Extensor & Knee Extensor 강화, 하지 움직임 인지 및 정렬 개선. COACHING · 발뒤꿈치 압력과 대퇴-골반 정렬을 확인한다.","alignment":"SOURCE · 척추와 골반 중립, 캐리지에 천장을 보고 누워 양팔은 골반 옆에 길게 둔다. 두 다리는 모아 뒤꿈치를 풋바에 올린다. 3컷 사진: 무릎 굽힘 → 다리 신전하며 캐리지 밀기 → 무릎 굽혀 복귀. COACHING · 시선은 천장, 발뒤꿈치가 풋바에서 미끄러지지 않게 하고 발목을 안정화한다.","breath":"SOURCE · INHALE Ready → EXHALE Push Carriage Out → INHALE Return to Starting Position.","check":"SOURCE · Movement Point: Transverse Abdominis/Pelvic Floor; Hip Flexion/Extension; Knee Flexion/Extension; Pelvic & Scapula Stabilizer. Watch Point: 어깨와 목의 긴장 주의, 골반 중립 유지, 다리 정렬과 고관절·슬관절 굴곡 및 신전 확인. COACHING · 무릎 잠금과 허리 과신전 없이 가동범위를 조절한다.","regress":"COACHING · 작은 캐리지 이동으로 발뒤꿈치 지지와 중립을 먼저 연습한다. 원본에 별도 회귀 단계 없음.","variations":"SOURCE · 해당 페이지에 Variation 항목 없음. COACHING · 스프링과 가동범위는 지도자 감독하에 조절한다."},"reformer-page-6":{"target":"SOURCE · Footwork (printed p.6): 실제 인쇄된 세 소제목은 2. Wrap Toes on Footbar, 3. Frog Position, 4. Heels Up. 주의: Drive 파일명 'Wide Heels Frog Position Heels Up'은 인쇄 소제목과 불일치하며 이 페이지를 Wide Heels 단일 동작으로 분류하지 않는다.","alignment":"SOURCE · Wrap Toes: 두 다리를 모아 발가락으로 풋바를 감싸쥐고 뒤꿈치를 살짝 내려 발목을 발등쪽으로 굴곡. Frog: 두 다리를 외회전해 뒤꿈치를 모으고 양발을 V모양. Heels Up: 두 다리를 모아 발가락을 풋바 위에 올리고 뒤꿈치를 살짝 들어 준비. 사진 3컷은 각각 발의 접촉 클로즈업이며 몸통 전체 시퀀스가 아니다. COACHING · 골반 중립을 유지하고 발가락을 과도하게 움켜쥐지 않는다.","breath":"SOURCE · 이 페이지에는 독립적인 Breathing & Movement Sequence 인쇄가 없음. COACHING · 앞 페이지 Footwork의 내쉬며 밀고 들이쉬며 돌아오는 패턴을 적용할 수 있으나 p.6 원문 호흡으로 간주하지 않는다.","check":"SOURCE · 이 페이지에는 별도 Movement Point/Watch Point가 인쇄되지 않음. COACHING · Frog에서 무릎 외회전 강요하지 않고 고관절 외회전 범위에 맞추며, Heels Up에서 발 앞부분 압력과 발목 정렬을 확인한다.","regress":"COACHING · 발가락 감싸쥐기나 뒤꿈치 들기가 불편하면 작은 범위로 진행한다.","variations":"SOURCE · Variation: 반대 호흡 하기; 두 다리를 골반 너비로 시행 — Parallel, Lateral Rotation, Medial Rotation. COACHING · 회전은 무릎만 비트는 것이 아니라 고관절에서 시작한다."},"reformer-page-7":{"target":"SOURCE · Ankle Exercise (printed p.7). Why: 발목 움직임의 인지력 향상 및 가동성 증진. COACHING · 발목의 dorsiflexion/plantarflexion을 다리 정렬 유지와 함께 분리 연습한다.","alignment":"SOURCE · 척추·골반 중립, 다리를 모아 발가락을 풋바 위에 올리고 뒤꿈치를 살짝 들어 준비, 양팔은 골반 옆으로 길게. 사진 5컷: 시작 굴곡 → 캐리지 밀어 다리 신전 → 발등굽힘 → 발바닥굽힘 → 복귀. COACHING · 시선은 천장, 발 앞부분을 풋바에 유지하고 고관절·무릎은 안정화한다.","breath":"SOURCE · INHALE Push Carriage Out → EXHALE Dorsi Flexion → INHALE Plantar Flexion (1~6회 반복) → EXHALE Return to Starting Position. 별도 Ready 호흡은 이 페이지에 인쇄되지 않았다.","check":"SOURCE · Movement Point: TVA/Pelvic Floor; Hip Flexion/Extension; Knee Flexion/Extension; Pelvic & Scapula Stabilizer; Ankle Dorsi Flexion/Plantar Flexion. Watch Point: 어깨·목 긴장 주의, 골반 중립, 다리 정렬을 지키며 발목 움직임에 집중.","regress":"COACHING · 캐리지 이동을 줄이고 발목만의 움직임을 느끼도록 연습한다.","variations":"SOURCE · 발목 운동만 하기; 아킬레스건 스트레치. COACHING · 스트레치 범위는 발뒤꿈치가 떨어지거나 발목이 꺾이지 않는 범위에서 조절한다."},"chair-page-83":{"target":"SOURCE · Lying Leg Press with Articulation (p.83). Why: Knee Flexor 및 둔근 강화, 척배근 및 척추기립근 단련. COACHING · 골반을 들어 올린 상태에서 척추 분절과 페달의 저항을 함께 조절.","alignment":"SOURCE · 척추와 골반 중립으로 천장을 보고 누워 두 다리는 골반너비로 굴곡, 발바닥을 페달에 둔다. 양팔은 몸 옆으로 길게 내린다. 사진 5컷은 누운 시작 → 척추 분절하며 브리지 → 페달 프레스 → 페달 상승 → 척추 분절하며 복귀. COACHING · 머리와 목은 바닥에 편하게 두고 시선은 천장, 발바닥 접촉과 골반 수평을 유지.","breath":"SOURCE · INHALE Ready → EXHALE Roll Up & Bridge Position → INHALE Keep → EXHALE Pedal Press → INHALE Pedal Up → EXHALE Return to Starting Position. <Rep. 3> 표기.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Hip Flexion / Extension: Hip Extensor; Knee Flexion / Extension: Knee Flexor; Articulation. Watch Point: 척추 순차 움직임과 좌우 정렬; 팔을 사용해 밸런스 잡지 않기; 다리와 발 정렬; 요추 과신전 방지 및 체중을 머리·목에 싣지 않기. COACHING · 경추에 압박이 느껴지면 범위 축소.","regress":"COACHING · 브리지 높이를 낮추고 페달 움직임을 작게 하며 골반 수평부터 연습. 원본의 별도 회귀 지시 아님.","variations":"SOURCE · 페달 분리; 척추 분절 운동만 하기; 한 다리 천장으로 들어 올리기."},"chair-page-84":{"target":"SOURCE · Lying Frog Leg Press (p.84). Why: 몸통 안정화 및 둔근 강화. COACHING · 고관절 외회전을 유지하면서 복부·골반을 안정화.","alignment":"SOURCE · 척추와 골반 중립으로 천장을 보고 누워 두 다리를 외회전하여 뒤꿈치를 붙여 발끝을 페달에 둔다. 양팔은 길게 내린다. 사진 3컷은 외회전 다리의 페달 시작 → 무릎 굽힘과 페달 프레스 → 시작 위치 복귀. COACHING · 시선 천장, 골반 정면 유지, 외회전은 고관절에서 만들고 무릎·발목 비틀림 방지.","breath":"SOURCE · INHALE Ready → EXHALE Hip Lateral Rotation & Push The Pedal → INHALE Return to Starting Position.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Hip Lateral Rotator. Watch Point: 움직임은 고관절에서 발생하고 무릎·발목에서 만들지 않기; 골반 움직임과 요추 과신전 방지. COACHING · 발끝 접촉과 뒤꿈치 맞닿는 상태를 유지하되 관절 불편 시 각도 축소.","regress":"COACHING · 고관절 외회전 범위와 페달 이동량을 줄인다. 원본 별도 회귀 설명 없음.","variations":"SOURCE · 별도 Variation 항목 없음. COACHING · 대칭성 확인을 우선."},"chair-page-85":{"target":"SOURCE · AB Press Sitting (p.85). Why: 척추 분절 인지능력 향상, 몸통·골반 안정화 및 복부근육 활성화. COACHING · 페달을 팔로 누르기보다 몸통 굴곡과 복압 조절로 연결.","alignment":"SOURCE · 척추와 골반 중립으로 두 다리를 체어 바깥쪽으로 길게 뻗어 앉고 양손을 페달에 두며 팔꿈치는 바깥쪽을 향해 살짝 굽힌다. 사진 3컷은 앉은 시작 → 척추 굴곡 전방 → 시작 자세. 발뒤꿈치는 바닥에 두고 발끝은 위로 든 모습. COACHING · 시선은 굴곡하며 복부/페달 쪽으로, 복귀하며 정면; 고관절은 과도하게 접지 않고 좌골 지지 유지.","breath":"SOURCE · INHALE Ready → EXHALE Spinal Flexion Forward → INHALE Return to Starting Position.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Flexion: Rectus Abdominis & Oblique; Scapula Stabilizer: Lat. Watch Point: 경추 과도 굴곡 방지와 척추 순차 움직임; 견갑골 안정화에 집중하고 팔로 페달 누르지 않기; 골반 후방경사 방지. COACHING · 턱을 과도하게 가슴에 붙이지 않고 흉추 분절에 집중.","regress":"COACHING · 굴곡 범위를 작게 하고 페달 저항을 조절. 원본의 별도 회귀 지시 아님.","variations":"SOURCE · 척추 굴곡 제외하기; 무릎 구부리기; 페달 분리; Puls 추가(원문 철자); Circle 사용. COACHING · 소도구는 골반 정렬을 방해하지 않게 배치."},"chair-page-80":{"target":"SOURCE · Standing Ankle Exercise (p.80). Why: 발목 움직임 및 이상적인 정렬 인지력 향상, 비복근·가자미근 강화. COACHING · 발목의 저측/배측 굴곡을 전신 정렬과 함께 연습.","alignment":"SOURCE · 척추와 골반 중립으로 페달 위에 뒤꿈치를 들고 서서 양손으로 핸들을 잡는다. 사진 3컷은 두 발 앞부분을 페달에 둔 상태에서 발목 각도를 바꾼다. COACHING · 시선은 정면, 체중은 좌우 앞발에 고르게 두고 고관절과 무릎을 불필요하게 굽히지 않는다.","breath":"SOURCE · INHALE Ready → EXHALE Dorsi Flexion → INHALE Return to Starting Position. COACHING · 발등굽힘 때 뒤꿈치가 상대적으로 낮아지고 돌아오며 발바닥굽힘이 일어난다.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Ankle Dorsi Flexion / Plantar Flexion; Body Alignment. Watch Point: 척추와 골반 중립 유지, 다리와 몸통 전체 정렬 주의. COACHING · 손잡이를 과하게 당기지 않고 발가락 움켜쥠을 피한다.","regress":"COACHING · 안정적인 손잡이 지지 아래 작은 발목 가동범위로 실시. 원본에 별도 회귀 없음.","variations":"SOURCE · 별도 Variation 인쇄 없음. COACHING · 양발 균형부터 연습."},"chair-page-81":{"target":"SOURCE · Running (p.81). Why: 발목 움직임·이상적인 정렬 인지력 향상, 비복근·가자미근 강화. COACHING · 교대 발목 동작과 체중 이동을 협응.","alignment":"SOURCE · 척추와 골반 중립, 페달 위에 뒤꿈치를 들고 서서 양손으로 핸들을 잡는다. 사진 5컷에서 발 앞부분은 페달을 누르고 한쪽 무릎은 굽혀 발이 교대로 움직인다. COACHING · 시선 정면, 손잡이는 균형 보조, 고관절과 몸통의 과도한 흔들림을 억제.","breath":"SOURCE · INHALE Ready → EXHALE Running → INHALE Heel Up → EXHALE Running → INHALE Return to Starting Position. COACHING · 양쪽 발목을 교대로 조절하되 호흡을 멈추지 않는다.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Ankle Dorsi Flexion / Plantar Flexion; Body Alignment. Watch Point: 척추와 골반 중립, 다리와 몸통 전체 정렬. COACHING · 발바닥 앞쪽의 페달 접촉을 유지하고 무릎이 안으로 무너지지 않도록 관찰.","regress":"COACHING · 작은 교대 범위로 시작하고 손잡이 지지를 유지한다. 원본에 별도 회귀 없음.","variations":"SOURCE · 별도 Variation 항목 없음. COACHING · 템포를 늦춰 좌우 정렬을 확인."},"chair-page-82":{"target":"SOURCE · Lying Leg Press (p.82). Why: 몸통 안정화 및 Knee Flexor 강화, Hip Extensor 활성화. COACHING · 누운 자세에서 골반 안정성을 유지하며 고관절과 무릎의 굽힘/폄 협응.","alignment":"SOURCE · 척추와 골반 중립, 천장을 보고 매트에 누워 두 다리를 골반너비로 굴곡하여 뒤꿈치를 페달에 둔다. 양팔은 길게 내려놓는다. 사진 3컷에서 뒤꿈치가 페달에 접촉하고 무릎/고관절 각도가 변하며 골반은 매트에 놓인다. COACHING · 시선은 천장, 경추를 과신전하지 않고 허리가 과도하게 뜨지 않게 한다.","breath":"SOURCE · INHALE Ready → EXHALE Push The Pedal → INHALE Return to Starting Position.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Hip Flexion / Extension: Hip Extensor; Knee Flexion / Extension: Knee Flexor. Watch Point: 척추와 골반 중립 유지; 고관절과 무릎의 움직임이 순차적으로 일어나도록; 팔을 사용하여 밸런스를 잡지 않도록. COACHING · 뒤꿈치 접촉과 무릎-발 정렬을 관찰하며 반동을 피한다.","regress":"COACHING · 페달 가동범위를 줄이고 허리 중립 유지 가능한 저항을 선택한다. 원본에 별도 회귀 없음.","variations":"SOURCE · 페달 분리(Split Pedal). COACHING · 좌우 저항과 골반 회전을 별도로 관찰한다."},"chair-page-79":{"target":"SOURCE · Sitting Ankle Exercise (p.79). Why: 발목 움직임 인지력 향상 및 가자미근 강화. COACHING · 발목 가동을 고립시키면서 앉은 자세의 몸통 안정성을 유지한다.","alignment":"SOURCE · 척추와 골반 중립, 치골결합과 체어 끝이 수직으로 정렬되도록 앉는다. 두 다리를 굴곡하여 뒤꿈치를 들고 페달을 살짝 누르며 양손으로 핸들을 감싸 쥔다. 원본 사진 3컷 모두 체어에 앉아 발 앞부분을 페달에 접촉하고 손으로 양쪽 핸들을 잡은 상태다. COACHING · 시선은 정면, 고관절과 무릎 각도는 발목 운동 중 크게 변하지 않도록 한다. 발가락을 움켜쥐지 않고 발 앞부분의 접촉을 유지한다.","breath":"SOURCE · INHALE Pedal Up (Ankle Dorsi Flexion) → EXHALE Push the Pedal → INHALE Return to Starting Position. COACHING · 페달 상승은 발등굽힘, 하강은 발바닥굽힘에 집중하고 호흡과 동작을 맞춘다.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Ankle Dorsi Flexion / Plantar Flexion. Watch Point: 목과 어깨에 긴장이 생기지 않게; 척추와 골반 반드시 중립 유지; 허벅지 수평을 유지하며 발목만 움직이기; 다리 정렬과 발 모양에 집중. COACHING · 고관절/무릎의 상하 흔들림으로 페달을 움직이지 않도록 확인한다. 손목과 어깨를 편안하게 유지한다.","regress":"COACHING · 페달 이동 폭을 줄여 발목의 순수한 움직임을 익히고 필요시 스프링 강도를 지도자와 조절한다. 원본에 별도의 회귀 동작은 기재되지 않았다.","variations":"SOURCE · 페달 분리; 팔 위치 변경; 등 뒤에 소도구 사용. COACHING · 페달 분리 시 좌우 발목 조절 차이를 관찰하고, 등 뒤 소도구는 중립 정렬을 유지하는 보조 수단으로 사용한다. 빨간 필기 메모는 인쇄된 원본 설명에 포함하지 않았다."},"chair-footwork-page-77":{"target":"SOURCE · Footwork 1. Heels on Pedal (p.77). Why: 몸 정렬을 통한 몸통과 골반 안정화; 하지 움직임의 인지력 향상 및 정렬 개선. COACHING · 발뒤꿈치 지지 상태에서 고관절·무릎·발목의 협응을 지도한다.","alignment":"SOURCE · 척추와 골반 중립, 체어에 앉아 풋바가 수직이 되도록 설정; 두 다리는 골반너비, 뒤꿈치를 페달 위에 얹고 양손으로 핸들을 잡는다. 사진 두 컷은 무릎 굽힘과 페달을 누른 무릎 폄을 보여준다. COACHING · 시선은 정면, 발뒤꿈치가 페달에서 밀리지 않도록 하고 골반을 체어 위에 안정적으로 둔다.","breath":"SOURCE · INHALE Ready → EXHALE Push the Pedal → INHALE Return to Starting Position.","check":"SOURCE · Transverse Abdominis, Pelvic Floor; Hip Flexion / Extension; Knee Flexion / Extension; Scapula Stabilizer. Watch Point: 목과 어깨 긴장 방지; 척추·골반의 바른 중립 유지; 다리 정렬과 발 모양에 집중. COACHING · 무릎이 안팎으로 무너지지 않는지 관찰하고 스프링 부하를 조절한다.","regress":"COACHING · 페달 이동 범위를 줄이고 가벼운 저항으로 정렬을 먼저 익힌다. 원본에 별도 회귀법은 없다.","variations":"SOURCE · p.77은 Heels on Pedal만 설명. p.78에서 Frog Position, Heels Up 및 모으기·분리·발 위치 변경을 별도로 제시한다."},"chair-footwork-page-78":{"target":"SOURCE · Footwork 2. Frog Position / 3. Heels Up (p.78). Why: 몸 정렬을 통한 몸통과 골반 안정화; 하지 움직임의 인지력 향상 및 정렬 개선. COACHING · 각 발 위치에서 정렬과 페달 압력의 차이를 비교한다.","alignment":"SOURCE · Frog Position: 척추·골반 중립, 체어 풋바 수직, 두 다리는 외회전하여 발을 V 모양으로 만들고 발의 볼을 페달 위에 놓으며 양손으로 핸들을 잡는다. Heels Up: 척추·골반 중립, 풋바 수직, 두 다리를 골반너비로 치고 발뒤꿈치를 든 채 양손으로 핸들을 잡는다. COACHING · 정면을 바라보며 발 앞부분이 페달에 안정적으로 닿도록 한다. 외회전은 발끝만 돌리기보다 고관절에서 편안하게 시작한다.","breath":"SOURCE · INHALE Ready → EXHALE Push the Pedal → INHALE Return to Starting Position.","check":"SOURCE · p.78에는 별도 Movement Point / Watch Point 인쇄가 없다. COACHING · 골반 수평, 무릎과 발끝 방향, 발목의 과도한 안팎 기울어짐, 어깨 긴장을 관찰한다. p.77의 일반 풋워크 Watch Point를 참고하되 p.78 인쇄 내용으로 오인하지 않는다.","regress":"COACHING · 발목이 불안정하면 작은 범위와 적절한 스프링 저항으로 시작한다.","variations":"SOURCE · 두 다리 모으기; 페달 분리; 발 위치 변경. 사진에는 Frog Position과 Heels Up이 각각 제시된다. COACHING · 페달 분리는 좌우 부하 조절이 필요한 상급 변형으로 단계적으로 적용한다."},"chair-page-93":{"target":"SOURCE · Spine Press on Chair Prep (p.93). Why: 복부 근육 강화 및 조절 능력 향상. COACHING · 앉은 자세에서 페달 저항을 이용해 척추 굴곡과 몸통 조절을 훈련한다.","alignment":"SOURCE · 척추·골반 중립, 체어 페달 반대쪽을 바라보고 체어에 앉는다. 다리는 골반너비, Box 위에 발을 놓고 손등이 체어에 닿도록 페달 쪽으로 팔을 길게 뻗는다. 사진 6컷에서 몸통을 뒤로 말아 페달을 누르고, 누른 상태에서 페달을 반복해 올렸다 내린 뒤 몸통을 세운다. COACHING · 발 전체를 박스에 안정적으로 지지하고 어깨를 뒤로 과도하게 젖히지 않는다.","breath":"SOURCE · INHALE Ready → EXHALE Roll Back & Press Pedal → INHALE Pedal Up → EXHALE Pedal Press → INHALE Pedal Up With Spinal Flexion → EXHALE Return to Starting Position. 페달 반복 REP 3–5.","check":"SOURCE · Transverse Abdominis, Pelvic Floor; Spinal Flexion: Rectus Abdominis & Oblique. Watch Point: 경추 과굴곡 방지 및 척추 순차 움직임 집중; 견갑골 안정화와 팔꿈치 과신전 주의; 반동 아닌 복부 힘으로 조절; 갈비뼈 popping 주의. COACHING · 시선은 몸통 굴곡과 함께 이동하며 목만 과하게 숙이지 않는다.","regress":"COACHING · 페달 이동범위와 반복 수를 줄이고 박스 발 지지·척추 굴곡을 먼저 안정화한다. 원본에 회귀 동작은 별도 명시되지 않았다.","variations":"SOURCE · 별도 Variation 항목 없음. COACHING · 스프링 설정은 기구와 회원 능력에 맞춰 지도자가 결정한다."},"chair-page-94":{"target":"SOURCE · Rotation Prone (p.94). Why: Spine Rotator 강화 및 회전 가동성 증진; 유지하는 팔 근육과 Hip Extensor 활성화; 움직임을 통한 견갑대 안정화. COACHING · 몸통 회전과 지지측 견갑골 조절을 결합한다.","alignment":"SOURCE · ASIS가 체어 앞에서 2–5 cm 아래 위치하도록 엎드리고 척추·골반 중립, 다리 골반너비로 페달을 향해 길게 뻗는다. 한 손은 이마, 한 손은 페달 위. 사진 5컷: 엎드린 시작 → 몸통 회전 → 지지 팔꿈치 폄 → 팔꿈치 굽힘 → 시작으로 복귀. 다리는 바닥이 아닌 체어 뒤로 뻗어 떠 있다. COACHING · 시선은 회전하는 몸통과 함께 이동하며 고관절을 과도하게 벌리지 않는다.","breath":"SOURCE · INHALE Rotation → EXHALE Elbow Extension → INHALE Elbow Flexion → EXHALE Return to Starting Position.","check":"SOURCE · Transverse Abdominis, Pelvic Floor; Spinal Rotation: Oblique & Multifidus; Hip Extension; Scapula Stabilizer. Watch Point: 페달을 조절하며 척추 회전에 집중하고 신전으로 대체하지 않기; 견갑골 안정화. COACHING · 체어 상단과 골반 접촉을 유지하고 허리만 과도하게 젖히지 않는다.","regress":"COACHING · 회전 범위를 줄이고 페달을 가볍게 조절한다. 원본에 별도 회귀법은 없다.","variations":"SOURCE · 팔 뻗기 제외하기. COACHING · 머리 지지 팔 위치를 조절하되 원본 동작 순서를 우선한다."},"chair-page-95":{"target":"SOURCE · Slow Swan (p.95). Why: 움직임을 통한 견갑대 안정화, Spine & Hip Extensor 강화, 유지하는 팔 근육 활성화. COACHING · 체어 위에서 몸통·고관절 신전과 전후 체중이동을 결합한다.","alignment":"SOURCE · ASIS가 체어 앞에서 2–5 cm 아래, 머리는 페달 쪽으로 엎드린다. 척추 신전, 다리는 바닥과 평행하게 무릎을 어깨너비로 외회전해 골반 쪽 굴곡으로 길게 뻗는다. 팔은 어깨너비, 손으로 페달을 잡는다. 사진 3컷에서 상체가 들린 Swan → 앞으로 Rock 하며 페달이 아래로 움직이고 다리가 들림 → 시작 자세로 복귀. COACHING · 다리는 체어 위에 눌러두는 것이 아니라 몸통과 연결된 긴 라인으로 유지하고 시선은 경추와 함께 자연스럽게 이동한다.","breath":"SOURCE · INHALE Ready → EXHALE Rock Forward → INHALE Return to Starting Position.","check":"SOURCE · Transverse Abdominis, Pelvic Floor; Spine Extensor; Hip Lateral Rotation / Extension; Scapula Stabilizer. Watch Point: 페달을 조절하며 척추·고관절 신전 유지; 손목 꺾임과 팔꿈치 Rocking 방지; 척추의 순차 움직임 집중. COACHING · 허리만 꺾어 높이를 만들지 말고 어깨·흉추·고관절을 함께 조절한다.","regress":"COACHING · Rocking 범위를 줄이고 손목 중립과 견갑대 지지를 확보한다. 원본에는 별도 회귀법이 없다.","variations":"SOURCE · 페달 분리. COACHING · Split Pedal은 좌우 힘 차이와 비틀림을 관찰하며 적용한다."},"chair-page-89":{"target":"SOURCE · Cat Spine Standing Front — 2. AB Press, printed p.89. Why: 척추 분절 인지능력 향상, 복부 근육 활성화. COACHING · 척추 분절을 유지하며 페달을 누르는 복부 조절 연습.","alignment":"SOURCE · 척추·골반 중립, 양팔을 위로 뻗고 다리는 골반 너비로 체어를 바라보고 선다. 사진 6컷: 양팔 위 → 전굴하여 페달 누름 → 상체 일부 들어 페달을 가볍게 올림 → 다시 숙여 3회 펄스 → 척추 말아 올라옴 → 시작 자세. 발바닥은 바닥 지지. COACHING · 시선은 전굴 시 바닥 쪽, 기립 시 정면으로 이동하고 골반을 고정하기보다 움직임을 조절한다.","breath":"SOURCE · INHALE Ready → EXHALE Flexion Forward & Pedal Press → INHALE Lightly Roll Up → EXHALE 3 Pulse, Roll Down → INHALE Roll Up → EXHALE Return to Starting Position.","check":"SOURCE · 이 사진 p.89에는 Movement Point와 Watch Point 별도 인쇄 항목이 보이지 않는다. COACHING · 복부 조절과 척추 분절에 집중하고 목·손목 부담, 페달의 급격한 복귀, 무릎 과신전을 확인한다. 빨간 필기는 인쇄 SOURCE가 아닌 개인 메모.","regress":"COACHING · 펄스 횟수와 페달 압박 범위를 줄이고 안정된 체중 분배부터 연습한다.","variations":"SOURCE · p.89에는 별도 Variation 인쇄 없음. COACHING · 페달 스프링 및 펄스 깊이를 조절한다."},"chair-page-90":{"target":"SOURCE · Cat Spine Standing Front — 3. Arm Press, printed p.90. Why: 척추 분절 인지능력 향상, Elbow Extensor 활성화. COACHING · 팔꿈치 폄을 척추 굴곡과 분리해 조절한다.","alignment":"SOURCE · 척추와 골반 중립, 양팔 위로 뻗고 다리는 골반너비로 체어를 바라보고 선다. 사진 6컷: 선 자세 → 전굴해 페달 잡음 → 팔꿈치 굽혀 페달 올림 → 팔꿈치 펴서 페달 내림 → 몸통 말아 올라옴 → 시작 자세. 발바닥은 바닥 지지. COACHING · 손목 중립을 가능한 범위에서 유지하고 시선은 바닥/정면 사이 자연스럽게 이동한다.","breath":"SOURCE · INHALE Ready → EXHALE Flexion Forward & Pedal → INHALE Elbow Flexion → EXHALE Elbow Extension → INHALE Roll Up → EXHALE Return to Starting Position.","check":"SOURCE · p.90에는 별도 Movement Point, Watch Point, Variation 인쇄 없음. COACHING · 팔꿈치 폄에 Triceps Brachii(상완삼두근)가 주로 기여하고 견갑 안정근이 팔 지지를 보조한다. 손목 과신전, 어깨 으쓱임, 반동성 페달 복귀를 살핀다.","regress":"COACHING · 페달 부하와 팔꿈치 굴곡 범위를 낮추고 척추 분절이 유지되는 범위만 수행한다.","variations":"SOURCE · 별도 Variation 인쇄 없음. COACHING · 팔꿈치 움직임 범위를 조절한다."},"chair-page-91":{"target":"SOURCE · Single Leg Standing, printed p.91. Why: 고관절과 하지의 분리된 움직임 인지, 코어·둔근 등 밸런스 근육 강화·활성화. COACHING · 단측 지지와 회전 방지 능력 연습.","alignment":"SOURCE · Front: 체어를 바라보고 한 발을 페달 위에 두고 살짝 누르며 양팔을 어깨 높이로 들어 준비. Side: 체어 옆에서 체어 쪽 발을 외회전해 페달 위에 올리고 양팔을 어깨 높이로 들어 준비. 사진은 전면·측면 각각 2컷과 핸들 사용 2컷. COACHING · 페달 위 발은 안정되게 접촉하고 지지발은 바닥 전체로 균형을 유지하며 시선은 정면에 둔다.","breath":"SOURCE · INHALE Pedal Up → EXHALE Pedal Press.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Prevent Rotation: Oblique & Multifidus; Hip Flexion/Extension; Knee Flexion/Extension. Watch Point: 팔을 사용해 중심을 잡지 않기, 한쪽 어깨 상승 방지, 척추·골반 중립 유지, 골반 회전과 양쪽 높이 변화 방지, 다리 정렬과 발 모양에 집중. COACHING · 통제 가능한 페달 높이에서 지지발·무릎 정렬을 관찰한다.","regress":"COACHING · 지지 손을 핸들에 두고 페달 범위를 줄여 균형을 먼저 확보한다.","variations":"SOURCE · 핸들 이용. COACHING · 전면/측면에서 각각 안정성을 확보한 뒤 난이도를 높인다."},"chair-page-92":{"target":"SOURCE · Step Up, printed p.92. Why: 균형능력 향상, Hip & Knee Flexor/Extensor 활성화. COACHING · 단측 체중 지지에서 고관절·무릎 신전 협응.","alignment":"SOURCE · 척추·골반 중립, 체어를 바라보고 한 발은 체어 위, 한 발은 페달에 두고 양손으로 핸들을 잡는다. 사진 5컷: 준비 → 페달 발목 등쪽굽힘 → 체어 위 발로 올라서며 페달 쪽 다리를 뒤로 뻗음 → 높은 자세 유지 → 시작 자세 복귀. COACHING · 시선은 전방, 체어 위 발 전체로 체중을 분산하고 페달 위 발은 미끄러지지 않게 위치를 확인한다.","breath":"SOURCE · INHALE Ankle Dorsi Flexion → EXHALE Ankle Plantar Flexion & Press Up → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · Movement Point: Transverse Abdominis, Pelvic Floor; Hip Flexion/Extension; Knee Flexion/Extension; Scapula Stabilizer. Watch Point: 팔로 중심을 잡지 않도록, 한쪽 어깨 상승 방지, 척추·골반 중립 범위에서 다리 움직임, 골반 회전/높이 비대칭 방지, 다리 정렬과 발 모양에 집중. COACHING · 체어 위 지지발의 무릎이 안쪽으로 무너지지 않는지 관찰한다.","regress":"COACHING · 손잡이를 보조 지지로 사용하고 작은 올라서기 범위에서 시작한다.","variations":"SOURCE · 발목 움직임 제외하기; 팔 위치 변경하기; 움직임 범위 정하기. COACHING · 난이도는 균형·관절 가동범위에 맞춰 조절한다."},"chair-page-87":{"target":"SOURCE · Tendon Stretch (p.87). Why: 복부근력 강화, 어깨강화·견갑골 안정화, 햄스트링과 비복근의 유연성, 상지와 하지의 밸런스. COACHING · 체중 지지와 척추 굴곡을 조절하며 발목·어깨 협응을 연습한다.","alignment":"SOURCE · 체어 끝에 살짝 걸쳐 앉아 양손으로 체어 끝을 잡고 두 발을 모아 뒤꿈치를 든 채 상체를 숙여 C커브를 만든다. 사진 2컷에서 손은 체어 가장자리, 발 앞부분은 페달에 접촉하고 몸통은 굴곡된 채 엉덩이가 들어 올라간다. COACHING · 목을 과하게 꺾지 않고 시선은 바닥 방향, 손바닥으로 체어를 밀어 어깨 지지를 유지한다.","breath":"SOURCE · INHALE Ready → EXHALE Pull Up → INHALE Return to Starting Position.","check":"SOURCE · 스프링을 처음에는 무겁게 시작하고 점차 조절; 손으로 잡아당기지 않고 밀어내는 힘 사용; 시선을 고정해 경추가 너무 흔들리지 않도록; 반동이 아닌 복부힘으로 컨트롤. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Flexion: Rectus Abdominis & Oblique; Scapula Stabilizer. COACHING · 손목·어깨 불편과 페달 반발을 확인하고 기구 지도자 감독하에 수행한다.","regress":"COACHING · 발 지지와 스프링을 조절해 작은 범위에서 연습하며 안정적인 어깨 지지를 먼저 확보한다. 원본에 별도의 쉬운 단계는 인쇄되지 않았다.","variations":"SOURCE · 페달 분리 (Split Pedal). COACHING · 분리 페달은 좌우 비대칭 부하가 생기므로 숙련자에게 적용한다."},"chair-page-88":{"target":"SOURCE · Cat Spine Standing Front — 1. Articulation (p.88). Why: 척추 분절 능력 향상. COACHING · 척추 분절과 고관절 굴곡/신전의 순서를 구분한다.","alignment":"SOURCE · 척추와 골반 중립, 양팔을 위쪽으로 뻗고 다리는 골반너비로 체어를 바라보고 선다. 6컷 사진: 선 자세 → 몸통을 분절해 말아 내려 손으로 페달을 누름 → 페달을 더 누른 하단 → 페달 상승 → 몸통 분절 신전 → 처음 자세. 발은 바닥에 평평하게 지지한다. COACHING · 골반을 무조건 뒤로 빼지 말고 발 전체 지지를 유지하며 목은 척추 곡선에 따라 자연스럽게 움직인다.","breath":"SOURCE · INHALE Ready → EXHALE Roll Down & Pedal Press → INHALE Pedal Up → EXHALE Roll Up → INHALE Return to Starting Position.","check":"SOURCE · 어깨와 목의 긴장에 주의; 팔꿈치가 Rocking되지 않고 바닥 방향을 향하도록 하며 손목이 꺾이지 않게; 팔의 힘으로 페달을 누르지 않음; 척추의 순차적 움직임에 집중; 발바닥 전체에 체중을 고르게 싣고 무릎 과신전을 피함. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Articulation; Hip Flexion / Extension; Scapula Stabilizer. COACHING · 시선은 내려가는 동안 바닥 쪽으로 이동하고 올라오면서 정면으로 돌아온다.","regress":"COACHING · 페달을 끝까지 누르기보다 척추 분절이 가능한 범위에서 동작하고, 무릎을 잠그지 않는다. 원본에 별도 단계별 회귀는 없다.","variations":"SOURCE · 별도 Variation 항목 없음. COACHING · 작은 가동범위와 호흡 속도 조절로 난이도를 조절한다."},"cadillac-page-65":{"target":"SOURCE · p.65 Push Thru - Cat Spine Stretch: 흉·요추와 척추 분절운동, 척추 유연성 증가, 어깨 안정성 및 복부 근력 강화. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Articulation; Scapula Stabilizer; Abdominis & Oblique.","alignment":"SOURCE · Starting Position: 척추 중립, 정강이는 바닥에 대고 무릎을 세워 골반 넓이로 앉아 Push-thru Bar를 잡는다. 사진 1: 무릎을 꿇고 상체 세움·양손 바 잡음. 사진 2: 골반과 척추를 굴곡하며 바를 전방으로 민다. 사진 3: 엉덩이를 뒤로 보내며 팔을 길게 뻗어 둥근 등 유지. 시선은 굴곡 진행에 따라 아래쪽. 발등/정강이가 바닥에 닿는 자세; 고관절은 무릎 위에서 시작해 뒤로 이동한다.","breath":"SOURCE · INHALE Ready → EXHALE Articulation → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · 동작 중 척추가 한 번에 무너지지 않게 순차 굴곡. 강하게 미는 동안 무릎이 당기지 않도록. Bar를 놓지 않는다. 시작자세로 돌아올 때 엉덩이가 뒤로 빠지지 않고 복부 힘으로 가져온다.","regress":"COACHING · 무릎 압박이 있으면 패드 사용, 가동범위와 바 저항을 낮춘다. 고관절 이동과 척추 굴곡을 구별해 관찰한다.","variations":"SOURCE · 앉은 자세로 하기."},"cadillac-page-58":{"target":"SOURCE · p.58 Push-thru on Back with Roll Up: 척추 분절인지, 복근 강화, 어깨 안정화. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Flexion: Rectus Abdominis & Oblique; Elbow Flexion/Extension; Scapula Stabilizer.","alignment":"SOURCE · Starting Position: 척추 중립, Push-thru Bar 쪽으로 머리를 두고 바닥에 눕는다. 두 다리는 굽혀 발바닥을 바닥에 두며 팔을 들어 바를 잡는다. 사진 1 누워 팔 뻗음 → 사진 2 팔꿈치 굴곡 → 사진 3 상체를 말아 올려 바를 밀며 긴 선 유지 → 사진 4 척추 분절 하강 → 사진 5 시작자세. 고관절과 무릎은 굴곡 상태를 유지하며 발바닥은 바닥에 접촉한다. 시선은 롤업 과정에서 몸통을 따라 전방으로 이동.","breath":"SOURCE · INHALE Elbow Flexion → EXHALE Roll Up & One Long Line → INHALE Roll Down & Elbow Flexion → EXHALE Return to Starting Position.","check":"SOURCE · 척추를 순차적으로 움직이며 Bar가 머리에서 척추를 굴곡하지 않도록 주의. 목 근육의 사용에 집중해야 한다는 원문은 경추 과긴장 유도 지시로 해석하지 않는다. 척추를 길게 펴며 Bar에 매달려 있지 않도록. 손목이 꺾이지 않도록.","regress":"COACHING · Roll Up이 불편하면 가동범위를 줄이고 복부 굴곡과 팔꿈치 굴곡의 순서를 분리한다. 목 통증이 있으면 중단하고 대안을 선택한다.","variations":"SOURCE · 발 움직임 안 하기."},"cadillac-page-61":{"target":"SOURCE · p.61 Push-thru on Stomach with Back Extension: 흉근 스트레칭, 척추·삼두근·능형근·목과 등 신전근 및 둔근 강화. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Extensor; Scapula Stabilizer.","alignment":"SOURCE · Starting Position: 척추와 골반 중립, Push-thru Bar 쪽에 머리를 두고 엎드려 양손으로 바를 잡는다. 다리는 고관절과 무릎을 펴고 발바닥이 아닌 발등을 매트에 둔다. 사진 1 복와위 양팔 뻗음 → 사진 2 팔꿈치 굽힘 → 사진 3 팔꿈치 폄과 척추 신전으로 상체 상승 → 사진 4 중립으로 복귀 → 사진 5 팔꿈치 펴고 시작. 시선은 상체 상승을 따라 자연스럽게 전방으로 향하되 목을 과신전하지 않는다.","breath":"SOURCE · INHALE Elbow Flexion → EXHALE Back Extension & Reach Arm Ceiling → INHALE Neutral Spine & Elbow Flexion → EXHALE Return to Starting Position.","check":"SOURCE · 경추나 요추에서 과신전이 일어나지 않도록. 척추 신전은 팔을 이용하지 않도록 주의하면서 손과 척추의 움직임을 조절한다. 운동 후 Spine Release로 척추를 쉬어준다.","regress":"COACHING · 흉추 신전 범위부터 조절하고 골반·하지의 매트 접촉을 유지한다. 허리 통증이 유발되면 범위를 줄이거나 중단한다.","variations":"SOURCE · 신전 제한 또는 범위 조정하기; 팔의 움직임만 먼저 인지해보기."},"cadillac-page-63":{"target":"SOURCE · Cadillac Guillotine, photographed printed p.63. Movement Point: Transverse Abdominis, Pelvic Floor; Hip & Knee Flexion/Extension; Ankle Plantar Flexion & Dorsi Flexion; Scapula Stabilizer. Why: spine articulation and stability where indicated.","alignment":"SOURCE · Supine beneath Push-thru Bar, hands grip bar; legs rise and articulate through spinal roll up/down. COACHING · Keep gaze neutral relative to head and spine, pelvis stable, both feet securely supported where in contact; avoid forced hip rotation.","breath":"SOURCE · INHALE Lengthen — Knee, Ankle → EXHALE Roll Up → INHALE Flexion — Hip, Knee, Ankle → EXHALE Extension — Hip, Knee, Ankle → INHALE Keep → EXHALE Roll Down → INHALE Return to Starting Position","check":"SOURCE · Maintain stable shoulders and controlled spring/bar travel; follow photographed sequential alignment. COACHING · Avoid jerking spring-loaded bar, foot slipping, rib flare, or cervical loading; instructor spotting is appropriate.","regress":"COACHING · Shorten range or simplify ankle/leg phase with instructor supervision; not printed source.","variations":"SOURCE · No separately labeled variation visible."},"cadillac-page-66":{"target":"SOURCE · Cadillac Lat Press, photographed printed p.66. Movement Point: Transverse Abdominis, Pelvic Floor; Neutral Spine; Scapula Stabilizer; Scapula Depression. Why: spine articulation and stability where indicated.","alignment":"SOURCE · Seated facing bar, legs extended and feet supported, hands on Roll Down Bar. Press bar downward with shoulder/scapular depression. COACHING · Keep gaze neutral relative to head and spine, pelvis stable, both feet securely supported where in contact; avoid forced hip rotation.","breath":"SOURCE · INHALE Ready → EXHALE Lat Press → INHALE Return to Starting Position","check":"SOURCE · Maintain stable shoulders and controlled spring/bar travel; follow photographed sequential alignment. COACHING · Avoid jerking spring-loaded bar, foot slipping, rib flare, or cervical loading; instructor spotting is appropriate.","regress":"COACHING · Shorten range or simplify ankle/leg phase with instructor supervision; not printed source.","variations":"SOURCE · Variation: knees bent; one-arm press."},"cadillac-page-62":{"target":"SOURCE · Cadillac Leg Press, photographed printed p.62. Movement Point: Transverse Abdominis, Pelvic Floor; Hip & Knee Flexion/Extension; Ankle Plantar Flexion & Dorsi Flexion; Scapula Stabilizer. Why: spine articulation and stability where indicated.","alignment":"SOURCE · Supine under Push-thru Bar, knees flexed, both feet contact bar; extend lower limbs and alternate ankle dorsiflexion/plantarflexion. COACHING · Keep gaze neutral relative to head and spine, pelvis stable, both feet securely supported where in contact; avoid forced hip rotation.","breath":"SOURCE · INHALE Lengthen — Hip, Knee, Ankle → EXHALE Dorsi Flexion → INHALE Plantar Flexion → EXHALE Return to Starting Position","check":"SOURCE · Maintain stable shoulders and controlled spring/bar travel; follow photographed sequential alignment. COACHING · Avoid jerking spring-loaded bar, foot slipping, rib flare, or cervical loading; instructor spotting is appropriate.","regress":"COACHING · Shorten range or simplify ankle/leg phase with instructor supervision; not printed source.","variations":"SOURCE · Variation: Single Leg Press."},"cadillac-page-64":{"target":"SOURCE · Cadillac Monkey, photographed printed p.64. Movement Point: Transverse Abdominis, Pelvic Floor; Hip & Knee Flexion/Extension; Ankle Plantar Flexion & Dorsi Flexion; Scapula Stabilizer. Why: spine articulation and stability where indicated.","alignment":"SOURCE · Supine below Push-thru Bar, hands grasp bar and feet contact bar, extend knees and elbows to lengthen. COACHING · Keep gaze neutral relative to head and spine, pelvis stable, both feet securely supported where in contact; avoid forced hip rotation.","breath":"SOURCE · INHALE Lengthen — Elbow, Knee, Ankle → EXHALE Dorsi Flexion → INHALE Plantar Flexion → EXHALE Return to Starting Position","check":"SOURCE · Maintain stable shoulders and controlled spring/bar travel; follow photographed sequential alignment. COACHING · Avoid jerking spring-loaded bar, foot slipping, rib flare, or cervical loading; instructor spotting is appropriate.","regress":"COACHING · Shorten range or simplify ankle/leg phase with instructor supervision; not printed source.","variations":"SOURCE · No separate variation section visible."},"cadillac-p73":{"target":"SOURCE · Cadillac Spread Eagle, printed p.73. Why: strength and stability of spine/arms/shoulders and posterior chain. Movement Point: Transverse Abdominis, Pelvic Floor, Spinal Articulation, Cervical & Upper Thoracic Extension, Scapula Stabilizer, Hip Extensor.","alignment":"SOURCE · Suspended from Cadillac horizontal upper bar with both hands; feet supported on trapeze straps, body initially in a pike-like hanging position. COACHING · Gaze follows cervical articulation without throwing head back; maintain symmetrical foot contact and hip extension through the long-line phase.","breath":"SOURCE · INHALE Ready → EXHALE Roll Up & One Long Line → INHALE Elbow Flexion & Cervical and Thoracic Extension → EXHALE Elbow Extension & Spinal Articulation → INHALE Return to Starting Position.","check":"SOURCE · Avoid over-gripping or letting hands slip; coordinate sequential spinal movement, avoid losing shoulder support. COACHING · Secure trapeze and overhead grip; supervise suspension; avoid uncontrolled neck extension or sudden drop.","regress":"COACHING · Work supported spinal articulation before full suspension.","variations":"SOURCE · 척추 신전 제외 하기 (omit spinal extension)."},"cadillac-p74":{"target":"SOURCE · Cadillac Pull Up, printed p.74. Why: strength and stability of spine, arms, shoulders, glutes, abdominals and back. Movement Point: Transverse Abdominis/Pelvic Floor, Spinal Articulation, Scapula Stabilizer, Elbow Flexion, Hip Extensor.","alignment":"SOURCE · Hands hold overhead Cadillac horizontal bar; feet supported on trapeze straps, body begins in a pike position with hips flexed. COACHING · Keep symmetric foot support, shoulders organized, pelvis level; gaze follows spine and avoid neck thrusting.","breath":"SOURCE · INHALE Ready → EXHALE Roll Up & One Long Line → INHALE Keep → EXHALE Elbow Flexion → INHALE Elbow Extension → EXHALE Return to Starting Position.","check":"SOURCE · Avoid slipping hand grip; maintain shoulder alignment and spinal segmental control, do not swing body. COACHING · Supervised overhead apparatus loading; avoid compensatory lumbar extension and sudden spring release.","regress":"COACHING · Practice supported elbow flexion and controlled trunk articulation before full suspended pull-up.","variations":"SOURCE · No separate printed variation visible on p.74."},"cadillac-p70":{"target":"SOURCE · Cadillac Push-thru with Feet — Double Leg Pump, printed p.70. Why/Movement Point: Knee flexors; Transverse Abdominis/Pelvic Floor; hip and knee flexion/extension; scapular stabilizers.","alignment":"SOURCE · Supine on Cadillac with feet supported against Push-thru Bar, arms beside trunk; knees flex then extend and pelvis lifts into one long line. COACHING · Gaze upward, symmetric foot contact, neutral hip tracking; for single-leg phase maintain level pelvis.","breath":"SOURCE · INHALE Knee Flexion → EXHALE Knee Extension & Roll Up & One Long Line → INHALE Keep → EXHALE Double Leg Pump 3 Pulse → INHALE Knee Extension & Roll Up & One Long Line → EXHALE Roll Down & Neutral → INHALE Knee Flexion → EXHALE Knee Extension & Return","check":"SOURCE · Follow photographed spinal articulation and controlled bar movement. COACHING · Avoid pelvic rotation, foot slipping, rib flare, knee hyperextension and shoulder/neck bracing; spring-loaded bar requires instructor supervision.","regress":"COACHING · Use smaller range, omit pulses, reduce spring challenge under supervision.","variations":"SOURCE · Prep: 다리의 움직임만 해보기 (Push-thru Bar 움직임 인지)"},"cadillac-p71":{"target":"SOURCE · Cadillac Push-thru with Feet — Single Leg, printed p.71. Why/Movement Point: Hip extensors; hip flexor/extensor coordination; pelvic stability.","alignment":"SOURCE · Supine on Cadillac with feet supported against Push-thru Bar, arms beside trunk; knees flex then extend and pelvis lifts into one long line. COACHING · Gaze upward, symmetric foot contact, neutral hip tracking; for single-leg phase maintain level pelvis.","breath":"SOURCE · INHALE Knee Flexion → EXHALE Knee Extension & Roll Up & One Long Line → INHALE One Leg Hip Flexion with Reach Ceiling → EXHALE Hip Extension & One Long Line → INHALE Other Leg Hip Flexion with Reach Ceiling → EXHALE Hip Extension & One Long Line → INHALE Roll Down → EXHALE Knee Flexion & Return","check":"SOURCE · Follow photographed spinal articulation and controlled bar movement. COACHING · Avoid pelvic rotation, foot slipping, rib flare, knee hyperextension and shoulder/neck bracing; spring-loaded bar requires instructor supervision.","regress":"COACHING · Use smaller range, omit pulses, reduce spring challenge under supervision.","variations":"SOURCE · 팔 다리만 하기; 뻗는 다리 구부리기"},"cadillac-p72":{"target":"SOURCE · Cadillac Push-thru with Feet — Single Leg Pump, printed p.72. Why/Movement Point: Hip extensors, knee flexors, pelvic stability; source title is Single Leg Pump, NOT Leg Circles.","alignment":"SOURCE · Supine on Cadillac with feet supported against Push-thru Bar, arms beside trunk; knees flex then extend and pelvis lifts into one long line. COACHING · Gaze upward, symmetric foot contact, neutral hip tracking; for single-leg phase maintain level pelvis.","breath":"SOURCE · INHALE Knee Flexion → EXHALE Roll Up & One Long Line → INHALE One Leg Hip Flexion with Reach Ceiling → EXHALE Single Leg Pump 3 Pulse → INHALE Knee Extension → EXHALE Hip Extension & One Long Line → INHALE Roll Down → EXHALE Knee Flexion & Return","check":"SOURCE · Follow photographed spinal articulation and controlled bar movement. COACHING · Avoid pelvic rotation, foot slipping, rib flare, knee hyperextension and shoulder/neck bracing; spring-loaded bar requires instructor supervision.","regress":"COACHING · Use smaller range, omit pulses, reduce spring challenge under supervision.","variations":"SOURCE · Pulse 제외하기; 뻗는 다리 구부리기"},
"010":{target:"SOURCE · Why: 복부운동의 기본 동작. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Rectus Abdominis (복직근), Obliques (복사근), Scapular Stabilizers (견갑 안정근).",alignment:"SOURCE · Starting Position: Spine & Pelvis Neutral (척추·골반 중립). 양 무릎 굽히고 발 골반 너비, 양팔 편안하게 내려놓기. Gaze (시선): 천장 → 상체 굴곡 시 허벅지 방향. COACHING · 발바닥 전체 안정적으로 지지, 고관절 회전은 중립, 요추와 골반은 매트에 유지.",breath:"INHALE · Shoulder Flexion (팔을 천장 쪽으로 들어 올리기).\\nEXHALE · Head Nod + Cervical & Upper Thoracic Flexion (턱 끄덕이고 경추·상부 흉추 굴곡, 견갑골이 살짝 들릴 때까지).\\nINHALE · Keep (유지).\\nEXHALE · Return to Starting Position (상부 흉추와 머리를 천천히 내려놓기; 허리를 말아 내려오는 Roll Down 아님).",check:"SOURCE · 어깨와 목에 긴장이 생기지 않게 주의. 골반은 반드시 중립 유지. COACHING · 허리나 골반이 따라 들리지 않게 하고 턱을 과하게 가슴에 붙이지 않기. 복부 조절로 움직이며 목만 당기지 않기.",regress:"COACHING · Head Nod만 연습 → 견갑골을 조금만 들어 올리기 → 전체 Curl Up. 목 불편감 시 손으로 머리를 지지하고 범위 축소.",variations:"SOURCE · Arc Barrel / 소도구(Circle, Spacer, Ball 등) / 두 다리 Leg Folding / 손 머리에 두기. COACHING · 각각의 변형에서도 척추·골반 중립과 상부 흉추 굴곡 범위를 유지."},
"011":{target:"SOURCE · Why: Abdominal Muscular Endurance (복부 근지구력 강화). Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Spinal Flexion — Rectus Abdominis & Obliques (복직근·복사근), Scapular Stabilizers (견갑 안정근), Shoulder Movement (어깨 움직임).",alignment:"SOURCE · Starting Position: Both legs in Leg Folding (두 다리 레그 폴딩), arms resting by sides (양팔 편안하게 내리기), eyes to ceiling (천장 바라보기). PHOTO · 두 다리는 공중에 있어 발바닥 접촉 없음. Hundred position 사진은 다리 신전과 상부 몸통 굴곡을 보여 줌. COACHING · 고관절 회전 중립, 무릎과 발끝 방향 유지, 어깨와 목 과긴장 방지.",breath:"SOURCE · INHALE: Shoulder Flexion (어깨 굴곡, 팔 천장으로).\\nEXHALE: Hundred Position (상체 굴곡과 팔 내리고 다리 뻗어 준비).\\nINHALE: 5 Pulse (팔 5회 펄스).\\nEXHALE: 5 Pulse (팔 5회 펄스).\\nRepeat 10 sets = 100 counts (10세트 총 100카운트).\\nINHALE & EXHALE: Return to Starting Position (호흡하며 시작 자세 복귀).",check:"SOURCE · Watch Point: 어깨와 목에 긴장이 생기지 않게. 팔의 작은 움직임이 팔꿈치나 손목에서 일어나지 않도록. 운동 중 척추 굴곡 유지. PHOTO · 두 번째 사진의 붉은 필기: ‘허리를 붙이도록’. COACHING · 허리가 뜨거나 목이 불편하면 다리를 Tabletop으로 유지하고 머리를 내려 난이도를 낮추기.",regress:"COACHING · Tabletop with head down (머리 내려놓고 다리 레그 폴딩) → 상체 작은 굴곡 → 다리 Tabletop 유지한 채 팔 펄스 → 다리 신전. 허리 들림이 없는 범위까지만.",variations:"SOURCE · Arc Barrel (아크 배럴) / Small Props: Circle, Spacer, Ball (서클·스페이서·볼) / Staccato Breathing (스타카토 호흡). COACHING · 무릎 굽힌 Tabletop 유지, 다리 높이 조절, 팔 펄스 범위 축소."},

detail["011"]={target:"Abdominal endurance (복부 근지구력) · Transverse Abdominis, Pelvic Floor, Rectus Abdominis, Obliques, Scapular Stabilizers",alignment:"SOURCE · Supine, both legs Leg Folding / Tabletop; arms at sides; gaze ceiling. COACHING · pelvis supported, legs airborne, feet not planted, eyes toward thighs when curled.",breath:"INHALE · Shoulder Flexion (양팔 천장으로).\\nEXHALE · Hundred Position (상부 흉추 굴곡, 팔 몸통 옆).\\nINHALE · 5 Pulses.\\nEXHALE · 5 Pulses. Repeat 10 sets / 100 counts.\\nINHALE & EXHALE · Return to start.",check:"SOURCE · Neck/shoulder relaxed; pulses initiated from arms rather than elbows or wrists; maintain spinal flexion throughout.",regress:"COACHING · Keep knees tabletop, smaller arm pulses, head supported on mat if needed.",variations:"SOURCE · Arc Barrel / Circle, Spacer, Ball / Staccato breathing. COACHING · Keep head supported as a preparatory variation."};
detail["012"]={target:"Hip mobility (고관절 가동성) · Transverse Abdominis, Pelvic Floor; Hip Flexors, Abductors, Adductors, Extensors",alignment:"SOURCE · Spine and pelvis neutral; both legs extended; one leg lifted toward ceiling; arms long, gaze ceiling. COACHING · grounded heel supported; lifted leg hip neutral, foot free in air.",breath:"INHALE · Hip Abduction & Extension (다리를 바깥·아래로).\\nEXHALE · Hip Adduction & Flexion (중앙·위로 원 마무리).\\nRepeat 3–8 in one direction, then reverse.",check:"SOURCE · Circle originates at hip; pelvis remains neutral and torso still; only as large as pelvic stability allows.",regress:"SOURCE · Bend knee. COACHING · Smaller circle or lower supporting leg bent.",variations:"SOURCE · Bend knee / Lift arms toward ceiling. COACHING · Vary circle size while maintaining pelvis."};
detail["013"]={target:"Trunk-pelvis-shoulder stability (몸통·골반·견갑 안정) · Abdominals, Hip Flexors",alignment:"SOURCE · Pelvis/spine Imprinting; both legs Leg Folding; cervical and upper thoracic flexion; hands by knees; gaze toward knees. COACHING · feet off mat, hips in parallel.",breath:"INHALE · Ready.\\nEXHALE · Single Leg Extension.\\nINHALE · Starting Position.\\nEXHALE · Other Leg Extension.\\nINHALE · Return to Starting Position.",check:"SOURCE · No neck/shoulder strain; keep spinal flexion; keep leg alignment through exchanges.",regress:"SOURCE · Arc Barrel / Lower upper body onto mat. COACHING · Reduce leg extension range.",variations:"SOURCE · Arc Barrel / Upper body down. COACHING · Extend leg higher to reduce lumbar load."};
detail["014"]={target:"Coordination (협응) · Trunk/pelvic stability (몸통·골반 안정) · Abdominals, Hip Flexors",alignment:"SOURCE · Pelvis/spine Imprinting; legs extended toward ceiling; cervical and upper thoracic flexion; hands outside knees; gaze toward legs. COACHING · no foot-ground contact.",breath:"INHALE · Ready.\\nEXHALE · Scissors & Pulse Leg (다리 교대, 짧은 펄스).\\nINHALE · Return to Starting Position.",check:"SOURCE · Smooth coordinated leg action; retain spinal flexion and pelvic stability.",regress:"COACHING · Small leg separation; support head if required.",variations:"SOURCE · Arc Barrel / Lower upper body to mat / Omit pulse."};
detail["015"]={target:"Trunk-pelvis-scapular stability (몸통·골반·견갑 안정) · Abdominals, Obliques, Hip Flexors",alignment:"SOURCE · Pelvis/spine Imprinting; both legs Leg Folding; upper trunk flexed; hands behind head. COACHING · gaze follows trunk rotation, not elbow.",breath:"INHALE · Ready.\\nEXHALE · Rotate trunk & extend one leg.\\nINHALE · Starting Position.\\nEXHALE · Rotate other side & extend opposite leg.\\nINHALE · Return to Starting Position.",check:"SOURCE · Stable rib cage and pelvis; rotate through flexed spine, not momentum; maintain leg alignment.",regress:"COACHING · Keep legs tabletop and rotate torso only.",variations:"SOURCE · Arc Barrel / Perform without leg extension."};
detail["016"]={target:"Arm-leg coordination (사지 협응) · Abdominal stability (복부 안정)",alignment:"SOURCE · Spine/pelvis Imprinting; both legs Leg Folding; upper thoracic flexion; hands by knees. COACHING · gaze knees, no foot-ground contact.",breath:"INHALE · Ready.\\nEXHALE · Reach legs & arms away simultaneously.\\nINHALE · Return to Starting Position.",check:"SOURCE · Avoid shoulder/neck tension; keep spinal flexion during reach; maintain leg alignment. COACHING · do not lift rib cage or let lower back arch.",regress:"COACHING · Reach only arms or legs; keep legs higher.",variations:"SOURCE · Arc Barrel / Lower upper body to mat."};
detail["017"]={target:"Abdominal strength (복부 강화) · Hip flexor/extensor control",alignment:"SOURCE · Spine/pelvis Imprinting; both legs initially Leg Folding, arms by sides; extend both legs diagonally toward ceiling. COACHING · gaze ceiling, legs parallel.",breath:"INHALE · Hip Flexion (다리 들어 올리기).\\nEXHALE · Hip Extension (다리 내려가기).\\nINHALE · Starting Position.",check:"SOURCE · Do not push excessively with arms; lower only within range that maintains pelvic imprinting.",regress:"COACHING · Bend knees slightly or limit lowering angle.",variations:"SOURCE · Arc Barrel / Slightly bend knees."};
detail["010"]={"target":"SOURCE · Printed p.12. Why: Basic abdominal exercise / 복부운동의 기본동작. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), spinal flexion by Rectus Abdominis & Obliques (복직근·복사근), Scapular Stabilizers (견갑 안정근). COACHING · Cervical flexors assist the initial head nod; not explicitly listed in printed Movement Point.","alignment":"SOURCE · Supine with neutral spine and pelvis (척추·골반 중립); knees bent hip-width, arms relaxed down, gaze ceiling. Sequence photo shows shoulder flexion with arms toward ceiling, then head and upper-thoracic curl; feet stay planted on mat. COACHING · Keep neck long and gaze toward knees during curl without chin jamming; pelvis stays neutral rather than deliberately posteriorly tilting.","breath":"SOURCE · INHALE Shoulder Flexion (어깨 굴곡) → EXHALE Head Nod & Cervical and Upper Thoracic Flexion (고개 끄덕임·경추와 상부 흉추 굴곡) → INHALE Keep (유지) → EXHALE Return to Starting Position (시작 자세로 복귀).","check":"SOURCE · Avoid unnecessary shoulder and neck tension; pelvis must remain neutral (어깨와 목 긴장 방지, 골반 중립 유지). COACHING · Do not pull with arms or flatten the lumbar spine to gain height.","regress":"SOURCE · Arc Barrel; small props such as Circle/Spacer/Ball; both legs in Leg Folding; hands behind head. COACHING · Reduce lift height and support head if needed.","variations":"SOURCE · Arc Barrel (아크 배럴); 소도구 Circle/Spacer/Ball; 두 다리 Leg Folding; 손 머리에 두기. Red handwritten notes are coaching annotations, not printed directions. Curl Up is a PARTIAL upper-spine curl with knees bent; it does NOT roll to sitting."};
detail["018"]={"target":"SOURCE · Printed p.20. Why: Improve spinal segmental articulation and strengthen abdominals (척추 분절 능력 향상·복부 강화). Movement Point: Transverse Abdominis, Pelvic Floor; spinal flexion Rectus Abdominis & Obliques; Hip Flexors; Scapular Stabilizers. COACHING · Unlike Curl Up, Roll Up travels through a full seated roll and back down.","alignment":"SOURCE · Supine neutral spine/pelvis, BOTH legs extended at hip width, ankles dorsiflexed (발등 굴곡), gaze ceiling, arms overhead. Photographs show heels on mat during ascent, then articulated seated forward flexion and controlled return. COACHING · Avoid lifting legs or bouncing to gain momentum.","breath":"SOURCE · INHALE Shoulder Flexion (어깨 굴곡) → EXHALE Roll Up (롤 업) → INHALE Roll Down (롤 다운) → EXHALE Starting Position (시작 자세 복귀). Note: this is printed sequence, not interchangeable with Curl Up.","check":"SOURCE · Focus on sequential segmental spinal motion; stabilize rib cage so arm movement does not lift shoulders excessively; do not extend spine long when curling forward. COACHING · Move without momentum and avoid neck strain.","regress":"SOURCE · Bend knees (무릎 구부리기); press heels down (손등 눌러주기 appears in printed variation; wording is 손등, not heels); rise only to upper thorax (흉추 상부까지만 올라오기). COACHING · Keep a smaller range if unable to articulate.","variations":"SOURCE · 무릎 구부리기; 손등 눌러주기; 흉추 상부까지만 올라오기. Printed page p.20. Handwritten notes are not counted as printed source. DISTINCT from Curl Up p.12: legs straight, full roll to seated, different breathing phases."}; arms overhead, gaze ceiling. COACHING · heels rest on mat.",breath:"INHALE · Shoulder Flexion.\\nEXHALE · Roll Up (척추 순차 굴곡해 앉기).\\nINHALE · Roll Down (척추 순차 하강).\\nEXHALE · Starting Position.",check:"SOURCE · Segmental spinal movement; stabilize rib cage against arm lift; avoid long rigid spine while flexing forward.",regress:"SOURCE · Bend knees / Press heels down / Rise only to upper thorax.",variations:"SOURCE · Bend knees / Press heels down / Partial upper-thoracic curl."};
detail["019"]={target:"Spinal articulation (척추 분절) · Hip flexor and abdominal strength",alignment:"SOURCE · Spine/pelvis neutral, knees bent hip width, feet on mat; arms overhead, gaze ceiling. COACHING · whole feet supported.",breath:"INHALE · Shoulder Flexion.\\nEXHALE · Roll Up.\\nINHALE · Cervical & Upper Thoracic Extension (C-curve에서 상부 척추 길게 펴기).\\nEXHALE · Roll Down & Return to Start.",check:"SOURCE · Legs remain still; extend cervical/upper thoracic spine beyond C-curve; articulate spine sequentially.",regress:"COACHING · Smaller roll-back range, support thighs.",variations:"SOURCE · Use small props / Extend arms overhead."};
detail["020"]={target:"Spinal articulation (척추 분절) · Hip flexor and abdominal strength",alignment:"SOURCE · Spine/pelvis neutral, legs straight together; arms beside hips, gaze ceiling. COACHING · heels supported initially.",breath:"INHALE · Ready.\\nEXHALE · Roll Up to V Position (V자 균형).\\nINHALE · Keep.\\nEXHALE · Roll Down & Return to Start.",check:"SOURCE · Extend cervical/upper thoracic spine after C-curve; sequential spinal articulation. COACHING · avoid momentum.",regress:"COACHING · Teaser Prep with bent knees.",variations:"SOURCE · Use small props."};
detail["021"]={target:"Pelvic floor & Transverse Abdominis activation; Hip Extensors; hip-joint weight-bearing awareness",alignment:"SOURCE · Spine/pelvis neutral, knees bent hip width, arms by sides, gaze ceiling. COACHING · whole feet planted, parallel hips.",breath:"INHALE · Ready.\\nEXHALE · Bridge Position.\\nINHALE · Single Leg Hip Flexion.\\nEXHALE · Single Leg Hip Extension (3 repetitions).\\nINHALE · Bridge Position.\\nEXHALE · Starting Position.",check:"SOURCE · Stabilize lumbar region with abdominals; prevent spinal rotation; avoid using shoulders/arms to lift; move from hip joints.",regress:"SOURCE · Basic Bridge. COACHING · Keep both feet down before single-leg version.",variations:"SOURCE · Bridge / Arc Barrel."};
detail["022"]={target:"Hip abduction/adduction control (고관절 벌림·모음) · Spinal articulation · Abdominals",alignment:"SOURCE · Spine/pelvis Imprinting, legs straight diagonally, arms by sides, gaze ceiling.",breath:"INHALE · Hip Flexion.\\nEXHALE · Roll Over.\\nINHALE · Leg Abduction.\\nEXHALE · Roll Down.\\nINHALE · Leg Adduction.",check:"SOURCE · Segmental spine movement; do not push with arms; do not swing legs; control roll-over and return speed. COACHING · never turn head while inverted.",regress:"COACHING · Small pelvic curl before full inversion; avoid with unsuitable cervical conditions.",variations:"SOURCE · Omit leg abduction/adduction."};
detail["023"]={target:"Spinal flexion awareness (척추 굴곡 인지) · Abdominal control · Sitting endurance",alignment:"SOURCE · Spine/pelvis neutral; sit with knees bent hip width, arms at shoulder height, gaze forward. COACHING · sit bones grounded, soles supported.",breath:"INHALE · Ready.\\nEXHALE · Head Nod & Spinal Flexion.\\nINHALE · Return to Starting Position.",check:"SOURCE · Even segmental flexion; avoid collapsing under gravity; avoid excessive leg tension.",regress:"SOURCE · Sit on elevated surface / Straighten knees / Hip Opener.",variations:"SOURCE · Elevated sitting / Straight knees / Hip Opener."};
detail["024"]={target:"Spinal and pelvic movement awareness (척추·골반 움직임 인지)",alignment:"SOURCE · Spine/pelvis neutral, knees bent hip width, arms shoulder height, sit bones grounded, gaze forward.",breath:"INHALE · Ready.\\nEXHALE · Roll Back (골반 움직임에서 시작).\\nINHALE · Starting Position.",check:"SOURCE · Initiate with hip/pelvic movement; focus on cervical alignment so head does not jut forward.",regress:"COACHING · Small posterior pelvic tilt only.",variations:"SOURCE · Use small props / Change arm position."};
detail["025"]={target:"Spinal/pelvic movement awareness (척추·골반 인지) · Hip flexor control",alignment:"SOURCE · Spine/pelvis neutral, knees bent hip width, arms shoulder height, gaze forward; sit bones grounded.",breath:"INHALE · Ready.\\nEXHALE · Lean Back (척추 중립 유지하며 고관절에서 기울이기).\\nINHALE · Starting Position.",check:"SOURCE · Avoid lumbar hyperextension; maintain neutral spine and hinge from hip joint. Not a C-curve roll back.",regress:"COACHING · Small hinge range.",variations:"SOURCE · Use small props / Change arm position."};
detail["026"]={target:"Spinal articulation (척추 분절) · Abdominal activation awareness",alignment:"SOURCE · Seated, spine/pelvis neutral, knees bent hip width, elbows bent with hands at forehead. COACHING · feet fully planted.",breath:"INHALE · Ready.\\nEXHALE · Lumbar Roll Down.\\nINHALE · Keep.\\nEXHALE · Spine Flex Forward.\\nINHALE · Starting Position.",check:"SOURCE · Initiate from hip/pelvis; avoid head thrusting forward; articulate spine sequentially. This is seated Roll Down, NOT standing roll down.",regress:"COACHING · Small lumbar roll back only.",variations:"SOURCE · Change arm position."};
detail["027"]={target:"Dynamic trunk stability (움직임 중 몸통 안정) · Balance and acceleration awareness",alignment:"SOURCE · Balance behind sit bones, pelvis tipped back, C-curve spine; knees drawn together, hold outside shins, gaze thighs.",breath:"INHALE · Roll Back.\\nEXHALE · Starting Position (다시 균형).",check:"SOURCE · Even spinal curve; abdominal-driven rolling; no head thrust or leg momentum; do not roll onto neck; maintain ASIS–pubic bone alignment.",regress:"SOURCE · Rolling Like a Ball Prep: balance hold.",variations:"SOURCE · Prep balance / Seal / Open Leg Rocker."};
detail["028"]={target:"Hip flexor strength (고관절 굴곡근) · Shoulder control · Lower abdominal control",alignment:"SOURCE · Lean back onto forearms with spine flexed, legs together extended upward, gaze forward. COACHING · elbows/forearms support, feet airborne.",breath:"INHALE · Ready.\\nEXHALE · Hip Circumduction (고관절에서 양다리 원).\\nINHALE · Starting Position.\\nEXHALE · Reverse circle.\\nINHALE · Starting Position.",check:"SOURCE · No hip-joint rotation substituted for circumduction; keep pelvis/spine stable; stable shoulder girdle and upright head/neck.",regress:"COACHING · Smaller circle, bent knees.",variations:"SOURCE · Lower one leg to mat / Bend knees."};
detail["029"]={target:"Thoracic rotation (흉추 회전) · Obliques (복사근) · Pelvic stability",alignment:"SOURCE · Spine/pelvis neutral, legs straight hip width, arms at shoulder height, gaze follows rotation. COACHING · heels on mat, ankles dorsiflexed.",breath:"INHALE · Ready.\\nEXHALE · Rotation & 3 Pulses.\\nINHALE · Starting Position.",check:"SOURCE · Rotate in transverse plane only; articulate without momentum; pelvis stays facing forward.",regress:"SOURCE · Sit elevated / Bend knees.",variations:"SOURCE · Sit elevated / Bend knees."};
detail["030"]={target:"Thoracic rotation & spinal flexion (흉추 회전·굴곡) · Obliques",alignment:"SOURCE · Spine/pelvis neutral, legs straight hip width, arms open at shoulder height, gaze follows rotating/front foot.",breath:"INHALE · Ready.\\nEXHALE · Spinal Rotation & Flexion.\\nINHALE · Roll Up.\\nEXHALE · Starting Position.",check:"SOURCE · Rotate spine while pelvis remains still; avoid excessive lower-limb tension; control flexion without collapsing under gravity.",regress:"SOURCE · Sit elevated.",variations:"SOURCE · Sit elevated."};
detail["051"]={"target":"SOURCE · Why: 몸통·견갑대 안정화, 어깨 주변 및 복부 강화, 중립 척추 인지. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Oblique (복사근), Multifidus (다열근), Gluteus Maximus (대둔근), Scapula Stabilizers (견갑 안정근).","alignment":"SOURCE · Starting Position: 척추·골반 Neutral (중립), 손은 어깨 바로 아래, 다리를 모아 길게 펴고 발가락으로 지지하며 팔꿈치를 편다. COACHING · Hip Rotation (고관절 회전): Neutral (중립). 손바닥 전체와 발가락 앞쪽으로 체중 분산; 지지 발 뒤꿈치는 들려 있음. Gaze (시선): 손보다 조금 앞쪽 바닥, 목은 척추 연장선.","breath":"SOURCE · INHALE One Leg Lift (한 다리 들기) → EXHALE Plantar Flexion (발끝 뻗기) → INHALE Dorsi Flexion (발등 당기기) → EXHALE Return to Starting Position (다리 내려 복귀). 반대쪽 반복.","check":"SOURCE · 요추는 복부로 안정화하고 척추 회전 방지; 몸통 박스가 찌그러지지 않게; 팔꿈치 Rocking (앞뒤 흔들림) 방지. COACHING · 다리 들 때 골반이 들리거나 회전하지 않게, 어깨가 귀 쪽으로 솟지 않게.","regress":"COACHING · 양발을 모두 바닥에 둔 정적 Plank (플랭크)부터 연습; 손목 부담 시 지지 높이를 높이고 범위를 줄이기.","variations":"SOURCE · 팔꿈치를 접고 실시 (forearm support / 전완 지지). COACHING · 다리 높이는 골반이 흔들리지 않는 범위에서 조절."};
detail["052"]={"target":"SOURCE · Why: 몸통·견갑대 안정화, 어깨 주변 및 복부 강화, 전신 강화와 후면 근육 안정화. Movement Point: 복횡근·골반저근, Oblique & Multifidus (회전 방지), Gluteus Maximus (신전), Ankle Plantar/Dorsi Flexion (발목 움직임), Scapula Stabilizer (견갑 안정근).","alignment":"SOURCE · Starting Position: Spine & Pelvis Neutral (척추·골반 중립), 상체 뒤로 기대 양손을 어깨 아래에 짚고 두 다리를 골반 너비로 길게 편 앉은 자세. COACHING · Hip Rotation (고관절): 중립; 손바닥으로 지지하고 팔꿈치는 펴기; 발은 처음에 뒤꿈치가 매트에 닿고 골반을 들어 올릴 때 발 접촉이 바뀜. Gaze (시선): 목 과신전 없이 정면 위쪽.","breath":"SOURCE · INHALE Ready (준비) → EXHALE Hip Lift Up / Full Up (골반 들어 역방향 지지) → INHALE Single Leg Hip Flexion (한 다리 고관절 굴곡으로 들어 올리기) → EXHALE Hip Extension / Full Up (다리 내려 몸통 일직선) → IN & EXHALE Return (앉은 시작자세 복귀).","check":"SOURCE · 복부를 이용한 요추 안정화와 척추 회전 방지; 몸통 박스가 찌그러지지 않게; 손목으로만 체중 싣지 않기; 팔꿈치 Rocking 방지. 사진 손글씨: 시선, 밀고, '들어가지 않게!' 메모가 있으나 마지막 지시 대상은 명확히 판독되지 않음.","regress":"COACHING · 무릎을 굽힌 Reverse Tabletop (리버스 테이블탑)으로 어깨 지지와 골반 들기부터 연습. 손목·어깨 통증 시 동작 범위 축소.","variations":"SOURCE · 별도 Variation 항목 없음. COACHING · 양발 지지 정적 자세부터 한 다리 들기로 진행."};
detail["053"]={"target":"SOURCE · Why: 팔·복부 근육 강화, 중립 척추 인지 향상, 견갑대 안정화. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Triceps Brachii (상완삼두근: 팔꿈치 신전), Pectoralis Major (대흉근: 어깨 움직임), Scapula Stabilizers (견갑 안정근).","alignment":"SOURCE · Starting Position: 척추·골반 Neutral (중립), 두 다리를 모아 정면을 보고 선다. 이어 Roll Down과 Hand Walking으로 손 지지 Plank/Dart Position에 진입. COACHING · 팔꿈치는 과도하게 벌리지 않고 굽힘/폄; 손바닥 전체 지지, 발가락 지지, Hip Rotation (고관절 회전) 중립. Gaze (시선)는 바닥, 목 길게.","breath":"SOURCE · INHALE Ready → EXHALE Roll Down (서서 척추 순차 굴곡) → INHALE Hand Walking (손으로 앞으로 걷기) → EXHALE Dart Position (긴 몸통 정렬) → INHALE Elbow Flexion (팔꿈치 굽히기) → EXHALE Elbow Extension (팔꿈치 펴기) → INHALE Hand Walking (손으로 뒤로 걷기) → EXHALE Roll Up & Starting Position (척추 순차 펴기).","check":"SOURCE · 손 걷기 동안 골반 좌우 움직임/회전 방지; 전거근으로 견갑대 안정화하고 몸통 전체 일직선 유지; 팔꿈치 Rocking 방지. COACHING · 어깨가 귀로 올라가거나 허리가 꺾이지 않게.","regress":"COACHING · 무릎을 바닥에 대고 Push Up (푸시업) 또는 벽/높은 지지대 사용; 팔꿈치 굽힘 범위를 줄이기.","variations":"SOURCE · Roll Down & Roll Up 제외하기 (손 지지 자세에서 푸시업만 수행). 사진의 다음 054페이지는 같은 Push Up 동작의 손 걷기 상세 설명이며 별도 운동명이 아님."};
detail["054"]={"target":"SOURCE · Push Up (푸시업) 연속 설명 페이지, printed page 56. 독립된 새로운 운동이 아니라 053의 Roll Down & Hands Walking, Hand Walking & Roll Up 세부 단계. COACHING · 견갑 안정성과 골반 좌우 흔들림 제어.","alignment":"SOURCE · Roll Down 시 머리에서 꼬리뼈 방향으로 척추를 둥글게 말고 손으로 바닥에 접근; 손 걷기 시 골반과 몸통 좌우 움직임 없이 어깨 굴곡·신전으로 이동. COACHING · 손바닥 지지, Plank에서는 발가락 지지, 고관절 회전 중립, 시선 바닥; 일어날 때 시선은 마지막에 정면.","breath":"SOURCE · Roll Down & Hands Walking: INHALE 척추 길게 늘리며 준비 → EXHALE 머리부터 꼬리뼈 방향으로 순차적 Roll Down → INHALE 골반·몸통 좌우 움직임 없이 손으로 앞으로 걷기 → EXHALE 정수리~뒤꿈치 일직선. Hand Walking & Roll Up: INHALE 어깨 굴곡·신전으로 손을 몸쪽으로 걷기 → EXHALE 꼬리뼈부터 머리 방향으로 Roll Up.","check":"SOURCE · 손으로 이동할 때 몸통과 골반 좌우 움직임을 제한. 사진 손글씨: '좌우 움직임 없이', '흉추부터 접어서'가 보임. COACHING · 골반 회전과 어깨 으쓱임 방지; 무릎은 필요 시 부드럽게 굽힘.","regress":"COACHING · 무릎 굽혀 손바닥 바닥 접촉; 손 걷기 거리 단축. 팔 지지가 어려우면 높은 지지대 사용.","variations":"SOURCE · 053 Push Up의 세부 설명 페이지이며 별도 Variation 표기는 없음."};
detail["055"]={"target":"SOURCE · Why: 전신 근육 사용 인지, 복부 강화, 전신 근육 지구력·균형 증가. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Scapula Stabilizer (견갑 안정근).","alignment":"SOURCE · Starting Position: 어깨 아래에 팔꿈치를 놓고 전완(팔뚝)으로 바닥 지지; 두 다리를 골반 너비로 평행하게, 무릎을 매트에 댄 뒤 몸통을 일직선으로 만든다. COACHING · 기본 사진은 무릎을 든 Forearm Plank (전완 플랭크). 팔꿈치·전완 지지, 발가락 접촉, 뒤꿈치 공중; Hip Rotation (고관절 회전) 중립, 시선은 매트.","breath":"SOURCE · INHALE Ready (준비) → EXHALE Plank Position (무릎 들어 전완 플랭크) → INHALE Keep → EXHALE Keep → INHALE Keep → EXHALE Return to Starting Position (무릎 내리기). 유지 중 호흡을 멈추지 않는다.","check":"SOURCE · 복부를 이용해 척추 과신전·회전 방지; 견갑골 거상·과도한 전인으로 어깨 긴장 방지; 복부와 고관절 신전근의 주된 사용으로 전신 활성화. COACHING · 목이 처지거나 엉덩이가 높게 들리지 않도록 조절.","regress":"SOURCE · 무릎을 매트에 대고 실시. COACHING · 유지 시간을 짧게 하거나 전완을 높은 박스에 올리기.","variations":"SOURCE · 무릎 지지; 전완 아래 Box (박스) 사용; 팔꿈치 위치 바꾸기. 사진의 하단 변형은 무릎 지지 전완 플랭크."};
detail["031"]={"target":"SOURCE · Printed p.33. Why: Spinal Lateral Flexion & Rotation (척추 측굴·회전) 인지, Abdominals (복근) 활성화. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Internal/External Obliques (내·외복사근), Scapular Stabilizers (견갑 안정근).","alignment":"SOURCE · Cross-legged sitting (가부좌로 앉기), both hands on mat beside hips, gaze forward. COACHING · Sit bones grounded; Hip Rotation (고관절 회전) is externally rotated in cross-legged posture, not forcibly squared. Feet/shins rest on mat; gaze follows comfortable trunk rotation; shoulder stays away from ear.","breath":"SOURCE · INHALE Shoulder Abduction (팔 옆으로 들어 올리기) → EXHALE Lateral Flexion & Rotation (측굴 및 회전) → INHALE Spinal Elongation (척추 길어지기) → EXHALE Starting Position (시작 자세로 복귀).","check":"SOURCE · Keep pelvis vertical during side bending and rotation; recruit abdominals; move arms with external/internal rotation without shoulder shrug; prevent hip flexion. COACHING · Avoid collapsing supporting wrist or lifting the opposite sit bone.","regress":"SOURCE · Sit higher on Arc Barrel or Box (아크 배럴/박스). COACHING · Reduce range, place folded support under pelvis.","variations":"SOURCE · Prep: omit Spine Rotation (척추 회전 생략). No other source variation stated."};
detail["032"]={"target":"SOURCE · Printed p.34. Why: Frontal-plane movement awareness (관상면 움직임 인지), abdominal activation. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Internal/External Obliques (내·외복사근), Scapular Stabilizers (견갑 안정근).","alignment":"SOURCE · Sit with one buttock touching mat and knees bent, upper leg externally rotated so its knee points toward ceiling. Supporting hand on mat, other hand on externally rotated knee; hand and knee aligned. COACHING · Supporting palm fully contacts mat; lower knee/shin and upper foot contact mat; upper foot can reposition with variation; shoulder over supporting wrist, gaze forward then naturally follows side bend.","breath":"SOURCE · INHALE Ready → EXHALE Spinal Lateral Flexion (측굴하면서 골반 들어 올리기) → INHALE Return to Starting Position (앉은 시작 자세로 복귀).","check":"SOURCE · Avoid spinal extension/rotation; emphasize abdominal use; prevent hip extension; keep supporting hand and knee aligned; avoid elbow hyperextension; stabilize scapula with downward rotation. COACHING · Distribute pressure through palm and maintain a soft elbow rather than locking.","regress":"COACHING · Smaller pelvic lift and side-bend range; cushion under knee and support wrist as needed.","variations":"SOURCE · Bring both knees toward one direction; Side Bend Mermaid: straighten knee during spinal lateral flexion. Handwritten cues near photos: '손목', '손 무릎', '발 걸려' (interpretation of last note uncertain; not treated as instruction)."};
detail["033"]={"target":"SOURCE · Printed p.35. Why: Awareness/strength of hip extensors (고관절 신전근), scapular and core stabilization/endurance. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Internal/External Obliques (내·외복사근), Erector Spinae (척추기립근), Hip Flexors/Extensors/Abductors (고관절 굴곡·신전·외전근), Scapular Stabilizers (견갑 안정근).","alignment":"SOURCE · Begin quadruped, knees hip-width; extend one leg diagonally sideways, put supporting hand in line with knee, other hand by head. COACHING · Supporting palm and knee/shin contact mat; moving leg initially foot contacts mat, then hovers at hip height. Hip Rotation (고관절 회전) neutral as able; supporting wrist under shoulder; gaze slightly forward/down without neck side-bend.","breath":"SOURCE · INHALE Ready → EXHALE One Leg Lift Up (다리 들어 올리기) → INHALE Horizontal Hip Flexion + Dorsi Flexion (다리 앞으로, 발등 당기기) → EXHALE Horizontal Hip Extension + Plantar Flexion (다리 뒤로, 발끝 뻗기) → INHALE Return to Starting Position.","check":"SOURCE · Maintain spinal neutral with abdominals; avoid shoulder elevation; prevent moving-leg hip from rotating; maintain leg height. Handwritten notes indicate neutral alignment and warn against excessive spinal extension/hip extension. COACHING · Do not swing pelvis or arch lumbar spine to increase range.","regress":"SOURCE · Variation excludes Hip Flexion/Extension; only lift and lower leg. COACHING · Shorten lever by bending working knee.","variations":"SOURCE · Exclude Hip Flex/Ext; repeatedly lower and raise leg from starting position."};
detail["034"]={"target":"SOURCE · Printed p.36. Why: Strengthen deep abdominal support to balance upper-limb movement; core stabilization. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Internal/External Obliques (내·외복사근), Erector Spinae (척추기립근), Hip Extensors (고관절 신전근), Scapular Stabilizers (견갑 안정근).","alignment":"SOURCE · Quadruped with hands below shoulders, knees below pelvis at hip width; flex ankles to press toes into mat; slight elbow bend, elbow creases forward; neutral spine/pelvis. COACHING · Supporting palms, knees and toes contact mat; lifted arm and opposite leg hover; working hip stays neutral (no outward rotation); gaze to mat ahead of hands, neck long.","breath":"SOURCE · INHALE Ready → EXHALE Reach Arm Reach Leg (반대쪽 팔과 다리 길게 뻗기) → INHALE Keep (유지) → EXHALE Return to Starting Position.","check":"SOURCE · Maintain neutral spine with abdominal support; avoid scapular elevation; avoid trunk movement when extending arm/leg; movement should come from shoulder and hip, not elbow and knee. COACHING · Avoid pelvic tilt/rotation and excessive lumbar extension; reach long rather than high.","regress":"SOURCE · Extend arm only or leg only. COACHING · Hold briefly and reduce reach height.","variations":"SOURCE · Arm reach only (팔 뻗기); Leg reach only (다리 뻗기). Handwritten cues: '버드독', '몸통의 흔들림'."};
detail["035"]={"target":"SOURCE · Why: Strengthen deep trunk muscles to maintain body balance during upper-limb movement; core stabilization (상완 움직임 중 균형 유지 위한 심부근 강화·코어 안정화). Movement Point: Transverse Abdominis, Pelvic Floor; Internal & External Obliques, Erector Spinae; Hip Extensors; Scapular Stabilizers. COACHING · Lumbar multifidi, gluteus maximus and serratus anterior may contribute depending on execution.","alignment":"SOURCE · Starting Position: prone (엎드림), spine and pelvis neutral; both arms and legs extended approximately shoulder width. Printed photo shows alternating opposite arm/leg lifted with chest gently extended. COACHING · Gaze toward mat, neck long; hips parallel and avoid outward rotation; feet initially rest with dorsum/toes toward mat and hover when lifted; keep pubic region/pelvis supported without pressing painfully.","breath":"SOURCE · INHALE Ready (준비) → EXHALE Spinal Extension, Right Arm & Left Leg (척추 신전과 오른팔·왼다리 들기) → INHALE & EXHALE Other Side (반대쪽 교대) → INHALE & EXHALE Return to Starting Position (시작 자세 복귀). The source explicitly labels the alternating phase INHALE&EXHALE, not one fixed breath per side. COACHING · Maintain smooth natural breathing rather than holding the breath.","check":"SOURCE · Keep spine neutral through abdominal support; maintain shoulder-girdle stability; do not let trunk wobble when arms/legs move; breathe naturally during movement. COACHING · Watch excessive lumbar hinging, pelvic rocking, shoulder shrugging, overly high limb lifts; lengthen diagonally instead of chasing height.","regress":"COACHING · Reduce reach height or alternate arm-only/leg-only while maintaining pelvic stability. Avoid painful lumbar compression.","variations":"SOURCE · Lift arms and legs simultaneously (팔·다리 동시 들기). Handwritten note near Starting Position is unclear and NOT transcribed as a confirmed instruction."};
detail["036"]={"target":"SOURCE · Printed p.38. Why: strengthen lateral spinal curves and acquire essential central stability. Movement Point: Transverse Abdominis, Pelvic Floor; Hip Abduction: Hip Abductors. COACHING · Gluteus medius/minimus stabilize the lifted hip; obliques resist trunk side-bending.","alignment":"SOURCE · Side-lying, neutral spine/pelvis, legs extended in one line; lower elbow bent to support head, upper palm supports mat near abdomen. COACHING · Bottom outer leg/hip and side trunk touch mat; upper leg lifts clear of bottom leg; feet together initially, neutral hip rotation, gaze straight ahead, neck long.","breath":"SOURCE · INHALE Ready → EXHALE Abduction (윗다리 벌리며 들기) → INHALE Starting Position (내려오기).","check":"SOURCE · Prevent spinal extension, flexion or rotation; stabilize scapula without shoulder tension; lift underside waist so trunk box does not collapse. COACHING · Avoid rolling pelvis backward or hiking hip; lead with lateral heel and maintain a long leg.","regress":"SOURCE · Variation: tilt body; bend bottom knee. COACHING · Reduce lift height; support head comfortably.","variations":"SOURCE · Body tilt (몸 기울이기); bend lower knee (아래 무릎 구부리기). Handwritten note about lower waist lifting is legible; other handwritten note by upper photo is not fully certain."};
detail["037"]={"target":"SOURCE · Printed p.39. Why: strengthen lateral spinal curve and acquire core stability. Movement Point: Transverse Abdominis, Pelvic Floor; Hip Adduction: Adductors. COACHING · Hip adductor group works on lower leg while obliques stabilize torso.","alignment":"SOURCE · Side-lying neutral spine/pelvis with straight legs in line; bottom elbow supports head, upper hand on mat near abdomen. PHOTO · Top leg first abducts to make space, lower leg adducts/lifts toward it, then lowers; both legs return. COACHING · Side of lower body and supporting arm contact mat, feet hover during lift; avoid forced hip external rotation; gaze ahead.","breath":"SOURCE · INHALE Abduction (윗다리 벌리기) → EXHALE Other Side Leg Adduction (아랫다리 내전하여 들기) → INHALE Down on Mat (아랫다리 내리기) → EXHALE Starting Position (윗다리 내려 복귀).","check":"SOURCE · No spinal extension, flexion or rotation; avoid shoulder tension; maintain lifted underside waist and trunk box. COACHING · Do not turn foot outward to fake hip adduction or roll pelvis backward.","regress":"SOURCE · Tilt body or bend lower knee (printed variation; bending lower knee may change this particular movement and requires thoughtful adaptation). COACHING · Smaller range.","variations":"SOURCE · Body tilt (몸 기울이기); bend bottom knee (아래 무릎 구부리기). Handwritten instruction near feet is partly unclear and excluded from verified source."};
detail["038"]={"target":"SOURCE · Printed p.40. Side Leg Series 3: Knee Open. Movement Point: Transverse Abdominis, Pelvic Floor; Hip Abduction / Abductors. COACHING · Deep external rotators and gluteus medius contribute to clam-style knee opening.","alignment":"SOURCE · Side-lying neutral spine/pelvis; both knees bent so heels sit below buttocks; bottom elbow supports head, top palm supports mat near abdomen. PHOTO · Feet remain together while top knee opens. COACHING · Bottom side, bottom leg and feet rest on mat; gaze forward, keep pelvic landmarks stacked and avoid posterior rolling.","breath":"SOURCE · INHALE Ready → EXHALE Knee Open (윗무릎 벌리기) → INHALE Starting Position (무릎 닫기).","check":"SOURCE · Prevent spinal extension/flexion/rotation, shoulder tension and collapsed trunk box; lift underside waist. COACHING · Do not rotate whole pelvis or press into lower back to widen the knee angle.","regress":"COACHING · Reduce opening angle or place cushion under head; stop if hip pinches.","variations":"SOURCE · Lift feet from mat during execution (매트에서 발목 들고 시행하기). Handwritten notes: ankles remain together and knee opens; another note warns not to drive effort into the lower knee."};
detail["039"]={"target":"SOURCE · Printed p.41. Side Leg Series 4: Side Kick Prep. Movement Point: Transverse Abdominis, Pelvic Floor; Hip Abduction / Hip Flexion / Hip Extension. COACHING · Gluteus medius and gluteus maximus with deep abdominal stabilizers.","alignment":"SOURCE · Side-lying with neutral spine/pelvis and both legs extended in line; lower bent arm supports head, upper palm on mat near abdomen. PHOTO · Lift top leg, bend hip/knee forward during two kicks, extend leg backward, return feet together. COACHING · Supporting side contacts mat, lifted foot floats, pelvis stays stacked; gaze forward; maintain neutral rotation rather than twisting hip for range.","breath":"SOURCE · INHALE Ready → EXHALE Abduction (다리 들기) → INHALE Flexion & 2 Kick (고관절 굴곡하며 두 번 킥) → EXHALE Extension (뒤로 신전) → INHALE Starting Position (복귀).","check":"SOURCE · Prevent spinal extension, flexion or rotation; stabilize shoulder girdle; lift lower waist to prevent trunk-box collapse. COACHING · Avoid rocking pelvis, arching lumbar spine on back kick, or shrugging support shoulder.","regress":"SOURCE · Tilt body or bend lower knee. COACHING · Make two kicks small and reduce hip extension.","variations":"SOURCE · Body tilt (몸 기울이기); bend lower knee (아래 무릎 구부리기). Handwritten notes about foot shape and hip rotation are not fully legible; not counted as verified."};
detail["040"]={"target":"SOURCE · Printed p.42. Why: stabilize shoulder girdle through movement; improve upper thoracic mobility; activate abdominal muscles to protect lumbar spine. Movement Point: Transverse Abdominis, Pelvic Floor, Upper Thoracic/Erector Spinae, Scapula Stabilizer. COACHING · thoracic extensors and scapular stabilizers support controlled lift.","alignment":"SOURCE · Prone; neutral spine/pelvis; legs long at pelvic width; forearms on mat with elbows in line with shoulders. COACHING · Forearms/palms and anterior legs contact mat; hips remain neutral and grounded; gaze down/slightly forward as upper thorax extends, neck long; avoid toe gripping.","breath":"SOURCE · INHALE Ready → EXHALE Spinal Extension → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · Extend cervical and upper thoracic regions evenly; stabilize shoulder girdle to assist extension; choose range for client spinal flexibility. COACHING · Avoid hinging only at lumbar spine, shoulder shrugging and lifting pelvis; lower if neck/lumbar discomfort.","regress":"COACHING · Smaller thoracic lift and shorter hold, with elbows grounded; no forced cervical extension.","variations":"SOURCE · Arc Barrel; ASIS pad. Handwritten red cue is partly legible and not adopted as verified instruction."};
detail["041"]={"target":"SOURCE · Printed p.43. Why: shoulder girdle stability, upper thoracic mobility, abdominal support protecting lumbar spine. Movement Point: Transverse Abdominis, Pelvic Floor, Upper Thoracic/Erector Spinae, Scapula Stabilizer. COACHING · shoulder external rotators participate.","alignment":"SOURCE · Prone neutral spine/pelvis; legs straight at pelvic width; arms extended beside hips. COACHING · Anterior pelvis/thighs and feet initially contact mat; hands hover during extension; hip rotation neutral, gaze down and forward only as spine lengthens.","breath":"SOURCE · INHALE Shoulder External Rotation → EXHALE Elongation → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · Seek long, uniform extension rather than isolated spinal hinge; shoulder external rotation within stable scapular range. COACHING · Avoid rib flare, lumbar compression, lifting legs or excessive neck extension.","regress":"COACHING · Keep arms low and lift chest minimally; reduce shoulder rotation range.","variations":"SOURCE · ASIS pad; perform with arms extended sideways. Handwritten cue near hip is not fully clear and remains unverified."};
detail["042"]={"target":"SOURCE · Printed p.44. Why: shoulder girdle stability, upper thoracic mobility, abdominal activation for lumbar protection. Movement Point: Transverse Abdominis, Pelvic Floor, Upper Thoracic/Erector Spinae, Scapula Stabilizer.","alignment":"SOURCE · Prone neutral spine/pelvis, legs extended pelvic-width; elbows flexed, hands together in front of forehead. COACHING · Anterior hips/legs contact mat; elbows begin supported; maintain neutral hip rotation; eyes toward mat, neck in line with thoracic extension.","breath":"SOURCE · INHALE Ready → EXHALE Elongation → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · Extend spine long and evenly; prevent shoulder girdle elevation. COACHING · Do not pull head with hands, shrug shoulders, arch lumbar spine excessively or force cervical extension.","regress":"COACHING · Keep elbows down and make a small chest lift; stop if shoulder/neck pain.","variations":"SOURCE · Arc Barrel; ASIS pad. Handwritten note above first photograph is not sufficiently clear to treat as a verified cue."};
detail["043"]={"target":"SOURCE · Printed p.45. Why: shoulder girdle stability through movement, upper thoracic mobility, abdominal activation protecting lumbar spine. Movement Point: Transverse Abdominis, Pelvic Floor, Upper Thoracic/Erector Spinae, Scapula Stabilizer.","alignment":"SOURCE · Prone neutral spine/pelvis; legs long pelvic-width; arms stretched alongside hips. COACHING · Pelvis and legs remain supported, hip rotation neutral; eyes follow gentle neck/upper thoracic extension without cranking the head; hands hover close to mat.","breath":"SOURCE · INHALE Shoulder External Rotation → EXHALE Cervical & Upper Thoracic Extension → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · Keep lumbar region neutral while extending along spinal curve; use shoulder external rotation for scapular retraction; externally rotate shoulders within stable scapular range. COACHING · Avoid lumbar hinging, rib flare, excessive cervical lift and glute clenching.","regress":"COACHING · Decrease chest height and shoulder external rotation; use forearm-supported prep if needed.","variations":"SOURCE · ASIS pad. Red arrows on source image indicate reach directions, not a separate named variation."};
detail["044"]={"target":"SOURCE · Printed p.46. Why: shoulder stability, spinal mobility and extensor endurance, abdominal protection of lumbar spine; strengthen Hip & Spine Extensors. Movement Point: Transverse Abdominis, Pelvic Floor, Erector Spinae & Hip Extensors, Scapula Stabilizer.","alignment":"SOURCE · Prone neutral spine/pelvis; legs long pelvic-width and externally rotated; forearms on mat with elbows aligned beneath shoulders. COACHING · Forearms and anterior pelvis/legs support start; feet may lift in rocking phase; eyes forward only within neck comfort, avoid gripping toes.","breath":"SOURCE · INHALE Spinal Full Extension (Swan Position) → EXHALE Rocking → INHALE Swan Position → EXHALE Starting Position.","check":"SOURCE · Use obliques to prevent lumbar hyperextension and maintain long spinal extension; avoid excessive scapular elevation and retraction; adjust extension range for spinal flexibility; avoid excessive cervical extension. COACHING · Do not throw head or force rocking; maintain abdominal support and stop for lumbar pain.","regress":"SOURCE · Slow Swan Prep (omit Rocking). COACHING · Reduce extension and keep lower limbs supported.","variations":"SOURCE · Slow Swan Prep — no rocking; Swan Dive. Handwritten notes near leg/hip indicate external rotation but some other annotations are unclear and not verified."};
detail["045"]={"target":"SOURCE · Printed p.47. Why: relieve tension of spinal extensors (신전근 긴장 완화). Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Release: Spinal Extensor. COACHING · Gentle spinal flexion and relaxation, not forceful lumbar stretching.","alignment":"SOURCE · Sit with knees bent at pelvic width; place torso over thighs without lifting buttocks toward ceiling; relax spine over legs; palms rest comfortably near front of feet or beside hips. COACHING · Shins and buttocks remain supported; gaze down toward mat, neck relaxed; no active hip rotation or toe pressure required.","breath":"SOURCE · INHALE Breathing (Spinal Release) → EXHALE Breathing (Spinal Release) → INHALE Keep → EXHALE Spinal Articulation. COACHING · Unroll gradually without pushing into neck.","check":"SOURCE · Avoid tension in shoulders and neck; check ankle and knee pain. Handwritten cue indicates not lifting buttocks and relaxing spinal muscles, but exact lettering partly ambiguous. COACHING · Stop if knees are uncomfortable.","regress":"COACHING · Place folded support under knees or reduce knee bend; keep breath unforced.","variations":"SOURCE · Supine Position: bend knees and draw them toward chest."};
