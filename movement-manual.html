t.getElementById('search').value.toLowerCase(),cat=document.getElementById('category').value;nav.replaceChildren();data.forEach((d,i)=>{if(cat!=='all'&&d.group!==cat)return;if(!(d.name+' '+d.file).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='item'+(i===selected?' active':'');const n=document.createElement('b');n.textContent=d.file.slice(0,3);const t=document.createElement('span');t.textContent=d.name;b.append(n,t);b.onclick=()=>{selected=i;render()};nav.append(b)});const d=data[selected],k=d.group==='Mat / Small Props'?d.file.slice(0,3):'',x=detail[k];panel.replaceChildren();const ey=document.createElement('div');ey.className='eyebrow';ey.textContent=d.group.toUpperCase()+' · '+k;const h=document.createElement('h2');h.textContent=d.name;panel.append(ey,h);const links=document.createElement('div');links.className='actions';const a=document.createElement('a');a.href=d.url;a.target='_blank';a.rel='noopener';a.textContent='Original photo · 원본 사진';links.append(a);panel.append(links);if(x){const fields=document.createElement('div');fields.className='fields';[['Target / Function (목표)',x.target],['Alignment / Foot / Gaze (정렬·발·시선)',x.alignment],['Breathing / Sequence (호흡·순서)',x.breath],['Watch Points (보상·주의)',x.check],['Regression (쉬운 단계)',x.regress],['Variations (추가 변형)',x.variations]].forEach(([label,value])=>{const f=document.createElement('div');f.className='field';const b=document.createElement('strong');b.textContent=label;const p=document.createElement('p');p.textContent=value;f.append(b,p);fields.append(f)});panel.append(fields)}else{const p=document.createElement('p');p.className='meta';p.textContent='원본 사진 색인이 연결되어 있습니다. 개별 동작 분석은 검증된 항목부터 추가합니다.';panel.append(p)}const n=document.createElement('p');n.className='note';n.textContent='학습용 추가 설명은 교재 원문과 구분됩니다. 원본 사진 링크를 통해 해당 페이지를 확인할 수 있습니다.';panel.append(n)}document.getElementById('search').oninput=render;render();</script></body></html>
