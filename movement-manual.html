detail["046"]={"target":"SOURCE · Printed p.48. Why: recognize hip extensor use; strengthen hip external rotators. Movement Point: Transverse Abdominis, Pelvic Floor; hip extensor (source labels 'Spinal Extension : Hip Extensor'); Scapula Stabilizer. COACHING · Gluteus maximus contributes to hip extension.","alignment":"SOURCE · Prone, neutral spine and pelvis; legs extended at pelvic width in external rotation; forearms folded with forehead resting on hands. COACHING · Pelvis/ASIS remain on mat, gaze down, dorsum of grounded foot contacts mat; raised leg stays long without lumbar extension.","breath":"SOURCE · INHALE Ready → EXHALE Single Leg Extension → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · Keep spine long and straight; prevent scapular elevation; prevent spinal rotation. Handwritten note warns against lifting via lumbar extension. COACHING · Avoid pelvic roll or rib lift; raise leg only as high as neutral pelvis permits.","regress":"COACHING · Reduce lift height or use folded towel beneath ASIS for comfort.","variations":"SOURCE · Arc Barrel; ASIS pad."};
detail["047"]={"target":"SOURCE · Printed p.49. Why: recognize hip extensor use; strengthen hip external rotators. Movement Point: Transverse Abdominis, Pelvic Floor; Scapula Stabilizer. COACHING · Bilateral gluteus maximus and hip extensors contribute.","alignment":"SOURCE · Prone neutral spine/pelvis; legs long and externally rotated at pelvic width; elbows flexed and hands together under forehead. COACHING · Pelvis remains supported, gaze to mat; dorsum of feet contacts mat initially, both legs hover in extension.","breath":"SOURCE · INHALE Ready → EXHALE Leg Extension → INHALE Keep → EXHALE Return to Starting Position.","check":"SOURCE · Avoid scapular elevation and lumbar hyperextension. Handwritten note suggests lifting only as much as neutral alignment permits (not quoted as exact source). COACHING · Do not compensate with neck or back.","regress":"COACHING · Small bilateral lift; choose single-leg version if necessary.","variations":"SOURCE · ASIS pad; two-stage breathing (2단계 호흡)."};
detail["048"]={"target":"SOURCE · Printed p.50. Why: strengthen hamstrings. Movement Point: Transverse Abdominis, Pelvic Floor; knee flexion/extension: Hamstring; Scapula Stabilizer. COACHING · Biceps femoris, semitendinosus, semimembranosus participate.","alignment":"SOURCE · Prone neutral spine/pelvis; legs together and extended, elbows flexed with hands folded under forehead. COACHING · Front pelvis, thighs and arms supported; toes/foot dorsum rest initially; knee flexes without hip lifting, gaze down.","breath":"SOURCE · INHALE Ready → EXHALE Hamstring Curl → INHALE Small Knee Extension → EXHALE Hamstring Curl → INHALE Knee Extension → EXHALE Return to Starting Position.","check":"SOURCE · Use abdominal contraction and hip extensors to keep lumbar neutral; avoid pelvic movement during knee flexion; avoid scapular elevation. Handwritten reminder says not to use lumbar spine (paraphrase). COACHING · Maintain equal hip pressure and avoid cramping.","regress":"COACHING · Reduce knee flexion range and omit the second pulse.","variations":"SOURCE · ASIS pad; perform only one hamstring curl."};
detail["049"]={"target":"SOURCE · Printed p.51. Why: strengthen gluteus maximus; activate hamstrings; improve awareness of hip extension. Movement Point: Transverse Abdominis, Pelvic Floor; Heel Squeeze: Adductor. COACHING · Hip external rotators/gluteals may stabilize; printed movement point specifically names adductors for squeeze.","alignment":"SOURCE · Prone neutral spine/pelvis; hips slightly externally rotated, knees bent at shoulder width with heels touching each other; elbows bent, hands together under forehead. COACHING · Pelvis/abdomen and forearms rest on mat, lower legs hover, gaze down; heels press each other rather than mat.","breath":"SOURCE · INHALE Ready → EXHALE Heel Squeeze. Printed sequence does not specify a separate return breath; do not invent one as source.","check":"SOURCE · Avoid lumbar hyperextension and tension in neck/shoulders. Handwritten notes near feet/hip are partially unclear and excluded as source fact. COACHING · Keep pelvis heavy; do not force knee turnout.","regress":"COACHING · Reduce knee bend or squeeze effort; stop for knee discomfort.","variations":"SOURCE · No printed Variation section on this photographed page."};
detail["050"]={"target":"SOURCE · Printed p.52. Why: shoulder-girdle/trunk stabilization during hold, strengthen shoulder girdle and elbow extensors, improve front/back trunk balance and neutral-spine awareness. Movement Point: TVA/Pelvic Floor; anti-rotation Obliques & Multifidus; ankle plantar/dorsiflexion; scapular stabilizers.","alignment":"SOURCE · Quadruped neutral spine/pelvis; palms under shoulders, knees under hips at pelvic width; toes tucked to support floor, elbows slightly bent outward. COACHING · Hands and toe pads press mat when knees hover; supporting knee initially on mat; gaze between hands, neck long; hip neutral, pelvis level; avoid foot rocking.","breath":"SOURCE · INHALE Ready → EXHALE Knee Off → INHALE Keep → EXHALE One Leg Lift → INHALE Knee Off → EXHALE Other Side Leg Lift → INHALE Knee Off → EXHALE Starting Position. 'Knee Off' appears repeatedly as printed and is retained without guessing a different movement.","check":"SOURCE · Stabilize lumbar with abdominals and preserve neutral spine; avoid torso box-shape collapse, rocking at elbows. Handwritten note emphasizes elbow alignment and thoracic control, but some text uncertain. COACHING · Lift knees minimally, avoid shoulder shrug and pelvic rotation; if wrist pain, reduce load.","regress":"COACHING · Practice knee hover only or hold quadruped before alternating leg lift.","variations":"SOURCE · Use band (밴드 사용하기)."};
detail["056"]={"target":"SOURCE · Printed p.59, Arc Barrel upper thoracic support. This is a PHOTO OVERVIEW, not a full movement-instruction page. Pictured: Curl Up (two knee positions), Hundred, Single Leg Stretch, Criss Cross. Stated purpose: when thoracic flexion is difficult or shoulder/neck tension arises. COACHING · Consider anterior abdominal wall, obliques and cervical flexor endurance depending on chosen exercise.","alignment":"SOURCE · Curved barrel supports upper thoracic region; mat supports pelvis, legs vary by movement. Curl Up appears with knees bent/feet on floor and with tabletop legs; Hundred has extended elevated legs; Single Leg Stretch alternates flexed and extended legs; Criss Cross combines trunk rotation with one knee flexed. COACHING · Maintain controlled pelvis, do not force cervical flexion; monitor gaze toward abdomen and avoid shrugging. Foot contact varies: floor for bent-knee Curl Up, no foot contact for lifted-leg images.","breath":"SOURCE · Explicitly says sequence, breathing and precautions are the same as the corresponding Mat exercises; this page has NO independently printed breath sequence. Refer to each Mat entry rather than inventing one.","check":"SOURCE · Use upper thoracic support when flexion is difficult or shoulder/neck tension occurs. COACHING · Ensure the barrel is stable; avoid cervical compression or unsupported head drop.","regress":"COACHING · Lower legs or shorten abdominal curl if neck or low-back discomfort occurs; verify against the individual Mat exercise.","variations":"SOURCE · Arc Barrel adaptation of Curl Up, Hundred, Single Leg Stretch and Criss Cross. This is not a new independent Curl Up definition."};
detail["057"]={"target":"SOURCE · Printed p.60. Arc Barrel upper thoracic examples: Scissor and Double Leg Stretch. Arc Barrel under pelvis examples: Scissor, Double Leg Lower & Lift, Shoulder Bridge. Pelvic support indicated for hip flexor tension or excessive anterior pelvic tilt. COACHING · Hip flexors/abdominals in scissor and leg lowering; gluteals in bridge.","alignment":"SOURCE · Upper thoracic barrel supports curled trunk in Scissor and Double Leg Stretch; pelvic barrel lies below pelvis in the other three images. Scissor: legs split in air; Double Leg Lower & Lift: legs extended diagonally; Shoulder Bridge: bent knees and feet on barrel. COACHING · Gaze follows head/trunk without neck compression; pelvis stays supported and hips do not rotate; in the pelvic Scissor/leg-lowering examples feet hover, in bridge both soles press the barrel.","breath":"SOURCE · No per-exercise inhale/exhale sequence printed on p.60. The section directs users to Mat movement order, breathing and precautions (p.59). Do not treat suggested timing as printed.","check":"SOURCE · Support beneath pelvis is recommended when hip flexor tension or excessive anterior tilt is present. COACHING · Secure barrel against slipping and avoid overextending the low back during leg lowering.","regress":"COACHING · Reduce leg-lowering angle or keep one foot supported when needed; distinguish these from source variations.","variations":"SOURCE · Two DIFFERENT barrel placements, upper thorax vs under pelvis, and five named adaptations; no standalone detailed movement steps printed."};
detail["058"]={"target":"SOURCE · Printed p.61, Arc Barrel sitting (= Box). Use when hamstrings are tight or seated spinal/pelvic neutral is difficult. Images show Spine Stretch Forward, Spine Roll Back, Spine Lean Back, Roll Down, Spine Twist, Mermaid with Rotation. COACHING · Trunk flexors/extensors and obliques contribute depending on exercise.","alignment":"SOURCE · Sit on top of barrel, feet placed on mat, knees bent in the shown examples. Spine Stretch Forward: arms forward and spine rounds; Roll Down: hands at head and trunk flexes; Spine Twist: arms open horizontally; Mermaid with Rotation: one arm up then forward reach/rotation. COACHING · Keep pelvis supported, avoid lifting feet; gaze follows trunk rotation comfortably. Hip flexion with feet planted; do not overstate hip rotation.","breath":"SOURCE · No individual inhale/exhale directions printed on this photo page; section says Mat exercise sequence/breathing/precautions are unchanged. Refer to corresponding Mat entries.","check":"SOURCE · Indication: tight hamstrings or difficulty keeping spinal/pelvic neutral while sitting. COACHING · Barrel must not roll; do not confuse Spine Roll Back, Spine Lean Back and Roll Down, which are separately named.","regress":"COACHING · Reduce trunk range and place hands at thighs for assistance, if needed.","variations":"SOURCE · Seated Arc Barrel/Box adaptation of SIX distinct named Mat exercises; not six novel exercise definitions."};
detail["059"]={"target":"SOURCE · Printed p.62, prone over Arc Barrel, for lumbar tension or marked anterior pelvic tilt. Illustrated: Breast Stroke Prep — Hand By Shoulder, Slow Swan, Single Leg Extension, Double Leg Extension. Slow Swan note: can expand range of motion. COACHING · Spinal extensors and gluteals act according to movement; scapular stabilizers in breast-stroke prep.","alignment":"SOURCE · Prone trunk/pelvis draped over barrel. Breast Stroke Prep uses forearm support, elbows bent and head/chest lifting; Slow Swan shows trunk lift and alternate lifted legs; Single Leg Extension one leg raised; Double Leg Extension both legs raised. COACHING · Keep hips square and neck long, gaze to floor/forward without excessive cervical extension. Feet hover on lifted legs; lower limbs may contact mat in start.","breath":"SOURCE · No independent breath sequence printed on p.62. The Arc Barrel section says use Mat breathing and precautions. Consult source-verified Mat 040, 044, 046, 047 for their actual phases.","check":"SOURCE · Prone barrel adaptation when lumbar tension or anterior pelvic tilt occurs. COACHING · Avoid levering through lumbar spine, slipping barrel, or lifting legs beyond controlled hip extension.","regress":"COACHING · Smaller lift, leg-only or upper-body-only work depending on the named exercise.","variations":"SOURCE · Arc Barrel modification of four previously named Mat movements; Slow Swan may have larger movement range."};
detail["060"]={"target":"SOURCE · Printed p.63, Gym Ball introduction. Ball is unstable and supports whole-body/core training, relaxation, circulation, stretch and balance. Ball sizing guidance by seated knee angle, supine knee alignment, side-lying shoulder-to-wrist length, bridge sitting angle. Pictured Curl Up, Hundred and Criss Cross on ball; ball under knees/feet. COACHING · Abdominal and hip stabilization are challenged by moving support.","alignment":"SOURCE · Curl Up/Hundred photos: supine with legs supported on ball, arms reaching; Criss Cross with knees bent on ball. The page permits ball under calves and simultaneous Arc Barrel upper-thorax support. COACHING · Keep ball from rolling, pelvis controlled and neck relaxed; foot/shin contact with ball varies across pictured variants.","breath":"SOURCE · Explicit statement: Mat exercise sequence, breathing and cautions remain the same. No new printed per-movement inhale/exhale here.","check":"SOURCE · Size should allow comfortable posture and appropriate joint angles. COACHING · Use wall stabilization or assistant if ball rolls; never infer precise ball size from photo alone.","regress":"COACHING · Use ball closer to body or feet on floor as appropriate.","variations":"SOURCE · Gym Ball support for Curl Up, Hundred and Criss Cross; optional ball under calves and Arc Barrel combined."};
detail["061"]={"target":"SOURCE · Printed p.64, Gym Ball: Bridge and Single Leg Lift. Bridge shows torso resting on ball, feet on mat and knees flexed; Single Leg Lift shows supine pelvis elevated, heels on ball and alternate straight-leg lifts. COACHING · Bridge uses hip extensors and trunk stabilization; Single Leg Lift challenges gluteals/hamstrings and anti-rotation.","alignment":"SOURCE · Bridge: ball under upper back, feet flat on mat, knees bent, arms crossed on chest. Single Leg Lift Starting Position: supine, arms long beside body at pelvis width, straight legs hip-width with heels placed on ball, gaze ceiling. COACHING · Keep hips level, no excessive lumbar extension; bridge foot soles on mat, single-leg lift supporting heel on ball while lifted foot has no contact.","breath":"SOURCE · Bridge: INHALE Starting Position → EXHALE Hip Extension (return not explicitly labeled). Single Leg Lift: INHALE Hip Extension → EXHALE One Leg Lift → INHALE Leg Off → EXHALE Other Side Leg Lift → INHALE Leg Off → EXHALE Return to Starting Position. 'Leg Off' wording preserved verbatim; meaning not silently revised.","check":"SOURCE · No dedicated Watch Point section printed on this page. COACHING · Stabilize rolling ball, prevent pelvis tipping or knee valgus, avoid neck loading.","regress":"COACHING · Reduce bridge height; keep both heels on ball before attempting alternate leg lift.","variations":"SOURCE · Two separate exercises on one photographed page, not one combined exercise."};
detail["062"]={"target":"SOURCE · Printed p.65, Gym Ball: Double Leg Lower & Lift and Back Extension. Double Leg Lower & Lift pictured supine holding ball between feet/ankles, straight legs vertical then diagonally lowered. Back Extension is prone with pelvis/abdomen supported on ball and legs long behind. COACHING · Lower/lift: abdominals, hip flexors/adductors; back extension: spinal extensors, gluteals and scapular stabilizers.","alignment":"SOURCE · Double Leg Lower & Lift: arms along sides, ball between feet, legs move together without mat foot contact. Back Extension starting position: prone, legs straight and hip-width supported against wall, hands joined at forehead; photos show trunk lifted and arms reaching forward. COACHING · For lower/lift, avoid lumbar arch and hip rotation; for extension, keep gaze diagonally down and neck long; toes/forefeet press wall/floor for stability as shown, but precise contact not stated in text.","breath":"SOURCE · Double Leg Lower & Lift: no printed breathing text on this page; do not fabricate. Back Extension: INHALE Ready → EXHALE Spinal Extension → INHALE Return to Starting Position.","check":"SOURCE · No separately printed Watch Point section. COACHING · Keep ball from rolling; avoid lumbar hinging, over-lowering legs or cervical compression.","regress":"COACHING · Lower legs only within abdominal control; shorten extension range and keep hands at forehead.","variations":"SOURCE · Two separate exercises on p.65; no explicitly labeled Variation section."};
detail["063"]={"target":"SOURCE · Printed p.66 Gym Ball. Two separately labeled movements: Scapula Movement and Pec Stretch. Scapula Movement uses quadruped shoulder stabilization with one hand gently pressing ball; Pec Stretch lowers trunk toward floor to feel pectoral lengthening. COACHING · Serratus anterior, trapezius, rotator cuff stabilize scapula; pectoralis major/minor may stretch.","alignment":"SOURCE · Quadruped/table position, one palm on ball and other on mat, knees and shins supported; for Pec Stretch trunk drops lower toward ball. COACHING · Keep hips over knees, pelvis neutral, eyes to mat, avoid cervical overextension; toes/shins contact mat, working palm presses ball.","breath":"SOURCE · Scapula Movement: INHALE Reach Arm bend (printed English wording; Korean says extend arm until scapula can stabilize) → EXHALE Return to Starting. Pec Stretch: no explicit inhale/exhale sequence printed.","check":"SOURCE · Stabilize shoulder girdle before gently pressing ball. COACHING · Avoid shoulder elevation, elbow lockout, ball rolling and painful anterior shoulder stretch.","regress":"COACHING · Place ball against wall or shorten reach; stop at comfortable pec stretch.","variations":"SOURCE · Pec Stretch is a separate illustrated movement, not a stated variation of Scapula Movement."};
detail["064"]={"target":"SOURCE · Printed p.67 Circle page contains FIVE named items: Lat Press, Single Lat Press, Mermaid, Arm Press AB, Hundred. Arm Press AB instruction: notice abdominal activation while squeezing Circle with both hands. COACHING · Latissimus dorsi, shoulder depressors, obliques and abdominal stabilizers contribute by exercise.","alignment":"SOURCE · Lat Press seated cross-legged with both palms on Circle; Single Lat Press one palm on upright Circle by side; Mermaid side bends with one palm on upright Circle and other arm overhead; Arm Press AB seated with Circle in front of chest, both hands compress sides; Hundred supine curled with Circle between lower legs/ankles. COACHING · Keep pelvis steady, shoulder away from ears, gaze in direction of trunk movement; foot contact varies: seated legs rest on mat, Hundred legs hover.","breath":"SOURCE · Lat Press: INHALE Ready → EXHALE Circle Press. The other four named photo examples have no printed breath sequence on p.67; consult Mat entries when applicable, do not attribute new breathing to source.","check":"SOURCE · Sit cross-legged for Lat Press; squeeze Circle with both hands for Arm Press AB to feel abdominal activation. COACHING · Avoid wrist collapse and over-squeezing Circle; Circle must be secure between legs in Hundred.","regress":"COACHING · Reduce Circle pressure or use a stable hand support during Mermaid.","variations":"SOURCE · Five distinct Circle uses. Mermaid here uses a single hand on an upright Circle, NOT the invented two-hand Circle hold used in earlier exam draft."};
detail["065"]={"target":"SOURCE · Printed p.68 Circle. Four distinct pictured exercises: Double Leg Stretch, Adductor Press, Hamstring Curl, Double Leg Extension. Adductor Press instruction: side-lying, compress Circle using adductors. Double Leg Extension caution: do not change starting knee angle during exercise. COACHING · Adductors, abdominals, hamstrings, hip extensors contribute depending on task.","alignment":"SOURCE · Double Leg Stretch: supine curl, Circle held between ankles/lower legs as arms and legs extend; Adductor Press: side-lying, Circle between feet/ankles, upper leg presses downward; Hamstring Curl: prone, knees flexed, Circle between ankles; Double Leg Extension: prone, knees bent, Circle between lower legs, legs lift. COACHING · Keep pelvis stacked for side lying; avoid lumbar arch in prone leg lift; feet/ankles press Circle and otherwise hover as shown.","breath":"SOURCE · No per-exercise breathing sequence printed on p.68; use corresponding Mat movement breath for shared movements, but do not invent Circle-specific source breath.","check":"SOURCE · Adductor Press uses adductors to compress Circle; Double Leg Extension preserves starting knee angle. COACHING · Prevent hip rolling, knee twisting and dropping Circle.","regress":"COACHING · Reduce pressure or range; keep lower leg supported during side-lying work.","variations":"SOURCE · Circle adaptations of Double Leg Stretch, Hamstring Curl and Double Leg Extension plus named Adductor Press."};
detail["066"]={"target":"SOURCE · Printed p.69 Circle: Stretch (Hamstring & Adductor & IT-Band). One supine stretching sequence with three pictured directions: hamstring toward torso, leg out to side, leg across body. COACHING · Hamstring posterior thigh, adductor medial thigh and lateral hip/IT band region are targeted depending on direction.","alignment":"SOURCE · Lie supine, one leg extended toward ceiling and opposite leg long toward floor; Circle is hooked at sole of raised foot, held with one or both hands. COACHING · Head/shoulders stay supported; gaze ceiling; pelvis remains heavy and stable, supporting heel rests on mat; raised foot presses Circle without excessive ankle inversion.","breath":"SOURCE · EXHALE draw straight knee toward trunk; EXHALE open leg sideways while keeping both sides of pelvis on floor; EXHALE send leg across opposite side without lifting both shoulders. No specific inhale phases printed.","check":"SOURCE · Keep pelvis grounded during abduction and both shoulders grounded during cross-body reach. COACHING · Avoid yanking Circle, knee hyperextension and painful nerve tension.","regress":"COACHING · Bend raised knee slightly or reduce stretch angle.","variations":"SOURCE · Three directions within one stretch sequence; not three unrelated exercise pages."};
detail["067"]={"target":"SOURCE · Roll Over, printed p.24 (additional photograph). Why: hip abduction/adduction control, abdominal strengthening, spinal segmental control and spinal stretching. Movement Point: Transverse Abdominis, Pelvic Floor; spinal flexion Rectus Abdominis & Oblique; hip flexion Hip Flexor. This is Roll Over, NOT Roll Up.","alignment":"SOURCE · Supine imprinting, arms long beside trunk with palms on mat, both legs extend diagonally toward ceiling. Photos show straight legs travelling overhead while shoulders and upper arms remain supported. COACHING · Keep weight away from cervical spine; neck long and gaze toward ceiling; hips flex without using momentum. Feet leave mat throughout leg phases.","breath":"SOURCE · INHALE Hip Flexion → EXHALE Roll Over → INHALE Leg Abduction → EXHALE Roll Down → INHALE Leg Adduction. Maintain source order; do not substitute Roll Up breath.","check":"SOURCE · Concentrate on segmental spinal motion; avoid pushing off with arms; maintain hip-joint angle instead of swinging leg weight; same speed rolling over and down. COACHING · Reduce range or omit if cervical load or neck symptoms; no unsupported head turn during inversion.","regress":"COACHING · Smaller leg lever and limited range; avoid full inversion if not safely controlled.","variations":"SOURCE · Omit Abduction & Adduction (Ab & Ad 제외하기). Red handwriting at top is not confidently legible and is not transcribed as verified."};
detail["068"]={"target":"SOURCE · Side Leg Series 3. Knee Open, printed p.40. Same source exercise as Mat 038, NOT an additional unique movement. Movement Point: Transverse Abdominis, Pelvic Floor; Hip Abduction / Abductor.","alignment":"SOURCE · Side-lying, spine and pelvis neutral; both legs bent with heels below buttocks; ankles/feet together. Lower arm supports head, top hand stabilizes torso on mat. COACHING · Look straight ahead with neck aligned; lower waist supported rather than collapsed.","breath":"SOURCE · INHALE Ready → EXHALE Knee Open → INHALE Starting Position.","check":"SOURCE · Prevent spinal lateral flexion or rotation; avoid excessive scapular tension; keep lower-side waist lifted so trunk does not collapse. Handwriting emphasizes that the two hip bones can stay stacked and bottom knee is supported; wording not all fully legible, so not treated as printed source.","regress":"COACHING · Reduce top-knee opening range while heels stay together.","variations":"SOURCE · Lift ankles/feet off mat while performing movement. COACHING · Check pelvis remains stacked when feet hover."};
detail["069"]={"target":"SOURCE · Circle overview, printed p.68. Four illustrated adaptations: Double Leg Stretch, Adductor Press, Hamstring Curl, Double Leg Extension. This page is a second photographed copy of the Circle overview already present in Mat 065; it is NOT four newly counted exercises.","alignment":"SOURCE · Double Leg Stretch: supine chest curl, Circle around lower legs/ankles, arms reach from knees toward overhead as legs extend. Adductor Press: side-lying, Circle held between ankles/feet. Hamstring Curl: prone with knees flexed and Circle between ankles/feet. Double Leg Extension: prone, knees flexed and Circle between ankles/feet. COACHING · Keep pelvic control and avoid squeezing so hard that trunk alignment changes; gaze follows neutral cervical alignment for each posture.","breath":"SOURCE · No independent breathing sequence printed on this overview. Follow corresponding Mat movement's verified source where applicable; do not fabricate breath counts.","check":"SOURCE · Adductor Press uses hip adductors to press the Circle. Double Leg Extension: maintain starting knee angle throughout the exercise (printed caution). COACHING · For prone work avoid lumbar overextension and keep hips level; maintain controlled Circle pressure.","regress":"COACHING · Smaller range or gentler Circle compression; do not claim printed variation.","variations":"SOURCE · Four illustrated Circle adaptations, no separate printed Variation block on this page."};
detail["Reformer - Back Rowing Series Prep - Round Back (리포머 백 로잉 준비 라운드 백).jpg"]={"target":"SOURCE · Why: 척추 기립근 스트레칭 및 복근 강화; 상체 협응력 증가. Movement Point: Transverse Abdominis, Pelvic Floor, Spinal Flexion (1), Spinal Neutral (2), Scapula Stabilizer. COACHING · 복직근·복사근의 분절 굴곡 조절과 견갑 안정에 집중.","alignment":"SOURCE · Printed p.34. 손으로 스트랩을 잡고 척추와 골반은 중립, 두 다리는 모으고 굽히지 않은 상태로 앞으로 뻗어 어깨 높이의 손잡이를 당겨 든다. COACHING · 좌골로 앉아 두 다리 뒤꿈치가 캐리지에 닿도록 유지; 고관절 중립, 발끝 방향은 자연스럽게. 시선은 정면에서 굴곡 시 배꼽 쪽으로 이동.","breath":"SOURCE · INHALE Ready → EXHALE Elbow Flexion & Roll Back → INHALE Keep → EXHALE Spinal Flexion Forward → INHALE Return to Starting Position.","check":"SOURCE · 어깨와 목의 긴장 방지; 캐리지 이동 방지; 견갑골 안정; 팔꿈치 움직임 조절 및 리듬; 복부 수축 유지; 캐리지 움직임 주의. COACHING · 손목을 꺾거나 팔 힘으로만 당기지 말고 허리 굴곡을 분절해 수행. 원본 필기 일부 불확실.","regress":"COACHING · 작은 범위 Roll Back → 손잡이 당김 없이 척추 굴곡 연습 → 전체 순서.","variations":"SOURCE · 별도의 Variation 항목 없음. COACHING · 범위와 스트랩 장력 조절."};
detail["Reformer - Back Rowing Series Prep - Flat Back (리포머 백 로잉 준비 플랫 백).jpg"]={"target":"SOURCE · Why: 척추 중립 인지 및 기립근·복근 지구력 강화, 상완이두근 강화. Movement Point: Transverse Abdominis, Pelvic Floor, Neutral Spine, Biceps Brachii, Scapula Stabilizer. COACHING · 고관절 굴곡 힌지와 견갑 안정 구분.","alignment":"SOURCE · Printed p.35. 손으로 스트랩을 잡고 척추·골반 중립, 다리를 모으고 굽히지 않은 채 손바닥이 천장을 향하도록 팔을 앞으로 들어 준비. COACHING · 좌골과 다리 뒤쪽으로 지지, 발은 캐리지 위에 길게 놓고 고관절 중립; 시선은 척추 연장선 따라 정면에서 약간 위쪽.","breath":"SOURCE · INHALE Ready → EXHALE Elbow Flexion & Lean Back → INHALE Elbow Extension → EXHALE Biceps Curl (3–5 repetitions printed) → INHALE Hip Flexion & Spine Elongation → EXHALE Return to Starting Position. COACHING · 원본의 3–5회는 교재 설명이며 시험의 전체 3회 제한과 별개.","check":"SOURCE · 목·어깨 긴장 방지; 캐리지 이동 방지; 견갑 안정과 팔꿈치 움직임 조절; 복부 수축으로 상체 조절; Rocking 금지; 팔의 움직임과 캐리지 움직임 주의. COACHING · 골반이 뒤로 말리는 Round Back과 구별하고 흉곽 과신전 방지.","regress":"COACHING · 짧은 힌지 범위 → 팔꿈치 굴곡만 → 전체 순서.","variations":"SOURCE · 별도 Variation 항목 없음. COACHING · 스트랩 장력과 Lean Back 각도 조절."};
detail["Reformer - Stag (리포머 스태그).jpg"]={"target":"SOURCE · Why: Hip Adduction & Abduction (고관절 내전·외전)을 통한 골반 안정성 강화. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Hip Lateral Rotation (고관절 외회전), Hip & Knee Flexion/Extension (고관절·무릎 굴곡/신전).","alignment":"SOURCE · Printed p.25. Supine on Reformer, both feet in straps, arms by sides, spine/pelvis neutral. Both legs externally rotated; one leg bends while the other remains long, then return. COACHING · Keep shoulders supported on carriage and pelvis level; avoid letting the straps pull the feet unevenly.","breath":"SOURCE · INHALE One Leg Frog With Other Leg Hip Abduction & Adduction (한 다리는 프로그, 다른 다리는 고관절 외전·내전) → EXHALE Return to Starting Position (시작 자세로 복귀).","check":"SOURCE · Do not rotate pelvis to either side; the two legs should move in different directions; keep strap tension throughout; prevent carriage movement. COACHING · Reduce leg range if lumbar arching or pelvic rotation appears.","regress":"COACHING · Smaller leg split and knee-bend range while maintaining strap tension.","variations":"SOURCE · No separate printed Variation section visible on p.25."};
detail["Reformer - Short Spine Prep (리포머 숏 스파인 준비).jpg"]={"target":"SOURCE · Why: Hip Lateral Rotator (고관절 외회전근) 활성화; 몸통과 골반 안정화. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Hip Extensor / Lateral Rotator / Medial Rotator / Adductor.","alignment":"SOURCE · Printed p.26. Supine, both feet in straps, both legs externally rotated, arms by sides, neutral spine/pelvis. Photos show parallel legs → hip flexion with lateral rotation/frog → return without spinal roll-over. COACHING · Keep sacrum supported; foot straps stay evenly tensioned.","breath":"SOURCE · INHALE Parallel → EXHALE Hip Flexion & Lateral Rotation → INHALE Frog Position → EXHALE Return to Starting Position.","check":"SOURCE · Do not lift pelvis off carriage; do not let quadriceps dominate; keep carriage movement constant; do not tilt pelvis as legs bend or straighten; hamstring lengthening must not lead to excessive pelvic lift. COACHING · Avoid pushing through painful hip rotation.","regress":"COACHING · Shorten the hip-flexion range and decrease external rotation.","variations":"SOURCE · Imprinting (임프린팅)으로 시작하기."};
detail["Reformer - Short Spine (리포머 숏 스파인).jpg"]={"target":"SOURCE · Why: Stretch the posterior aspect of spine (척추 후면 신장), elongate and strengthen hip and knee. Movement Point: Transverse Abdominis, Pelvic Floor; Hip Extensor / Lateral Rotator / Medial Rotator / Adductor; Spine Articulation (척추 분절 움직임).","alignment":"SOURCE · Printed p.27. Supine, both feet in straps, legs externally rotated, arms by sides. Six numbered photographs show long legs, hip flexion, spinal roll over, knee flexion/frog, articulated roll down, then legs lengthen. COACHING · Keep load off the neck and maintain even shoulder contact; avoid turning head while rolled over.","breath":"SOURCE · INHALE Parallel & Hip Flexion → EXHALE Roll Up & Over → INHALE Frog Position Hip Up → EXHALE Roll Down → INHALE Frog Position → EXHALE Return to Starting Position.","check":"SOURCE · Maintain appropriate spinal articulation; use Roll Over/Down to lengthen spinal curve, not to push through shoulders; keep carriage movement steady; keep legs from opening too widely during return and maintain strap tension. COACHING · Avoid loading cervical spine; omit rollover if not safely prepared.","regress":"COACHING · Practice Short Spine Prep first, without lifting pelvis.","variations":"SOURCE · Imprinting (임프린팅)으로 시작하기."};
detail["Reformer - Long Spine (리포머 롱 스파인).jpg"]={"target":"SOURCE · Why: 척추 길이 늘림, 스트레칭, 둔근·복부 근육 강화, Articulation 능력 강화. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Hip Lateral Rotation (고관절 외회전), Hip Flexion/Extension/Abduction/Adduction (고관절 굴곡·신전·외전·내전).","alignment":"SOURCE · Starting Position: supine on carriage, feet in straps, neutral pelvis, legs extended with straps under tension. Photos show feet supported in loops, shoulders/head on carriage, hands pressing along carriage. COACHING · Maintain long cervical spine; do not bear weight on neck; hip rotation controlled and symmetrical; gaze upward; avoid losing foot-strap contact.","breath":"SOURCE · INHALE Hip Flexion → EXHALE Roll Over → INHALE Abduction & Lateral Rotation → EXHALE Roll Down → INHALE Adduction & Return to Starting Position.","check":"SOURCE · Maintain spine length as rolling up and down; do not push carriage with arms; maintain leg length and tension; articulate vertebrae. COACHING · Avoid loading cervical spine or uncontrolled lumbar extension; stabilize scapulae.","regress":"COACHING · Reduce rollover height if full articulation is unavailable; use qualified supervision.","variations":"SOURCE · Hip Abduction / Adduction 제외하기 (omit hip abduction/adduction). Handwritten annotation unclear and excluded."};
detail["Reformer - Mid-Back Series - Page 1 (리포머 미드백 시리즈 1).jpg"]={"target":"SOURCE · Printed p.29. Two separate exercises: 1 Straight Press Down (스트레이트 프레스 다운), 2 Triceps Press Down (트라이셉스 프레스 다운). Upper-limb press with trunk stability; source page does not print separate muscle list.","alignment":"SOURCE · Both: supine on carriage, imprinting, both legs in Leg Folding, hands hold straps, shoulders and head supported. Straight Press Down: arms start toward ceiling and extend down toward carriage; Triceps Press Down: elbows bend beside trunk, upper arms stay relatively fixed. COACHING · Keep shoulder blades stable, hips flexed and knees bent approximately tabletop; feet hover, no foot contact with footbar; gaze ceiling.","breath":"SOURCE · 1 Straight Press Down: INHALE Ready → EXHALE Straight Press Down → INHALE Return to Starting Position. 2 Triceps Press Down: INHALE Elbow Flexion → EXHALE Triceps Press Down.","check":"SOURCE · Triceps starting text: avoid raising shoulders; keep elbows near trunk while extending arms. COACHING · Prevent ribs flaring and pelvis shifting; keep wrists aligned and avoid neck tension.","regress":"COACHING · Use lighter spring and/or supported feet if leg folding destabilizes pelvis.","variations":"SOURCE · No distinct printed Variation section on p.29. Handwritten annotations are not treated as printed instructions."};
detail["Reformer - Mid-Back Series - Page 2 (리포머 미드백 시리즈 2).jpg"]={"target":"SOURCE · Printed p.30. Two separate exercises: 3 Side Press Down (사이드 프레스 다운), 4 Arm Circle (암 서클). Source does not print a separate muscle list.","alignment":"SOURCE · Supine on carriage, imprinting, both legs in Leg Folding, hands in straps. Side Press Down: arms start open to the sides with elbows bent, then press toward carriage. Arm Circle: hands travel forward/up and out to sides, then return; both shoulders supported. COACHING · Maintain stable hips and ribs, head supported, gaze upward; feet off carriage during leg folding.","breath":"SOURCE · 3 Side Press Down: INHALE Ready → EXHALE Press Down → INHALE Return to Starting Position. 4 Arm Circle FORWARD: INHALE Flexion → EXHALE Horizontal Abduction & Adduction; REVERSE: INHALE Abduction → EXHALE Horizontal Adduction & Press Down.","check":"SOURCE · Imprinting and leg folding maintained through the series. COACHING · Avoid shoulder elevation, excessive shoulder extension, and uncontrolled carriage movement; keep elbows soft as needed.","regress":"COACHING · Lighter resistance or supported legs if trunk stability is insufficient.","variations":"SOURCE · No separate printed Variation section on p.30. Handwritten notes not verified."};
detail["Reformer - Mid-Back Series - Page 3 (리포머 미드백 시리즈 3).jpg"]={"target": "SOURCE · Printed p.31. Continuation of Mid-Back Series, not a new exercise. Why: trunk/pelvis/scapular stability, scapular depressor activation, shoulder flexor/extensor strength, arm-movement awareness. Movement Point: Transverse Abdominis, Pelvic Floor, Imprinting, Scapula Stabilizer; shoulder flexor/extensor (1,4), abductor/adductor (3,4), horizontal adduction/abduction (4), Triceps Brachii (2).", "alignment": "SOURCE · Photos show supine imprinting with Leg Folding, head/shoulders supported, hands holding straps. COACHING · Feet hover; gaze ceiling; keep both sides of pelvis equally supported. This page supplements p.29–30 rather than defining four additional exercises.", "breath": "SOURCE · No new breathing sequence on p.31. Use the individually printed sequences on p.29–30, not an invented common sequence.", "check": "SOURCE · Avoid neck/shoulder tension, elbow rocking and bent wrists; maintain imprinting without lumbar strain; focus on carriage movement. COACHING · Stabilization permits the scapula to move with the arm; do not pin it down.", "regress": "COACHING · Reduce arm range; support feet if Leg Folding causes loss of control.", "variations": "SOURCE · Trunk flexion; maintain trunk flexion; extend legs diagonally; combined movement of both arms. These are listed variations, not four new exercise records."};
detail["Reformer - Mid-Back Series - Page 4 (리포머 미드백 시리즈 4).jpg"]={"target": "SOURCE · Printed p.32. Shared Cadillac adaptation of the four Mid-Back exercises: Straight Press Down, Triceps Press Down, Side Press Down, Arm Circle. File was indexed under Reformer, but this page explicitly describes Cadillac setup.", "alignment": "SOURCE · Supine on sliding table facing away from head, holding straps, looking at ceiling; neutral spine/pelvis, knees bent, legs together. COACHING · Unlike Reformer p.29–31, the printed starting position here is neutral with feet supported in the first photograph.", "breath": "SOURCE · Same breathing as Reformer exercises. Spring strength can be heavier, so restrict range and coordinate equal bilateral movement under resistance.", "check": "SOURCE · Pay attention to balanced movement under heavier spring resistance. COACHING · Inspect attachment points; do not transfer Reformer spring settings to Cadillac.", "regress": "COACHING · Smaller range or adjusted resistance appropriate to this apparatus.", "variations": "SOURCE · Trunk flexion; hold trunk flexion; Leg Folding; diagonal leg reach; Unilateral; Reciprocal. Preserve apparatus distinction."};
detail["Reformer - Coordination (리포머 코디네이션).jpg"]={"target": "SOURCE · Printed p.33. Pelvic/scapular stabilization, elbow extensor and abdominal strengthening, upper/lower-limb coordination. Movement Point: TVA/Pelvic Floor; rectus abdominis/obliques for spinal flexion; hip flexors; hip abduction/adduction; elbow flexion/extension; scapular stabilizers.", "alignment": "SOURCE · Supine on carriage with shoulders about 5 cm below shoulder rests, imprinting, legs in Leg Folding, cervical and upper-thoracic flexion, gaze knees, arms slightly lifted with elbows bent. COACHING · Feet do not contact footbar; maintain long back of neck and even pelvic support.", "breath": "SOURCE · INHALE Reach Leg & Arm → EXHALE Hip Abduction & Adduction → INHALE Knee Flexion → EXHALE Elbow Flexion & Return to Starting Position.", "check": "SOURCE · Avoid shoulder/neck tension; maintain imprinting without lumbar strain; do not lose spinal flexion during movement; coordinate movement and tempo. COACHING · Arm/leg reach should not pull ribs upward or shoulders into elevation.", "regress": "SOURCE · Omit spinal flexion; omit elbow flexion. COACHING · Reduce leg reach angle/range before increasing lever length.", "variations": "SOURCE · Omit spinal flexion; omit elbow flexion. Handwritten notes are supplementary and not substituted for printed breathing."};
detail["Reformer - Chest Expansion (리포머 체스트 익스팬션).jpg"]={"target":"SOURCE · Printed p.38. Why: trunk stabilization, shoulder extensor strengthening, neutral spine and thoracic extensor endurance. Movement Point: transversus abdominis, pelvic floor, neutral spine, shoulder extensors and scapular stabilizers.","alignment":"SOURCE · Kneeling on carriage facing the pulleys, knees approximately hip-width, toes extended and tops of feet supported, upright neutral spine; arms at sides holding straps. Look forward at start. COACHING · Keep hip extension rather than folding at the hips; do not press toes into the footbar.","breath":"SOURCE · INHALE Ready → EXHALE Shoulder Extension → INHALE Turn One's Head Sideways → EXHALE Look a Head → INHALE Return to Starting Position. The head turn occurs while arms remain extended; no separate exhale phase is invented.","check":"SOURCE · Avoid rocking of the pelvis forward/back or side-to-side; carriage should not shake with movement; maintain extension of the elbows; avoid shoulder joint hyperextension and overusing the upper trapezius. COACHING · Keep the gaze level during head rotation; avoid rib flare and lumbar overextension.","regress":"COACHING · Reduce strap range and resistance or omit head rotation if balance and carriage control are insufficient.","variations":"SOURCE · Chest Expansion With Pulse. COACHING · Pulse should be small and controlled; handwritten notes on the page are not fully verified and are excluded from source facts."};

detail["Reformer - Sitting Arms Forward Footbar Series - Page 1 (리포머 풋바 방향 앉은 팔 시리즈 1).jpg"]={"target":"SOURCE · Printed p.36. Sitting Arm Forward Footbar Series: (1) Straight Forward and (2) Hugging Arm. Why: trunk and scapular stabilization, shoulder girdle and arm movement control. Movement Point: Transverse Abdominis/Pelvic Floor, Neutral Spine, Shoulder Flexion & Horizontal Abduction/Adduction, Scapula Stabilizer.","alignment":"SOURCE · Sit facing footbar on carriage with legs extended forward, heels/feet resting near footbar; hold straps, maintain neutral spine and upright trunk. For Straight Forward arms reach forward; Hugging Arm starts with arms opened, then closes forward in a rounded embrace. COACHING · Preserve seated-bone support and equal hip loading; avoid forced knee locking and shoulder elevation.","breath":"SOURCE · INHALE Ready → EXHALE Shoulder Flexion (1) / Horizontal Adduct (2) → INHALE Return to Starting Position. The page combines two exercises under one breathing sequence.","check":"SOURCE · Avoid rocking pelvis and trunk, losing neutral alignment, excessive scapular protraction, and shoulder/neck tension. Do not lock elbows; avoid carriage jerking. COACHING · Gaze level, keep ribs stacked above pelvis; use smaller reach if straps pull torso backward.","regress":"COACHING · Lighten spring resistance and reduce arm range while keeping the carriage steady.","variations":"SOURCE · No separate printed Variation section visible on p.36. Handwritten notes are not treated as printed instructions."};
detail["Reformer - Sitting Arms Forward Footbar Series - Page 2 (리포머 풋바 방향 앉은 팔 시리즈 2).jpg"]={"target":"SOURCE · Printed p.37. (3) Salute. Why: trunk/scapula stabilization, shoulder and elbow coordination. Movement Point: Transverse Abdominis/Pelvic Floor, Neutral Spine, Shoulder Flexion & Horizontal Abduction/Adduction, Scapula Stabilizer.","alignment":"SOURCE · Sit facing footbar, legs straight and feet supported forward; hold straps with elbows bent and hands near forehead/temples; extend elbows as hands travel diagonally forward/up, then return. COACHING · Keep hip bones evenly weighted, spine long and eyes ahead; avoid shrugging or hyperextending lumbar spine.","breath":"SOURCE · INHALE Ready → EXHALE Elbow Extension (3) → INHALE Return to Starting Position. Variation has its own separate sequence: INHALE Ready → EXHALE Shoulder Flexion → INHALE Shoulder Horizontal Abduction → EXHALE Shoulder Horizontal Adduction → INHALE Return.","check":"SOURCE · Maintain upright neutral pelvis/trunk, avoid overusing upper trapezius, maintain elbow and wrist alignment, prevent shoulder tension and carriage movement. COACHING · Do not let hands pull the neck forward; keep a controlled return.","regress":"COACHING · Reduce resistance and extension range to maintain neutral posture.","variations":"SOURCE · One combined sequence of Salute and arm opening/closing is pictured/printed; separate handwritten cues are not verified. No extra unprinted variation is attributed to the source."};
detail["cadillac-breathing-69"]={"target":"SOURCE · Cadillac Breathing, printed p.69. Why: Improve concentration by coordinating stability and spinal articulation; strengthen abdominals, gluteals and latissimus dorsi. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Articulation Spine (척추 분절), Hip Extensor (고관절 신전근), Shoulder Extensor (어깨 신전근), Scapula Stabilizer (견갑 안정근).","alignment":"SOURCE · Supine on Cadillac facing Roll Down Bar, neutral spine/pelvis. Legs externally rotated, feet secured in Trapeze straps, arms raised toward ceiling holding Roll Down Bar. COACHING · Feet are suspended in straps, not pressing mat; keep symmetric external rotation and knees aligned with toes; eyes upward with cervical spine long, wrists straight and shoulders away from ears. Verify strap/bar setup with instructor before loading.","breath":"SOURCE · INHALE Ready → EXHALE 5 Counts, Roll Up with Push Down & One Long Line (5카운트 내쉬며 바를 아래로 누르고 몸을 길게 연결하며 들어올리기) → INHALE Return to Starting Position (들이마시며 시작 자세로 복귀). Printed breathing labels are preserved; no extra phase invented.","check":"SOURCE · Focus on sequential spinal movement and breathing. Avoid elbow rocking or bent wrists. Maintain externally rotated feet in straps with ankles dorsiflexed so feet do not slip. While pressing the bar, avoid shoulders hiking or rounding forward. COACHING · Watch asymmetric pelvic lift, rib flare and neck bracing; keep spring and strap tension controlled. A spotter is recommended for secure setup.","regress":"COACHING · Reduce lifting range and confirm comfortable supported straps and spring loading; stop if foot straps slip or shoulder/neck pain occurs. Not a printed variation.","variations":"SOURCE · Do not hold Roll Down Bar; hold vertical poles and focus on spinal movement (롤 다운 바 대신 수직바를 잡고 척추 움직임에 집중). Handwritten note near photos is not treated as printed instruction."};
const nav=document.getElementById('items'),panel=document.getElementById('panel');let selected=9;document.getElementById('category').onchange=()=>{selected=Math.max(0,data.findIndex(x=>x.group===document.getElementById('category').value));render()};function render(){const q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('category').value;nav.replaceChildren();data.forEach((d,i)=>{if(cat!=='all'&&d.group!==cat)return;if(!(d.name+' '+d.file).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='item'+(i===selected?' active':'');const n=document.createElement('b');n.textContent=d.file.slice(0,3);const t=document.createElement('span');t.textContent=d.name;b.append(n,t);b.onclick=()=>{selected=i;render()};nav.append(b)});const d=data[selected],k=d.detailKey||(d.group==='Mat / Small Props'?d.file.slice(0,3):''),x=detail[k]||detail[d.file]||(d.name==='Cadillac - Breathing (브리딩)'?detail['cadillac-breathing-69']:null)||(d.name==='Cadillac - Roll Down (캐딜락 롤 다운)'?detail['cadillac-roll-down-67']:null);panel.replaceChildren();const ey=document.createElement('div');ey.className='eyebrow';ey.textContent=d.group.toUpperCase()+' · '+k;const h=document.createElement('h2');h.textContent=d.name;panel.append(ey,h);const links=document.createElement('div');links.className='actions';const a=document.createElement('a');a.href=d.url;a.target='_blank';a.rel='noopener';a.textContent='Original photo · 원본 사진';links.append(a);panel.append(links);if(x){const fields=document.createElement('div');fields.className='fields';[['Target / Function (목표)',x.target],['Alignment / Foot / Gaze (정렬·발·시선)',x.alignment],['Breathing / Sequence (호흡·순서)',x.breath],['Watch Points (보상·주의)',x.check],['Regression (쉬운 단계)',x.regress],['Variations (추가 변형)',x.variations]].forEach(([label,value])=>{const f=document.createElement('div');f.className='field';const b=document.createElement('strong');b.textContent=label;const p=document.createElement('p');p.textContent=value;f.append(b,p);fields.append(f)});panel.append(fields)}else{const p=document.createElement('p');p.className='meta';p.textContent='원본 사진 색인이 연결되어 있습니다. 개별 동작 분석은 검증된 항목부터 추가합니다.';panel.append(p)}const n=document.createElement('p');n.className='note';n.textContent='학습용 추가 설명은 교재 원문과 구분됩니다. 원본 사진 링크를 통해 해당 페이지를 확인할 수 있습니다.';panel.append(n)}document.getElementById('search').oninput=render;render();
detail["Reformer - Kneeling Arms Forward Footbar Series - Page 1 (리포머 무릎 앉아 팔 시리즈 1).jpg"]={"target":"SOURCE · Printed p.39. Kneeling Arm Forward Footbar Series: (1) Straight Forward and (2) Biceps Curl. Why: shoulder and elbow flexor strengthening, trunk and scapular stability. Movement Point: Transverse Abdominis/Pelvic Floor, Neutral Spine, Scapula Stabilizer, Shoulder Flexion, Shoulder Circumduction (as printed), Elbow Flexion/Extension.","alignment":"SOURCE · Kneel on carriage facing footbar, knees hip-width, tops of feet against carriage, hold straps; neutral upright trunk. Straight Forward reaches both arms forward; Biceps Curl bends elbows without changing trunk. COACHING · Maintain knee/shin contact, level pelvis and forward gaze; avoid rib flare or excessive lumbar extension.","breath":"SOURCE · INHALE Ready → EXHALE (1) Shoulder Flexion / (2) Elbow Flexion → INHALE Return to Starting Position.","check":"SOURCE · Prevent carriage rocking and pelvis shifting; do not shrug shoulders; maintain balanced upper/lower trunk alignment; avoid elbow hyperextension and unnecessary strap/shoulder tension. COACHING · Keep wrists aligned and elbows tracking without shoulder elevation.","regress":"COACHING · Lighten spring, shorten range or reduce arm lever while preserving kneeling balance.","variations":"SOURCE · No separately labeled variation on printed p.39. Handwritten annotations are not treated as verified printed instructions."};
detail["Reformer - Kneeling Arms Forward Footbar Series - Page 2 (리포머 무릎 앉아 팔 시리즈 2).jpg"]={"target":"SOURCE · Printed p.40. Two distinct movements: (3) Teardrop outward/inward and (4) Salute. Why: shoulder-girdle strength and trunk stability. Movement Point: TVA/Pelvic Floor, Neutral Spine, Scapula Stabilizer, Shoulder Flexion, Shoulder Circumduction, Elbow Flexion/Extension.","alignment":"SOURCE · Kneeling on carriage facing footbar with straps; Teardrop begins hands low at sides, then sweeps outward/inward. Salute begins with bent elbows and hands near forehead, extends arms diagonally forward/up, then returns. COACHING · Keep shins and tops of feet in contact with carriage, hips extended and gaze forward; resist anterior pelvic tilt.","breath":"SOURCE · INHALE Ready → EXHALE (3) outward / inward OR (4) Elbow Extension → INHALE Return to Starting Position. Printed Salute photographs show elbows flexed near forehead before extension.","check":"SOURCE · Keep pelvis from rocking and carriage steady; avoid excessive shoulder/neck tension; preserve upright neutral spine. COACHING · Avoid lumbar arch as arms rise; keep neck relaxed.","regress":"COACHING · Use lighter springs, reduced reach or seated variation if kneeling control is insufficient.","variations":"SOURCE · Sitting Position for 1,3,4; Sitting Position — Offering (Elbow Flexion — Starting Position): EXHALE Elbow Extension → INHALE Shoulder Horizontal Abduction → EXHALE Shoulder Horizontal Adduction → INHALE Return to Starting Position. Printed variation '팔꿈치 펴힘으로 하기' retained as elbow-extension option. Handwritten markings not certified."};
detail["Reformer - Sitting Away Spring Series (리포머 스프링 반대 방향 앉은 팔 시리즈).jpg"]={"target":"SOURCE · Original photographed Cadillac p.41, not Reformer. Five movements listed: 1 Straight Forward, 2 Biceps Curl, 3 Teardrop Outward/Inward, 4 Salute, 5 Hugging Arm. The Drive filename incorrectly says Reformer; the image's printed equipment heading is Cadillac.","alignment":"SOURCE · Sit facing Push-thru Bar and hold the handles; legs crossed or extended in a comfortable sitting position. COACHING · Keep pelvis supported and trunk tall, with shoulders relaxed; knee and foot contact depend on chosen seated variation. The photograph does not prescribe a fixed foot placement or gaze direction.","breath":"SOURCE · This page does not print an independent inhale/exhale sequence for each of the five movements; it instructs the reader to follow the Reformer exercise sequence. COACHING · Breathe continuously and avoid holding the breath under spring tension; consult the matching Reformer source page before specifying phases.","check":"SOURCE · Maintain spring tension, avoid losing seat contact, and keep Salute around shoulder height. COACHING · Resist trunk sway and excessive neck tension; control both pulling and returning phases. Exact muscles for each variation are not printed on this page.","regress":"COACHING · Reduce spring load or arm range, preserve seated balance and secure handle grip.","variations":"SOURCE · Kneeling Position, Unilateral, Reciprocal. Handwritten annotations are excluded from verified printed content. Category correction verified visually; full cross-page exercise protocol remains pending."};

detail["001_Cadillac - Airplane Prep (에어플레인 준비 동작).jpg"]={"target":"SOURCE · Printed p.68, title 'Airplain Prep' (source spelling retained; catalog Airplane Prep). Why: spinal stretching/segmental movement and increased whole-body awareness. Movement Point: Transverse Abdominis, Pelvic Floor; spinal flexion: Rectus Abdominis & Obliques; scapular flexor/extensor and stabilizer. COACHING · Controlled posterior-chain lengthening; avoid forcing cervical flexion.","alignment":"SOURCE · Supine on Cadillac, head toward Roll Down Bar; bar behind knees, hands reach up to grasp vertical poles; pelvis neutral and both legs parallel in Leg Folding/tabletop. Photos show knees initially bent with bar behind knees; feet are suspended (not weight-bearing), then legs lengthen as hips extend. COACHING · Gaze up at ceiling at rest; maintain symmetric hip/knee tracking, even bar contact behind knees and controlled shoulder position; do not push through feet.","breath":"SOURCE · INHALE Ready → EXHALE Hip Extension → INHALE Hip Flexion → EXHALE Roll Up → INHALE Return to Starting Position. The image sequence shows hip extension with heels moving toward mat, return to tabletop, pelvis/spine rolling up, then lowering.","check":"SOURCE · Avoid shoulder/neck tension; do not pull on vertical bars; use abdominal control to avoid lifting the ribs excessively; instructor must assist so bar does not slip from behind knees. COACHING · Keep cervical weight-bearing minimal and avoid jerking pelvis overhead; use spotting and appropriate spring tension.","regress":"COACHING · Perform only hip extension/flexion without spinal roll-up; reduce range and require instructor supervision.","variations":"SOURCE · (1) Hip joint movement only; (2) spinal movement only. Printed page does not provide separate variation breathing. Handwritten annotations are not independently certified."};

detail["cadillac-roll-down-67"]={"target":"SOURCE · Cadillac Roll Down, photographed printed p.67. Why: improve spinal segmental articulation and abdominal strength; strengthen scapular depressors and shoulder extensors. Movement Point: Transverse Abdominis (복횡근), Pelvic Floor (골반저근), Spinal Flexion: Rectus Abdominis & Oblique (복직근·복사근), Scapula Stabilizer (견갑 안정근).","alignment":"SOURCE · Supine on Cadillac mat with both feet placed on vertical poles, legs extending upward; hold Roll Down Bar with hands raised toward ceiling. Photos show feet contacting vertical poles throughout and arms extending then pressing bar toward trunk. COACHING · Feet are on vertical poles, not in straps; gaze forward/up during curl, keep chin gently tucked without forcing neck flexion; maintain even hip position and bilateral foot pressure. Exact hip rotation is not specified in printed text.","breath":"SOURCE · INHALE Ready → EXHALE Roll Down (척추를 순차적으로 내리기) → INHALE Lying on the Bed (베드에 누운 자세) → EXHALE Roll Up (척추를 순차적으로 올리기) → INHALE Return to Starting Position (시작 자세 복귀). Keep printed sequence names even though photograph order may appear counterintuitive; do not substitute Roll Up or Curl Up protocols.","check":"SOURCE · Avoid lifting shoulders or neck tension; focus on segmental spinal movement; move the bar without elbows rocking or bent wrists; when pressing bar, keep shoulders from hiking or rounding. COACHING · Stabilize pelvis and feet, avoid abrupt cervical loading, use controlled springs and smooth eccentric articulation. The printed text does not specify a gaze cue or exact hip rotation.","regress":"COACHING · Reduce spinal articulation range, perform a small supported curl with feet stable and supervision; not a printed variation.","variations":"SOURCE · (1) Place Roll Down Bar above head (Roll Down Bar 머리 위로 올리기); (2) bend knees (무릎 굽히기). Handwritten red annotations excluded from printed source."};
detail["cadillac-page-70"]={"target":"SOURCE · Printed p.70 Push-thru with Feet — 1. Double Leg Pump. Why: Knee Flexor 강화, 몸통과 골반 안정화. Movement Point: Transverse Abdominis, Pelvic Floor; Hip & Knee Flexion & Extension; Scapula Stabilizer.","alignment":"SOURCE · Starting Position: 척추·골반 중립, 두 다리를 모아 Push-thru Bar에 발바닥을 올리고 고정 바에 등을 기댄다. 양팔은 골반 옆에 내린다. PHOTO 1–8 · 두 발을 함께 바에 대고 무릎을 굽혔다 펴며 엉덩이를 지지면에서 들어 올리는 구간과 굴곡·신전 반복을 보여준다. COACHING · 발 앞쪽/발바닥 접촉을 유지하고 고관절과 무릎이 같은 방향으로 움직이는지 관찰한다. 시선은 정면에 가깝게 유지하되 인쇄된 별도 시선 지시는 없다.","breath":"SOURCE · INHALE Knee Flexion → EXHALE Knee Extension & Roll Up & One Long Line → INHALE Keep → EXHALE Double Leg Pump 3 Pulse → INHALE Knee Extension & Roll Up & One Long Line → EXHALE Roll Down & Neutral → INHALE Knee Flexion → EXHALE Knee Extension & Return to Starting Position.","check":"SOURCE · 어깨와 목 긴장 금지; 척추 순차 움직임 집중; 한 다리를 들 때 골반이 틀어지지 않도록 주의; 팔을 과도하게 사용하지 않고 체중이 목에 실리지 않도록 주의. COACHING · 바가 튀지 않도록 스프링 저항을 천천히 조절하고 손 지지를 확인한다.","regress":"SOURCE · Prep: 다리 움직임만 해보기(Push-thru Bar 움직임 없이). COACHING · 리프트를 낮게 유지하고 통제 가능한 작은 펌프 범위부터 연습.","variations":"SOURCE · Prep — 다리의 움직임만 해보기 (Push-thru Bar 움직임 없이)."};
detail["cadillac-page-71"]={"target":"SOURCE · Printed p.71 Push-thru with Feet — 2. Single Leg. Why: Hip Extensor 강화, Hip Flexor & Extensor 조절 능력 향상.","alignment":"SOURCE · 척추·골반 중립, 두 다리를 모아 Push-thru Bar에 발바닥을 올리고 고정 바에 등을 기댄다. PHOTO 1–8 · 양발 접촉에서 시작해 무릎 굽힘 → 신전 및 Roll Up → 한 다리를 바에서 들어 Reach Ceiling → 한 다리를 바 쪽으로 다시 내림 → Roll Down. COACHING · 지지 발의 바 접촉을 유지하고 한쪽 고관절 굴곡 중 골반의 좌우 회전과 견갑 지지 변화를 확인한다. 인쇄된 별도 시선 방향은 없다.","breath":"SOURCE · INHALE Knee Flexion → EXHALE Knee Extension & Roll Up & One Long Line → INHALE One Leg Hip Flexion with Reach Ceiling → EXHALE Other Leg Hip Flexion with Reach → INHALE Hip Extension & One Long Line → EXHALE Roll Down → INHALE Knee Flexion → EXHALE Return to Starting Position.","check":"COACHING · 한 다리를 들 때 바를 누르는 발과 손의 지지점이 바뀌지 않도록 하며 목에 체중이 실리지 않게 한다. SOURCE · 이 페이지에는 별도 Watch Point 항목이 보이지 않는다.","regress":"SOURCE · 한 다리만 하기. COACHING · 지지 발의 압력과 골반 정렬이 유지되는 범위에서 리프트 높이를 줄인다.","variations":"SOURCE · 한 다리만 하기; 뻗는 다리 구부리기."};
detail["cadillac-page-72"]={"target":"SOURCE · Printed p.72 Push-thru with Feet — 3. Single Leg Pump. Why: Hip Extensor & Knee Flexor 강화, 몸통과 골반 안정화; Hip Flexor & Extensor 조절 능력 향상.","alignment":"SOURCE · 척추·골반 중립, 두 다리를 모아 Push-thru Bar에 발바닥을 올리고 고정 바에 등을 기댄다. PHOTO 1–8 · 두 발로 무릎 굽힘 → 무릎 펴며 Roll Up → 한 다리 들어 Reach Ceiling → 바 위 지지 다리만 굽혀 3 Pulse → 펴고 Roll Down → 무릎 굽혀 복귀. COACHING · 바에 닿는 발의 압력과 발목 정렬을 유지하고 들어 올린 다리의 고관절 굴곡 시 골반이 회전하지 않는지 관찰한다. 인쇄된 별도 시선 지시는 없다.","breath":"SOURCE · INHALE Knee Flexion → EXHALE Roll Up & One Long Line → INHALE One Leg Hip Flexion with Reach Ceiling → EXHALE Single Leg Pump 3 Pulse → INHALE Knee Extension → EXHALE Hip Extension & One Long Line → INHALE Roll Down → EXHALE Knee Flexion Return to Starting Position.","check":"COACHING · 스프링 반동을 피하고 펌프 중 지지 다리의 무릎·발목·고관절이 통제되는지 확인한다. 목과 어깨에 과도한 체중을 싣지 않는다. SOURCE · 별도 Watch Point 항목은 인쇄되어 있지 않다.","regress":"SOURCE · Pulse 제외하기; 뻗는 다리 구부리기. COACHING · 짧은 범위의 한 다리 펌프부터 시작한다.","variations":"SOURCE · Pulse 제외하기; 뻗는 다리 구부리기."};
detail["cadillac-page-59"]={"target":"SOURCE · Printed p.59 Sit up Combo. Why: 복부 근지구력 향상, 견갑대 안정화. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Flexion — Rectus Abdominis & Oblique; Scapula Stabilizer; Elbow Flexion.","alignment":"SOURCE · Starting Position: 척추와 골반 중립, Push-thru Bar 쪽으로 머리를 두고 누워 두 다리는 굽혀 발바닥을 벽에 댄다. 두 손은 바를 어깨너비로 잡고 견갑골을 안정시킨다. PHOTO 1–5: 팔꿈치 굽힘과 머리/몸통 말아올리기 → C-curve 롤업 → 요추부터 롤다운 → 시작 자세. COACHING · 사진의 발은 벽을 지지하며 골반 움직임을 조절한다. 턱을 과도하게 당기거나 시선을 천장에 고정하지 말고 목의 연장을 유지한다. 사진에 별도 시선 지시 없음.","breath":"SOURCE · INHALE Ready → EXHALE (C-curve) Roll Up → INHALE Keep → EXHALE (Lumbar) Roll Down → INHALE (C-curve) Roll Up → EXHALE Return to Starting Position.","check":"SOURCE · 척추의 순차적인 움직임에 집중한다. Bar에 의지해 척추를 굴곡하며 복부 근육의 사용에 집중한다. Bar에 매달려 있지 않도록 한다. C-curve가 풀리지 않도록 더 깊은 복부 사용을 유지한다. 손목이 꺾이지 않도록 한다. COACHING · 경추 통증이나 팔 당김이 생기면 바의 보조력을 낮추고 범위를 줄인다.","regress":"COACHING · 머리/견갑만 들어올리는 작은 범위로 시작하고 벽을 미는 힘을 과도하게 사용하지 않는다.","variations":"SOURCE · Variation 제목 아래 별도 동작이 기재되어 있지 않음."};
detail["cadillac-page-57"]={"target":"SOURCE · Printed p.57 Spread Eagle Prep. Why: 척추 분절운동 인지 능력 향상, 완전한 신전 스트레칭, 어깨 안정화. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Articulation; Cervical & Upper Thoracic Extension; Scapula Stabilizer.","alignment":"SOURCE · Starting Position: 골반을 길게 펴서 어깨높이로 바를 잡고 척추와 골반은 중립으로, 골반을 뒤로 밀며 무게중심을 골반 쪽으로 보내 Pike 자세를 만든다. PHOTO 1–5: 뒤로 기댄 Pike → 몸통 길게 정렬 → 경추·상부흉추 신전 → 경추·흉추 굴곡 → 원위치. COACHING · 발은 프레임 하단에 접촉한 상태로 몸통의 전후 이동을 지지한다. 시선은 목 신전 시 자연스럽게 위쪽으로 바뀌지만 과신전하지 않는다. 사진의 손글씨는 원본 인쇄 지시와 구별한다.","breath":"SOURCE · INHALE Ready → EXHALE Articulation & One Long Line → INHALE Arm Flexion with Cervical and Thoracic Extension → EXHALE Articulation → INHALE Return to Starting Position.","check":"SOURCE · 견갑골의 안정화에 집중한다. 흉추와 척추를 신전할 때 반드시 팔꿈치를 구부려야 한다. 척추의 순차적인 움직임에 주의한다. COACHING · 팔을 과도하게 당기지 말고 발바닥의 지지와 견갑 움직임을 함께 확인한다.","regress":"SOURCE · 척추 신전 제외하기. COACHING · 신전이 불편하면 몸통 정렬과 작은 범위의 분절운동만 실시한다.","variations":"SOURCE · 척추 신전 제외 하기."};
detail["cadillac-page-60"]={"target":"SOURCE · Printed p.60 Teaser. Why: 척추의 분절능력 향상, Hip Flexor와 복부근 강화, 협응력 향상. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Flexion — Rectus Abdominis & Oblique; Hip Movement — Hip Flexor; Scapula Stabilizer.","alignment":"SOURCE · Starting Position: 척추와 골반 중립, Push-thru Bar 쪽에 머리가 향하도록 누워 두 다리는 모아 길게 뻗고 양손은 Push-thru Bar를 잡고 머리 위로 뻗는다. PHOTO 1–5: 누운 자세 → 팔꿈치 굽혀 바 접근 → 몸통과 양다리 들어 V-position → 분절 롤다운 → 팔 펴서 복귀. COACHING · 다리는 시작 자세에서 매트에 접촉하고 V-position에서는 매트에서 떨어진다. 고관절 굴곡과 복부 굴곡을 동시에 조절하며 목만 먼저 들지 않는다. 원본에 별도 시선 방향은 없다.","breath":"SOURCE · INHALE Elbow Flexion → EXHALE Roll Up & V-Position → INHALE Roll Down & Elbow Flexion → EXHALE Return to Starting Position.","check":"SOURCE · 척추의 순차적인 움직임에 집중한다. 머리를 너무 많이 사용해 배를 들지 않도록 한다. 고관절 굴곡근에 허리가 당겨지지 않도록 반드시 Imprinting을 지나면서 다리를 들어 올려야 한다. COACHING · 허리 통증이나 과도한 고관절 앞쪽 긴장이 생기면 무릎 굽힘 또는 다리 높이 조절을 우선한다.","regress":"SOURCE · 무릎 굽히기. COACHING · 다리와 몸통의 레버 길이를 줄여 척추 분절 조절을 먼저 학습한다.","variations":"SOURCE · 무릎 굽히기."};

detail["cadillac-page-67"]={"target":"SOURCE · Printed p.67 Roll Down. Why: 척추의 분절능력 향상, Scapula Depressor 활성화 및 복부근육 강화, 골반과 척추 움직임에 대한 인지력 향상. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Flexion — Rectus Abdominis & Oblique; Scapula Stabilizer.","alignment":"SOURCE · Starting Position: 양발을 수직바에 맞대고 어깨너비로 벌린다. Roll Down Bar를 잡고 척추를 골반 위로 길게 늘린다. 사진 1–5: 앉아 팔을 전방으로 뻗음 → 골반부터 뒤로 굴림 → 척추를 순차적으로 내리며 누움 → 다시 상체를 말아 올림 → 처음 자세로 복귀. COACHING · 양발 접촉을 유지하고 무릎은 원본 사진처럼 길게 편다. 팔은 바를 부드럽게 잡고 견갑대를 안정화한다. 시선은 롤다운 중 몸통 방향을 따라 자연스럽게 이동한다(원본에 시선 문구 없음).","breath":"SOURCE · INHALE Ready → EXHALE Roll Down → INHALE Lying on the Bed → EXHALE Roll Up → INHALE Return to Starting Position.","check":"SOURCE · 어깨와 목의 긴장이 생기지 않도록 주의한다. 척추의 순차적인 움직임에 집중한다. 머리가 전방으로 이동하지 않도록 흉추의 경추의 정렬에 집중한다. 척추를 앞으로 숙일 때 최대한 등 굽게 굴곡하며 길게 펴지지 않도록 한다. 손목이 꺾이지 않도록 주의한다. COACHING · 바의 스프링 저항을 당기기보다 복부 조절로 척추 분절을 진행하며 목 통증 시 범위를 줄인다.","regress":"SOURCE · Roll Down 범위 줄이기; 무릎 굽히기. COACHING · 골반 후방경사부터 작은 범위로 연습하고 무릎을 굽혀 지렛대를 줄인다.","variations":"SOURCE · Roll Down 범위 줄이기; 무릎 굽히기."};
detail["cadillac-page-75-visual"]={"target":"SOURCE (PHOTO ONLY) · Printed p.75 Ballet Stretch: eleven numbered photographs; no printed Why, Starting Position, Breathing, Movement Point, Watch Point or Variation paragraphs on this page. SOURCE STATUS: VISUALLY INSPECTED, NOT FULLY VERIFIED. COACHING · 기구 지지를 활용한 서서 하는 고관절·하지 가동성, 균형, 몸통 측굴·신전 연습으로 활용 가능하나 원본 지시가 아닌 지도자 해설이다.","alignment":"SOURCE (VISUAL) · Photos 1–3: 옆으로 선 채 한쪽 다리를 수평 바/스트랩 쪽으로 올리고, 서 있는 다리로 지지하며 상체를 앞쪽으로 숙인다. Photos 4–8: 지지 다리를 뒤쪽으로 뻗거나 무릎을 굽히는 자세, 정면 다리 벌림과 옆구리 굽힘 자세가 각각 보인다. Photos 9–11: 뒤쪽 다리를 스트랩/바에 놓고 상체를 세우거나 앞쪽으로 이동하며 흉추를 편다. COACHING · 사진의 순서를 단일 연속 동작으로 단정하지 않고 각 자세를 별도 스트레치 선택지로 다룬다. 발·스트랩 접촉과 손잡이 높이를 개별적으로 확인한다.","breath":"SOURCE · Printed breathing instructions absent. COACHING · 지지와 정렬을 준비할 때 편안히 들이마시고, 움직임 범위를 넓힐 때 천천히 내쉰다. 숨을 참지 않는다. 원본 호흡으로 오인하지 않는다.","check":"SOURCE · Printed watch-point text absent. COACHING · 고관절을 과도하게 비틀거나 지지 무릎을 잠그지 않고, 발이 스트랩에서 미끄러지지 않도록 점검한다. 견갑대와 골반의 정렬을 유지하고 균형이 불안하면 보조를 제공한다. 무리한 허리 과신전은 피한다.","regress":"COACHING · 다리 높이·스트레치 범위를 줄이고 두 손 지지를 유지한다. 원본 변형 지시 아님.","variations":"SOURCE · No printed variations; eleven numbered images show multiple positions. COACHING · 전방 다리 스트레치, 측면 스트레치, 후방 다리 스트레치를 개별 지도한다. 원본 분류·순서는 미확인."};
detail["chair-page-86"]={"target":"SOURCE · Chair Roll Over, printed p.86. Why: 척추기립근 스트레칭, 둔근·슬괵근·복근 강화, 척추의 순차적인 움직임 인지. Movement Point: Transverse Abdominis, Pelvic Floor; Spinal Articulation; Hip Flexion/Extension, Abduction/Adduction; Scapula Stabilizer.","alignment":"SOURCE · Starting Position: 머리가 체어를 향하도록 천장을 바라보고 눕는다. 두 다리는 모아서 길게 사선으로 뻗고, 팔은 머리 위로 길게 뻗어 페달 양 끝을 잡는다. 사진 1: 다리 낮은 사선, 사진 2: 다리 수직, 사진 3: 골반·척추 말아 올리며 다리를 머리 방향으로, 사진 4: 내려와 사선 복귀. 오른쪽 아래 Jack Knife 변형 사진. COACHING · 시선은 천장 쪽으로 유지하고 머리를 돌리지 않는다. 고관절 굴곡으로 다리를 들어 올리되 경추로 체중을 밀어 넣지 않는다. 발은 공중에 있으며 체어나 바닥에 닿지 않는다. 페달은 양손으로 잡아 견갑대를 안정시킨다.","breath":"SOURCE · INHALE Hip Flexion → EXHALE Roll Over → INHALE Roll Down → EXHALE Return to Starting Position.","check":"SOURCE · 어깨와 목에 긴장이 생기지 않는지 주의한다. 페달을 과도하게 당기지 않도록 한다. 머리가 프레임에 올라가지 않도록 한다. 반동으로 척추를 굴곡하지 않도록 한다. COACHING · 목을 지지점으로 삼지 않고 체중은 어깨띠와 등 쪽으로 분산한다. 목 통증·어지럼증이 있거나 조절되지 않는 척추 굴곡에서는 역전 범위를 피하고 다른 과제로 대체한다.","regress":"COACHING · 롤오버 없이 다리 들어 올리기와 작은 골반 말아 올리기를 각각 연습한다. 원본 인쇄 변형이 아님.","variations":"SOURCE · 내전 & 외전 하기; Jack Knife. COACHING · 다리 벌림·모음은 골반이 안정된 범위에서만, Jack Knife는 독립적으로 역전 제어가 가능한 경우에 한해 지도한다. 사진의 붉은 손글씨는 인쇄 원문과 구분한다."};
</script></body></html>
