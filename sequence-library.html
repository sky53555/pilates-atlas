</style><header><a href="./studio.html">Pilates Atlas Studio</a><h1>50-Minute Sequence Library</h1><p>주제별 초급·중급·고급 실전 수업 예시</p></header><main><div id="topics" class="filters"></div><div id="levels" class="filters"></div><div id="list" class="grid"></div><div id="detail"></div></main><script>
const topics=[["전신 컨디셔닝","r1 r2 r11 r3 r18 r4 r7","r1 r9 r14 r15 r4 r6 c1 c9 c11","r1 r13 r14 r15 r5 r6 r17 r8 c9 c12 c11","발 지지 → 팔다리 움직임 → 몸통 지지 → 마무리"],["복부·골반 안정화","m9 p2 m5 m10 p5 p7 m3 m8 m17 m19","r1 r3 r18 r14 r15 r4 r6 r16 r7","r1 r3 r18 r15 r5 r6 r17 r8 c3 c12 c11","골반 인지 → 사지 분리 → 지지 조건 변화"],["둔근·고관절 강화","m9 m1 p15 m3 p16 m2 m22 m4 m8 m21","r1 r10 r3 r14 r15 r6 c1 c8 c9 c11","r1 r10 r14 r15 r6 r8 c8 c9 c12 c11","고관절 움직임 → 저항 → 단측 지지"],["견갑대·흉곽","m7 m15 m16 m8 m6 p13 p14 m20 m21","r1 r18 r4 r5 r6 r16 c11 c5 c6","r1 r18 r4 r5 r6 r17 r8 c5 c6 c11","흉곽 움직임 → 팔 저항 → 견갑대 지지"],["척추 가동성","m9 m7 m15 m17 m8 p17 m19 m20 m21","c11 c4 c5 c6 b1 b5 b6 b3","t5 t1 t2 t3 t4 b1 b5 b6 b10 b3","척추 여러 방향 움직임 → 지지된 가동성"],["발·발목과 하체","r1 r2 r9 r10 r11 r13 r3 r7","r1 r2 r11 r13 r14 r15 c1 c10 c9","r1 r9 r11 r13 r14 r8 c8 c9 c10 c12","발 접촉 → 발목 조절 → 하체 지지"],["균형·협응","m9 m10 m1 m3 m2 m18 b9 b8 b7 b3","r1 r13 r14 r6 r8 c3 c9 c10 c12 c11","r1 r13 r15 r6 r17 r8 c8 c9 c12 c11","안정된 자세 → 교대 움직임 → 체중 이동"]],cards=[{"id":"r1","name":"Reformer Footwork: Heels (뒤꿈치 풋워크)","equipment":"리포머","goal":"하체·발 지지","setup":"누워 발뒤꿈치를 바에 두고 밀었다 천천히 닫는다. 6–8회.","anatomy":"무릎과 고관절이 함께 펴진다. 대퇴사두근과 둔근이 관여한다.","cue":"“멀리 밀고, 같은 속도로 돌아와요.” 무릎이 끝에서 튕기면 범위를 줄인다."},{"id":"r2","name":"Reformer Footwork: Toes (발볼 풋워크)","equipment":"리포머","goal":"하체·발 지지","setup":"누워 발볼을 바에 올리고 뒤꿈치 높이를 편안하게 유지하며 6–8회.","anatomy":"종아리 근육이 뒤꿈치 높이를 조절한다.","cue":"“발볼 넓게, 뒤꿈치 높이는 그대로.” 불편하면 뒤꿈치 버전으로 돌아간다."},{"id":"r3","name":"Bridge Prep (브리지 준비)","equipment":"리포머","goal":"고관절·몸통","setup":"캐리지가 안정적으로 닫힌 상태에서, 배운 발 지지 세팅으로 골반을 작게 들고 내린다. 5–6회.","anatomy":"대둔근과 햄스트링이 고관절 신전을 돕는다.","cue":"“양발로 누르고 골반을 조금만 들어요.” 캐리지가 움직이면 매트 브리지로 바꾼다."},{"id":"r4","name":"Sitting Arm Forward (앉아서 팔 앞으로 뻗기)","equipment":"리포머","goal":"상체·팔 움직임","setup":"배운 방향과 스트랩 설정에서 앉아 팔을 앞으로 뻗었다 돌아온다. 6회.","anatomy":"팔이 몸 앞쪽으로 움직이고 견갑골이 흉곽 위에서 따라간다.","cue":"“앉은뼈는 두고 손을 앞으로.” 몸이 딸려가면 범위를 줄이거나 스트랩 없이 연습한다."},{"id":"r5","name":"Front Rowing 1 Flat Back (프런트 로잉 1 플랫백)","equipment":"리포머","goal":"상체·몸통 유지","setup":"센터에서 배운 스트랩 경로로 진행하며 앉은뼈 위에 몸통을 길게 둔다. 5–6회.","anatomy":"팔에 걸리는 저항이 바뀌어도 몸통의 기울기를 조절한다.","cue":"“돌아올 때도 같은 속도로.” 세팅이나 팔 경로가 낯설면 r4를 고른다."},{"id":"r6","name":"Knee Stretch Flat Back (니 스트레치 플랫백)","equipment":"리포머","goal":"고관절·손 지지","setup":"센터 세팅에서 무릎을 대고 손으로 바를 지지한다. 등 모양을 유지하며 작은 범위로 캐리지를 움직인다. 5–6회.","anatomy":"고관절을 접고 펴면서 복벽과 견갑대가 몸통을 지지한다.","cue":"“등 모양 그대로, 무릎만 조금 멀리.” 지지가 어렵다면 매트 네발기기 뒤로 이동."},{"id":"r7","name":"Seated Mermaid (앉아서 머메이드)","equipment":"리포머","goal":"마무리·척추 측굴","setup":"안정된 앉은 지지에서 옆구리를 길게 하며 좌우 3회. 기구에서 지지가 어렵다면 매트에서 한다.","anatomy":"흉곽과 골반 사이가 측굴한다.","cue":"“위쪽 옆구리가 길어져요.” 팔 높이는 편하게 조정한다."},{"id":"r8","name":"Elephant (엘리펀트)","equipment":"리포머","goal":"고관절·손 지지","setup":"동작에 익숙한 회원이 배운 세팅에서 손과 발을 지지하고 캐리지를 작게 움직인다. 4–6회.","anatomy":"고관절과 다리가 움직이는 동안 어깨와 몸통이 지지를 유지한다.","cue":"“손과 발 지지를 유지하며 조금만.” 승하차나 지지가 어렵다면 r6 또는 매트 힙힌지."},{"id":"r9","name":"Footwork: Pilates V (필라테스 V 풋워크)","equipment":"리포머","goal":"하체","setup":"누워 발볼을 풋바에 두고 편한 작은 V를 만든다. 6–8회 밀었다 돌아온다.","anatomy":"고관절의 가벼운 외회전 자세에서 무릎과 고관절이 펴진다.","cue":"“발끝과 무릎이 비슷한 방향을 봐요.” 각도를 줄이거나 평행 풋워크로."},{"id":"r10","name":"Footwork: Wide Heels (넓은 뒤꿈치 풋워크)","equipment":"리포머","goal":"하체","setup":"뒤꿈치를 풋바 양쪽에 두고 각도를 몸에 맞춰 편다. 6–8회.","anatomy":"넓은 지지에서 고관절과 무릎이 접히고 펴진다.","cue":"“돌아올 때도 두 발 압력을 느껴요.” 골반이 말리기 전까지 돌아온다."},{"id":"r11","name":"Lower & Lift: Parallel (평행 로어 앤 리프트)","equipment":"리포머","goal":"발목","setup":"발볼을 바에 두고 캐리지를 편안한 뻗은 위치에서 조절하며 뒤꿈치를 함께 낮췄다 든다. 6회.","anatomy":"가자미근·비복근이 발목 움직임을 조절한다.","cue":"“발목에서만 작게 내려가고 올라와요.” 캐리지가 흔들리면 범위를 줄인다."},{"id":"r12","name":"Lower & Lift: Small V (작은 V 로어 앤 리프트)","equipment":"리포머","goal":"발목","setup":"평행 버전이 익숙하면 배운 작은 V 세팅에서 두 발뒤꿈치를 낮췄다 든다. 6회.","anatomy":"고관절 외회전 위치를 유지하면서 발목을 움직인다.","cue":"“발볼이 바에서 흔들리지 않게.” 평행 버전으로 낮춘다."},{"id":"r13","name":"Running (러닝)","equipment":"리포머","goal":"발목·좌우 교대","setup":"누워 발볼을 바에 대고 캐리지를 안정적으로 유지하며 한쪽 뒤꿈치를 낮출 때 반대 무릎을 굽힌다. 좌우 6회.","anatomy":"발목과 무릎이 엇갈려 움직인다.","cue":"“한쪽 내려가면 반대쪽 무릎이 접혀요.” 속도를 낮춘다."},{"id":"r14","name":"Feet in Straps: Frog (스트랩 프로그)","equipment":"리포머","goal":"고관절·하체","setup":"스트랩 착탈에 익숙한 회원이 누워 배운 세팅에서 양 무릎을 굽혔다 발을 함께 밀어낸다. 6회.","anatomy":"고관절과 무릎이 함께 펴진다. 골반이 얼마나 움직이는지 본다.","cue":"“발은 같이, 골반은 편하게.” 스트랩이 낯설면 풋워크로."},{"id":"r15","name":"Feet in Straps: Leg Circles (스트랩 레그 서클)","equipment":"리포머","goal":"고관절","setup":"누워 양발 스트랩을 쓴다. 캐리지를 조절하며 양다리로 작은 원을 그린다. 방향별 4회.","anatomy":"고관절의 굴곡·신전과 벌림·모음이 조합된다.","cue":"“같은 크기로 원을 그려요.” 골반이 움직이면 원을 줄인다."},{"id":"r16","name":"Knee Stretch Round Back (니 스트레치 라운드백)","equipment":"리포머","goal":"몸통·고관절","setup":"리포머에서 무릎과 손을 지지하고 편한 둥근 등 모양을 만든 뒤 캐리지를 작게 밀었다 돌아온다. 5회.","anatomy":"척추 굴곡 자세를 유지하며 고관절이 움직인다.","cue":"“등 모양 그대로, 무릎만 움직여요.” 매트 캣 스트레치로 낮춘다."},{"id":"r17","name":"Long Stretch (롱 스트레치)","equipment":"리포머","goal":"견갑대·전신 지지","setup":"플랭크 진입과 캐리지 통제가 익숙한 경우에만 배운 세팅에서 작은 범위 4–5회.","anatomy":"견갑대와 복벽이 몸통을 지지하는 동안 어깨 각도가 변한다.","cue":"“몸통 길이 그대로, 캐리지는 작게.” 네발기기나 벽 지지로 낮춘다."},{"id":"r18","name":"Supine Arm Press (누워서 스트랩 팔 누르기)","equipment":"리포머","goal":"상체","setup":"누워 발 지지를 확보하고 배운 스트랩 세팅에서 팔을 허벅지 방향으로 내렸다 돌아온다. 6회.","anatomy":"어깨 신전과 몸통 조절이 만난다.","cue":"“손이 허벅지 쪽으로, 돌아올 때 천천히.” 스트랩 없이 가동 범위를 먼저 찾는다."},{"id":"c1","name":"Seated Pedal Press: Heels (앉아서 뒤꿈치 페달 누르기)","equipment":"체어","goal":"하체·발 지지","setup":"앉아 양 뒤꿈치를 페달에 두는 버전을 배운 세팅으로 진행한다. 6–8회.","anatomy":"앉은뼈에 체중을 둔 채 무릎을 펴고 굽힌다.","cue":"“양발 압력을 비슷하게, 돌아올 때 천천히.” 골반이 들썩이면 움직임을 줄인다."},{"id":"c2","name":"Seated Pedal Press: Forefoot (앉아서 발볼 페달 누르기)","equipment":"체어","goal":"하체·발 지지","setup":"페달을 통제해 멈춘 뒤 발 위치를 바꾼다. 양발로 6–8회.","anatomy":"발볼에 지지할 때 종아리가 발목 위치를 조절한다.","cue":"“발가락은 편하게, 발볼로 눌러요.” 불편하면 c1로 돌아간다."},{"id":"c3","name":"Seated Knee Lift (앉아서 한쪽 무릎 들기)","equipment":"체어","goal":"몸통·고관절","setup":"페달을 사용하지 않고 안정된 좌면에 앉는다. 한쪽 발을 작게 들어 좌우 5회.","anatomy":"장요근 등 고관절 굴곡근이 다리를 들고 복벽이 몸통 움직임을 조절한다.","cue":"“양쪽 앉은뼈를 두고 발만 살짝.” 어려우면 뒤꿈치만 들어본다."},{"id":"c4","name":"Cat Spine Standing Front Arm (캣 스파인 스탠딩 프런트 암)","equipment":"체어","goal":"몸통·척추 굴곡","setup":"지도받은 페달 세팅에서 서서 손을 뻗고 척추를 굽혀 페달에 손을 댄다. 배운 범위로 천천히 4–5회.","anatomy":"척추 굴곡과 손을 통한 지지 과제가 함께 있다.","cue":"“손은 앞으로 길게, 등은 천장 쪽으로 넓게.” 페달 통제가 어렵다면 고정 지지면을 이용한다."},{"id":"c5","name":"Slow Swan (슬로우 스완)","equipment":"체어","goal":"척추·상체","setup":"동작을 배운 회원이 엎드린 페달 지지 버전을 센터 세팅에서 4–5회.","anatomy":"척추 신전과 팔 지지가 만난다. 골반과 허리의 움직임을 확인한다.","cue":"“정수리를 멀리 보내고 가슴을 조금 들어요.” 매트 Breast Stroke Prep으로 낮출 수 있다."},{"id":"c6","name":"Rotation Prone (엎드린 회전)","equipment":"체어","goal":"척추·마무리","setup":"기구에서 엎드린 회전 세팅을 배운 회원에게 적용한다. 좌우 3회씩 작게.","anatomy":"흉곽과 골반의 상대적 회전을 본다.","cue":"“가슴 앞이 조금 옆을 봐요.” 익숙하지 않으면 앉은 Spine Twist."},{"id":"c7","name":"Seated Pedal Press: Small V (앉아서 작은 V 페달 누르기)","equipment":"체어","goal":"하체","setup":"배운 양발 세팅에서 작은 V로 페달을 눌렀다 복귀. 6회.","anatomy":"고관절 외회전 위치에서 양쪽 무릎이 움직인다.","cue":"“무릎은 발이 향하는 쪽으로.” 평행 페달 누르기로 바꾼다."},{"id":"c8","name":"Seated Single Leg Pedal Press (앉아서 한 발 페달 누르기)","equipment":"체어","goal":"하체·좌우 비교","setup":"한 발을 안정되게 지지하고 반대 발로 배운 단측 세팅의 페달을 누른다. 좌우 5회.","anatomy":"한쪽 다리의 움직임을 골반 움직임과 구분한다.","cue":"“양쪽 앉은뼈는 그대로.” 페달 복귀가 빠르면 양발로."},{"id":"c9","name":"Standing Leg Pump (서서 레그 펌프)","equipment":"체어","goal":"하체·서기","setup":"배운 위치에서 한 발은 바닥에, 다른 발은 페달에 두고 고정 지지를 잡는다. 좌우 5회.","anatomy":"디딘 다리가 몸통을 지지하고 반대 다리가 페달을 누른다.","cue":"“바닥 발부터 편하게 디뎌요.” 불안하면 앉아서 양발 버전."},{"id":"c10","name":"Standing Calf Raise at Chair (체어 지지 뒤꿈치 들기)","equipment":"체어","goal":"발목","setup":"움직이는 페달과 떨어져 고정 지지를 잡고 양발 뒤꿈치를 들어 6–8회.","anatomy":"종아리 근육이 발바닥굽힘을 만든다.","cue":"“내려오는 속도까지 같게.” 높이를 낮춘다."},{"id":"c11","name":"Seated Spine Twist (체어 앉은 몸통 회전)","equipment":"체어","goal":"척추","setup":"안정된 좌면에 앉아 발을 바닥에 두고 가슴을 좌우로 4회씩 돌린다.","anatomy":"흉곽과 골반 사이 회전을 본다.","cue":"“앉은뼈는 두고 가슴만 옆으로.” 팔은 접어서 가슴 앞에."},{"id":"c12","name":"Step Up Prep (스텝업 준비)","equipment":"체어","goal":"하체·체중 이동","setup":"배운 스텝업 세팅과 손 지지를 쓸 수 있을 때만 한다. 올라가기 전 지지 다리에 체중 싣기를 좌우 4회.","anatomy":"한쪽 고관절과 무릎의 하중 지지에 둔근과 대퇴사두근이 관여한다.","cue":"“앞발에 몸무게를 조금 옮겨요.” 바닥에서 체중이동으로 낮춘다."},{"id":"b1","name":"Supported Hip Hinge (배럴 지지 힙힌지)","equipment":"배럴","goal":"고관절·준비","setup":"고정된 래더를 잡고 양발은 바닥에 둔 채 엉덩이를 뒤로 6회.","anatomy":"척추 모양을 유지하며 고관절을 굽힌다.","cue":"“엉덩이를 뒤로, 정수리는 멀리.” 범위보다 안정된 발 지지를 본다."},{"id":"b2","name":"Standing Hip Extension (래더 지지 고관절 신전)","equipment":"배럴","goal":"고관절·하체","setup":"양손으로 래더를 가볍게 지지하고 한 발을 뒤로 조금 보냈다 돌아온다. 좌우 5–6회.","anatomy":"대둔근이 고관절 신전에 관여한다.","cue":"“발끝이 뒤쪽으로 멀어져요.” 허리가 꺾이면 발끝을 바닥에 둔 채 뒤로 민다."},{"id":"b3","name":"Standing Side Reach (서서 옆구리 뻗기)","equipment":"배럴","goal":"척추·측굴","setup":"배럴 옆에 두 발로 서서 안전한 고정 지지를 두고 옆구리를 좌우 3회씩 길게 쓴다.","anatomy":"흉곽이 골반에 대해 측굴한다.","cue":"“두 발로 서서 옆구리만 길게.” 어깨가 불편하면 반대 손을 골반에 둔다."},{"id":"b4","name":"Standing Hip Abduction (래더 지지 고관절 벌림)","equipment":"배럴","goal":"하체·골반 지지","setup":"래더를 잡고 한 발을 옆으로 작게 보낸다. 좌우 5–6회.","anatomy":"움직이는 다리의 벌림과 디딘 쪽 골반 지지에 중둔근이 관여한다.","cue":"“발끝은 앞, 발만 옆으로 조금.” 한쪽으로 크게 기울면 발끝을 바닥에 댄다."},{"id":"b5","name":"Round Back Prep (라운드 백 준비)","equipment":"배럴","goal":"척추·굴곡","setup":"배럴에 올라가야 하는 버전은 승하차와 고정법을 배운 경우에 사용한다. 입문은 매트에 앉아 작은 뒤로 굴리기 5회.","anatomy":"복벽과 척추 굴곡, 골반의 뒤 기울임이 만난다.","cue":"“앉은뼈 뒤쪽으로 조금 갔다 와요.” 기구 탑승이 익숙하지 않으면 매트 버전을 사용한다."},{"id":"b6","name":"Side Bend Prep (배럴 사이드 벤드 준비)","equipment":"배럴","goal":"척추·옆 지지","setup":"배운 발 고정과 몸통 지지로 옆구리를 배럴에 댄다. 좌우 4회. 입문은 b3.","anatomy":"흉곽과 골반 사이 움직임을 조절하고 옆으로 지지한다.","cue":"“아래 옆구리도 길게 두고 작게.” 고정이 불확실하면 b3로 돌아간다."},{"id":"b7","name":"Supported Calf Raise (래더 지지 뒤꿈치 들기)","equipment":"배럴","goal":"발목","setup":"래더를 잡고 바닥에서 양발 뒤꿈치를 들었다 내린다. 6–8회.","anatomy":"발바닥굽힘과 발볼 지지 연습.","cue":"“발볼을 넓게 딛고 올라와요.” 낮은 높이로 조절."},{"id":"b8","name":"Supported Mini Squat (래더 지지 미니 스쿼트)","equipment":"배럴","goal":"하체","setup":"래더를 잡고 양발 지지에서 엉덩이를 조금 내렸다 일어난다. 6회.","anatomy":"고관절과 무릎이 함께 접히고 펴진다.","cue":"“편하게 접고 발 전체로 눌러 올라와요.” 깊이를 줄인다."},{"id":"b9","name":"Supported Split-Stance Shift (래더 지지 앞뒤 체중 이동)","equipment":"배럴","goal":"하체·균형","setup":"래더를 잡고 발을 앞뒤로 놓는다. 체중을 앞발 쪽으로 옮겼다 가운데로. 좌우 5회.","anatomy":"두 발 지지 안에서 체중을 옮기며 고관절·무릎·발목을 함께 쓴다.","cue":"“앞발이 무게를 받아요.” 보폭을 줄인다."},{"id":"b10","name":"Prone Extension Prep (배럴 엎드린 신전 준비)","equipment":"배럴","goal":"척추·상체","setup":"배럴에 엎드린 지지와 승하차를 배운 경우에 시행. 골반과 발 지지를 확보하고 가슴을 살짝 든다. 4–5회.","anatomy":"등을 펴는 동안 몸통이 배럴 위에서 지지된다.","cue":"“가슴부터 멀리, 높이는 조금만.” 매트 Breast Stroke Prep으로."},{"id":"b11","name":"Supported Thoracic Rotation (서서 지지 흉곽 회전)","equipment":"배럴","goal":"척추","setup":"래더 옆에 서서 한 손을 고정 지지에 두고 반대 손을 가슴 앞에 둔다. 좌우 4회.","anatomy":"골반 위에서 흉곽을 돌리는 과제.","cue":"“골반은 앞, 가슴은 조금 옆.” 앉은 Spine Twist로."},{"id":"p1","name":"Magic Circle Press (서클 손바닥 누르기)","equipment":"소도구","goal":"소도구·상체","setup":"앉아 서클을 가슴보다 낮게 잡고 약하게 눌렀다 놓는다. 6회.","anatomy":"가슴 근육과 팔이 누르는 힘을 만들고 견갑대가 위치를 조절한다.","cue":"“손바닥으로 살짝만.” 어깨가 불편하면 도구를 빼고 낮은 리치."},{"id":"p2","name":"Mini Ball Pelvic Feedback (미니볼로 골반 위치 느끼기)","equipment":"소도구","goal":"소도구·감각","setup":"누워 무릎을 세우고 미니볼을 양손에 잡아 골반 앞 위에서 기준점으로 쓴다. 번갈아 Heel Slide 5회.","anatomy":"다리 움직임과 골반 회전을 구분한다.","cue":"“볼은 골반 위에 두고 발만 조금 멀리.”"},{"id":"p3","name":"Band Row (밴드 로우)","equipment":"소도구","goal":"소도구·상체","setup":"센터에서 확인한 고정점에 밴드를 연결해 안정적으로 앉거나 선다. 팔꿈치를 뒤로 6–8회.","anatomy":"어깨 신전과 팔꿈치 굴곡이 함께 일어난다.","cue":"“팔꿈치 뒤로, 몸은 제자리.” 고정점이 없으면 무저항 팔 당기기로 바꾼다."},{"id":"p4","name":"Foam Roller Reach (폼롤러 손 뻗기)","equipment":"소도구","goal":"소도구·척추와 팔","setup":"안정된 테이블에 폼롤러를 두고 양손을 얹어 팔 높이를 편하게 조정한다. 롤러를 앞뒤로 작게 5회.","anatomy":"팔을 뻗는 동안 견갑골과 흉곽의 움직임을 관찰한다.","cue":"“롤러만 아니라 손끝도 천천히 멀어져요.” 지지가 불편하면 앉은 리치."},{"id":"p5","name":"Mini Ball Adductor Squeeze (미니볼 가볍게 누르기)","equipment":"소도구","goal":"소도구·하체","setup":"누워 무릎 세우고 무릎 사이 볼을 가볍게 눌렀다 푼다. 6회.","anatomy":"고관절 모음근을 쓰는 과제다.","cue":"“숨 내쉬면서 살짝.” 허리나 무릎에 힘이 몰리면 압력을 줄인다."},{"id":"p6","name":"Band Side Step Prep (밴드 옆걸음 준비)","equipment":"소도구","goal":"소도구·골반 지지","setup":"발 위치와 균형이 안정적이면 가벼운 밴드를 허벅지에 두고 옆으로 작은 걸음. 양쪽 4걸음.","anatomy":"고관절 벌림과 한쪽 지지를 교대로 쓴다.","cue":"“골반 높이는 비슷하게.” 밴드 없이 먼저 연습한다."},{"id":"p7","name":"Mini Ball Bridge (미니볼 브리지)","equipment":"소도구","goal":"미니볼·하체","setup":"무릎 사이에 부드러운 볼을 끼우고 가벼운 접촉을 유지하며 낮은 브리지 6회.","anatomy":"고관절을 펴는 동안 무릎 간격의 감각을 더한다.","cue":"“공 모양은 그대로, 골반만 올라와요.” 불편하면 볼 없이."},{"id":"p8","name":"Mini Ball Hand Press (미니볼 손바닥 압력)","equipment":"소도구","goal":"미니볼·호흡","setup":"누워 발을 딛고 볼을 가슴 위에서 편한 높이로 잡는다. 내쉬며 살짝 누르기 5회.","anatomy":"팔의 작은 압력과 내쉬는 호흡을 맞춘다.","cue":"“공을 살짝 눌렀다 놓아요.” 팔꿈치를 굽히거나 도구 없이."},{"id":"p9","name":"Mini Ball Seated Reach (미니볼 앉은 리치)","equipment":"소도구","goal":"미니볼·상체","setup":"앉아 볼을 양손에 들고 가슴보다 낮게 앞으로 뻗었다 돌아온다. 6회.","anatomy":"양팔 움직임의 방향과 속도를 맞춘다.","cue":"“공이 앞으로, 몸통은 위로.” 볼이 부담되면 맨손."},{"id":"p10","name":"Circle Adductor Press (서클 허벅지 안쪽 누르기)","equipment":"소도구","goal":"매직서클·하체","setup":"누워 무릎을 세우고 서클 패드를 무릎 바로 위 허벅지 안쪽에 댄다. 작게 6회.","anatomy":"고관절 모음근에 저항을 더한다.","cue":"“힘은 조금만, 돌아올 때도 천천히.” 미니볼로 바꿀 수 있다."},{"id":"p11","name":"Circle Arm Reach (서클 팔 뻗기)","equipment":"소도구","goal":"매직서클·상체","setup":"앉아 서클을 두 손에 가볍게 들고 압력을 줄인 채 낮은 높이에서 팔을 뻗는다. 5회.","anatomy":"양팔이 같은 방향으로 움직일 수 있도록 기준을 준다.","cue":"“링은 편하게 잡고 손을 멀리.” 무도구 앉은 리치로."},{"id":"p12","name":"Circle Seated Rotation (서클 앉은 회전)","equipment":"소도구","goal":"매직서클·회전","setup":"앉아서 서클을 가슴 가까이 들고 가슴과 손을 함께 좌우로 4회씩 돌린다.","anatomy":"팔보다 흉곽이 움직임을 이끌도록 한다.","cue":"“링과 가슴이 같이 옆을 봐요.” 서클 없이 손을 가슴에."},{"id":"p13","name":"Band External Rotation (밴드 어깨 외회전)","equipment":"소도구","goal":"밴드·상체","setup":"앉거나 서서 팔꿈치를 옆구리 가까이 접고 양손에 밴드를 잡는다. 작게 벌렸다 돌아와 6회.","anatomy":"극하근과 소원근이 어깨 외회전에 관여한다.","cue":"“팔꿈치 자리는 그대로, 손만 살짝 벌려요.” 무저항으로."},{"id":"p14","name":"Band Pull Apart Prep (밴드 가볍게 벌리기)","equipment":"소도구","goal":"밴드·상체","setup":"가슴보다 낮게 양손으로 밴드를 잡고 편한 폭에서 조금 벌렸다 돌아온다. 6회.","anatomy":"어깨 수평 벌림과 견갑골 움직임을 함께 관찰한다.","cue":"“가슴은 편하게, 손만 옆으로 조금.” 밴드를 느슨하게."},{"id":"p15","name":"Loop Band Bridge (루프밴드 브리지)","equipment":"소도구","goal":"밴드·고관절","setup":"가벼운 루프밴드를 무릎 위에 두고 발을 딛는다. 무릎 간격을 유지하며 낮은 브리지 6회.","anatomy":"고관절 신전과 벌림 방향의 저항 조절을 함께 연습한다.","cue":"“무릎 간격 그대로 올라와요.” 밴드 없이 브리지 먼저."},{"id":"p16","name":"Loop Band Clam (루프밴드 클램)","equipment":"소도구","goal":"밴드·고관절","setup":"옆으로 누워 무릎 위에 가벼운 루프를 둔다. 발을 맞댄 채 위 무릎을 작게 연다. 좌우 6회.","anatomy":"고관절 외회전 과제에 저항을 더한다.","cue":"“골반이 굴러가기 전까지만.” 맨몸 클램으로."},{"id":"p17","name":"Roller Seated Hip Hinge (폼롤러 앉은 힙힌지)","equipment":"소도구","goal":"폼롤러·고관절","setup":"안정된 의자에 앉아 가슴 앞에서 롤러를 가볍게 든다. 등을 길게 두고 고관절을 작게 접었다 돌아온다. 5회.","anatomy":"척추 모양과 고관절 굴곡을 구분한다.","cue":"“양발은 딛고 몸통 전체를 살짝 앞으로.” 롤러를 빼도 된다."},{"id":"p18","name":"Roller Forearm Slide (폼롤러 벽 전완 슬라이드)","equipment":"소도구","goal":"폼롤러·견갑대","setup":"벽과 양쪽 아래팔 사이에 롤러를 두고 떨어지지 않을 정도로 가볍게 눌러 편한 높이까지만 올린다. 5회.","anatomy":"팔이 올라갈 때 견갑골이 흉곽 위를 따라간다.","cue":"“힘은 작게, 편한 높이까지만.” 도구 없이 낮은 벽 리치."},{"id":"p19","name":"Towel Heel Slide (타월 발뒤꿈치 밀기)","equipment":"소도구","goal":"타월·몸통","setup":"누워 한쪽 뒤꿈치 아래에 얇은 타월을 두고 천천히 밀었다 돌아온다. 좌우 5회.","anatomy":"마찰을 줄여 골반과 다리 움직임을 구분한다.","cue":"“타월만 먼 쪽으로 보내요.” 발을 들지 않는다."},{"id":"p20","name":"Towel Seated Reach (타월 앉은 리치)","equipment":"소도구","goal":"타월·상체","setup":"앉아 타월 양끝을 잡고 가슴 아래 높이로 조금 앞으로 뻗는다. 6회.","anatomy":"두 손의 거리와 팔 움직임 방향을 느끼는 과제다.","cue":"“타월을 살짝 팽팽하게, 손은 앞으로.” 당기는 힘을 줄인다."},{"id":"m1","name":"Shoulder Bridge Prep (매트 숄더 브리지 준비)","equipment":"매트","goal":"고관절 신전","setup":"무릎 세워 누워 양발로 바닥을 누르고 골반을 낮게 들었다 내려온다. 6회.","anatomy":"대둔근·햄스트링이 고관절 신전에 관여한다.","cue":"“높이보다 양발 압력을 느껴요.” 쥐가 나면 내려와 범위를 줄인다."},{"id":"m2","name":"Side-Lying Hip Abduction (옆으로 누운 고관절 벌림)","equipment":"매트","goal":"고관절 벌림","setup":"아래 다리는 굽히고 윗다리는 몸통 선 가까이에 길게 둔다. 좌우 5–6회.","anatomy":"중둔근과 대퇴근막장근 등이 벌림에 기여한다.","cue":"“발뒤꿈치를 멀리, 높이는 낮게.” 골반이 따라가면 높이를 낮춘다."},{"id":"m3","name":"Clam (클램)","equipment":"매트","goal":"고관절 외회전","setup":"옆으로 누워 무릎을 굽히고 두 발을 맞댄다. 위 무릎을 작게 열었다 닫는다. 좌우 6회.","anatomy":"고관절 외회전이 중심이며 골반이 뒤로 돌아가는지 본다.","cue":"“위쪽 골반은 앞을 보고, 무릎만 열어요.” 골반이 돌아가기 전까지만."},{"id":"m4","name":"Quadruped Leg Slide (네발기기 발끝 밀기)","equipment":"매트","goal":"고관절 신전·몸통","setup":"손과 무릎으로 지지하고 한 발끝을 바닥에 붙여 뒤로 밀었다 돌아온다. 좌우 5회.","anatomy":"고관절 신전과 몸통 지지를 함께 연습한다.","cue":"“발끝만 뒤로 길게.” 손 지지가 어렵다면 래더 지지로."},{"id":"m5","name":"Heel Slide (발뒤꿈치 밀기)","equipment":"매트","goal":"몸통·고관절","setup":"무릎 세워 누워 한쪽 뒤꿈치를 바닥에 댄 채 앞으로 밀었다 끌어온다. 좌우 5회.","anatomy":"다리 움직임과 골반이 돌아가는 움직임을 구분한다.","cue":"“골반은 편하게 두고 발만 멀리.” 거리를 줄인다."},{"id":"m6","name":"Wall Press Plus (벽 밀며 견갑골 내밀기)","equipment":"매트","goal":"상체·지지","setup":"벽에 두 손을 대고 팔 길이를 유지하며 몸통을 벽에서 조금 멀리 민다. 6회.","anatomy":"전거근이 견갑골 내밈을 돕는다.","cue":"“팔은 길게, 등 위쪽은 넓게.” 통증이 있으면 멈춘다."},{"id":"m7","name":"Side-Lying Open Book (옆으로 누운 오픈북)","equipment":"매트","goal":"흉곽 회전","setup":"옆으로 누워 무릎을 포개고 윗손을 몸 앞으로 뻗었다 가슴을 따라 뒤쪽으로 연다. 좌우 4회.","anatomy":"흉곽이 골반에 대해 회전한다.","cue":"“팔은 가슴을 따라, 높이는 편하게.” 손을 갈비뼈에 두고 회전할 수 있다."},{"id":"m8","name":"Quadruped Rock Back (네발기기 뒤로 이동)","equipment":"매트","goal":"고관절 굴곡","setup":"네발기기에서 척추 모양을 유지하고 엉덩이를 뒤로 이동했다 돌아온다. 6회.","anatomy":"고관절을 접는 동안 몸통 모양을 유지한다.","cue":"“등 길이 그대로 엉덩이만 뒤로.” 손 지지가 불편하면 서서 힙힌지."},{"id":"m9","name":"Pelvic Tilt (골반 기울이기)","equipment":"매트","goal":"준비·골반","setup":"무릎을 세우고 누워 골반을 앞뒤로 작게 굴려 5회.","anatomy":"골반과 허리 곡선의 관계를 느낀다.","cue":"“허리가 바닥에서 살짝 멀어졌다 가까워져요.” 힘을 줄이고 가운데로 돌아온다."},{"id":"m10","name":"Supine March (누워서 한 발 들기)","equipment":"매트","goal":"몸통·고관절","setup":"누워 양발을 딛고 한 발씩 잠깐 들었다 내린다. 좌우 5회.","anatomy":"고관절 굴곡근이 다리를 들고 몸통은 골반 움직임을 조절한다.","cue":"“발만 가볍게 떼요.” 골반이 돌아가면 Heel Slide로."},{"id":"m11","name":"Toe Tap Prep (토 탭 준비)","equipment":"매트","goal":"몸통·고관절","setup":"한쪽 무릎을 들어 편한 각도에 두고 발끝을 바닥 쪽으로 보냈다 돌아온다. 좌우 5회.","anatomy":"고관절 각도가 바뀌는 동안 갈비뼈와 골반 위치를 관찰한다.","cue":"“발끝만 내려놓듯.” 반대 발은 바닥에 둔다."},{"id":"m12","name":"Chest Lift Prep (체스트 리프트 준비)","equipment":"매트","goal":"복부·척추 굴곡","setup":"누워 무릎을 세우고 양손으로 머리를 받친다. 내쉬며 머리와 가슴을 작게 들었다 내린다. 5회.","anatomy":"복직근과 복사근이 몸통 굴곡에 관여한다.","cue":"“고개는 손에 맡기고 가슴만 살짝.” 목이 부담되면 머리를 내려놓고 호흡."},{"id":"m13","name":"Single Leg Stretch Prep (싱글 레그 스트레치 준비)","equipment":"매트","goal":"복부·다리 교대","setup":"누워 머리를 내려놓고 한쪽 다리를 당기는 동안 반대쪽 뒤꿈치를 멀리 민다. 좌우 5회.","anatomy":"다리 길이와 위치가 바뀔 때 몸통을 조절한다.","cue":"“한쪽은 가까이, 반대 발은 멀리.” 한 다리씩 따로 한다."},{"id":"m14","name":"Hundred Prep (헌드레드 준비)","equipment":"매트","goal":"호흡·몸통","setup":"두 발을 디디고 누워 팔을 옆구리 가까이 길게 뻗어 작게 펌핑한다. 5번 마시고 5번 내쉬기 3세트부터.","anatomy":"호흡과 팔 움직임을 함께 유지한다.","cue":"“팔은 작게, 숨은 이어가요.” 머리는 바닥에 둔다."},{"id":"m15","name":"Breast Stroke Prep (브레스트 스트로크 준비)","equipment":"매트","goal":"척추 신전","setup":"엎드려 배운 팔 위치에서 시선을 낮추고 가슴 윗부분을 살짝 들었다 내려온다. 5회.","anatomy":"척추 신전근이 관여하며 목·허리의 움직임 분배를 본다.","cue":"“정수리 앞으로, 가슴은 조금만.” 이마를 받치고 길이만 만든다."},{"id":"m16","name":"Swimming Prep (스위밍 준비)","equipment":"매트","goal":"교차 지지·몸통","setup":"엎드려 한쪽 다리를 길게 뻗는다. 익숙하면 반대 팔도 함께 뻗는다. 좌우 5회.","anatomy":"고관절 신전과 교차 움직임에서 몸통을 유지한다.","cue":"“손끝과 발끝이 멀어져요.” 팔은 바닥에 두고 다리만."},{"id":"m17","name":"Cat Stretch (캣 스트레치)","equipment":"매트","goal":"척추 굴곡","setup":"네발기기에서 내쉬며 등을 둥글게 말고 마시며 편한 중립으로 돌아온다. 5회.","anatomy":"척추가 굽혀졌다 펴진다.","cue":"“손바닥으로 밀고 등을 넓혀요.” 손 지지가 어렵다면 앉아서."},{"id":"m18","name":"Bird Dog Prep (버드독 준비)","equipment":"매트","goal":"몸통·교차 지지","setup":"네발기기에서 한 손이나 한 발을 바닥 위로 멀리 밀었다 돌아온다. 좌우 5회.","anatomy":"지지점이 바뀔 때 몸통 회전을 조절한다.","cue":"“배꼽 방향은 그대로.” 한 번에 한 팔다리만."},{"id":"m19","name":"Spine Stretch Forward (스파인 스트레치 포워드)","equipment":"매트","goal":"척추 굴곡","setup":"다리를 편하게 두고 앉아 허리를 세운 뒤 내쉬며 등을 둥글게 해 앞으로 뻗는다. 5회.","anatomy":"고관절을 깊게 접는 대신 척추 굴곡을 관찰하는 버전이다.","cue":"“공 위를 넘어가듯 앞으로.” 무릎을 굽혀 앉기 쉽게."},{"id":"m20","name":"Spine Twist (스파인 트위스트)","equipment":"매트","goal":"척추 회전","setup":"양쪽 앉은뼈를 두고 가슴을 좌우로 돌린다. 각 4회.","anatomy":"흉곽이 골반에 대해 회전한다.","cue":"“팔이랑 가슴이 같이 돌아요.” 팔을 가슴에 가볍게 포갠다."},{"id":"m21","name":"Mermaid (머메이드)","equipment":"매트","goal":"척추 측굴","setup":"편하게 옆으로 앉거나 다리를 교차하고 옆으로 기울였다 돌아온다. 좌우 3회.","anatomy":"옆구리의 길이와 압력 변화가 나타난다.","cue":"“위쪽 옆구리로 숨을 마셔봐요.” 위팔은 높이 들지 않아도 된다."},{"id":"m22","name":"Side Kick Front & Back Prep (사이드 킥 앞뒤 준비)","equipment":"매트","goal":"고관절 조절","setup":"옆으로 누워 위 다리를 낮게 뻗고 허벅지를 작게 앞뒤로 움직인다. 좌우 5회.","anatomy":"고관절 굴곡·신전 범위와 골반 회전을 구분한다.","cue":"“다리는 앞뒤로, 위쪽 골반은 제자리에.” 발끝을 바닥에 댄다."},{"id":"m23","name":"Side Support Prep (옆 지지 준비)","equipment":"매트","goal":"몸통·견갑대","setup":"옆으로 누워 아래 팔꿈치와 굽힌 무릎으로 지지하고 골반을 살짝 들었다 내린다. 좌우 4회.","anatomy":"몸통 옆면과 견갑대가 지지를 유지한다.","cue":"“아래 팔로 바닥을 밀어요.” 어렵다면 골반을 바닥에 두고 옆구리 길이만."},{"id":"m24","name":"Standing Roll Down Prep (스탠딩 롤다운 준비)","equipment":"매트","goal":"척추·마무리","setup":"두 발을 안정적으로 딛고 무릎은 부드럽게, 머리와 등 윗부분만 천천히 말았다 편다. 3회.","anatomy":"척추 굴곡을 서서 조절한다.","cue":"“작게 말고, 발바닥 그대로.” 서기 불편하면 앉아서."},{"id":"t1","name":"Roll Down Bar (롤다운 바)","equipment":"캐딜락","goal":"척추 굴곡·몸통","setup":"앉은 자세에서 배운 롤다운 바 세팅을 확인하고 몸통을 작은 범위로 뒤로 기울였다 돌아온다.","anatomy":"복벽과 고관절 주변 근육이 몸통 위치를 조절한다.","cue":"“앉은뼈에서 살짝 뒤로, 돌아올 때 길게.” 무저항 앉은 롤백으로 낮춘다."},{"id":"t2","name":"Arm Spring Press (팔 스프링 누르기)","equipment":"캐딜락","goal":"견갑대·어깨 신전","setup":"누워 발을 안정되게 두고 배운 팔 스프링 세팅에서 손을 허벅지 쪽으로 내렸다 돌아온다.","anatomy":"광배근 등 어깨 신전근과 견갑대가 협력한다.","cue":"“손이 허벅지 쪽으로 길어져요.” 저항 없는 팔 움직임으로 변경."},{"id":"t3","name":"Leg Spring Frog (레그 스프링 프로그)","equipment":"캐딜락","goal":"고관절·무릎","setup":"레그 스프링을 배운 경우, 몸통을 편안하게 지지하고 양다리를 굽혔다 편다.","anatomy":"고관절과 무릎 신전 및 골반 조절.","cue":"“양발이 같은 속도로 돌아와요.” 다리 지지 없이 하면 매트 Heel Slide로 변경."},{"id":"t4","name":"Leg Circles (레그 서클)","equipment":"캐딜락","goal":"고관절 가동성","setup":"누운 레그 스프링 세팅을 배운 회원이 작은 원을 그린다.","anatomy":"고관절 각도가 여러 방향으로 바뀌고 골반 움직임을 조절한다.","cue":"“골반은 편하게, 원은 작게.” 스트랩 없이 발을 지지해 연습."},{"id":"t5","name":"Seated Thoracic Rotation (앉은 흉곽 회전)","equipment":"캐딜락","goal":"척추 회전","setup":"스프링 없이 안정된 매트 위에 앉아 양손을 가슴에 놓고 작게 좌우 회전.","anatomy":"흉곽과 골반의 상대적인 회전.","cue":"“가슴이 옆을 봐요.” 편한 범위만."}];const levels=['초급','중급','고급'];let topic=0,level=0;const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const by=id=>cards.find(c=>c.id===id);
function plan(t,l){return topics[t][l+1].split(' ').map(by)}
function equipment(c){return [...new Set(c.map(x=>x.equipment))].join(' + ')}
function time(n,i){return Math.floor(50/n)+(i<50%n?1:0)}
function draw(){ $('#topics').innerHTML=topics.map((t,i)=>'<button data-topic="'+i+'" class="'+(i===topic?'active':'')+'">'+e(t[0])+'</button>').join('');$('#levels').innerHTML=levels.map((l,i)=>'<button data-level="'+i+'" class="'+(i===level?'active':'')+'">'+l+'</button>').join('');$('#list').innerHTML=levels.map((l,i)=>{const c=plan(topic,i);return '<div class="card"><span class="tag">'+l+'</span><h3>'+e(topics[topic][0])+'</h3><p>'+e(equipment(c))+'</p><p class="muted">'+c.length+'개 동작 · 50분</p><button data-level="'+i+'">수업 보기</button></div>'}).join('');let c=plan(topic,level),elapsed=0,prior='',rows='';c.forEach((x,i)=>{let group=x.equipment==='소도구'?'매트':x.equipment;let end=elapsed+time(c.length,i);if(group!==prior){rows+='<tr><th colspan="3">'+e(group)+(prior?' · 기구 전환':' · 시작')+'</th></tr>';prior=group}rows+='<tr><td>'+elapsed+'–'+end+'분</td><td><b>'+e(x.name)+'</b><br><span class="muted">'+e(x.equipment)+' · '+e(x.goal)+'</span></td><td>'+e(x.setup)+'<details><summary>목적 · 큐잉</summary><p>'+e(x.anatomy)+'</p><p>'+e(x.cue)+'</p></details></td></tr>';elapsed=end});$('#detail').innerHTML='<article><div class="tag">'+levels[level]+' · 50분 · '+e(equipment(c))+'</div><h2>'+e(topics[topic][0])+'</h2><p><b>흐름</b>　'+e(topics[topic][4])+'</p><p class="muted">예시 시간은 안내, 양쪽 수행, 전환과 휴식 포함. 고급은 기구와 동작에 익숙한 회원 대상이며 배운 모델별 세팅을 적용해요. 통증이 발생하면 해당 동작을 중단하세요.</p><div class="tablewrap"><table><thead><tr><th>시간</th><th>동작</th><th>수행</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="notes"><h3>직접 해본 뒤</h3><textarea id="notes" placeholder="좋았던 동작, 빼고 싶은 동작, 연결이 어색했던 부분"></textarea><button id="save">메모 저장</button> <span id="status"></span></div><button onclick="window.print()">인쇄</button></article>';try{$('#notes').value=localStorage.getItem('seq50-'+topic+'-'+level)||''}catch{}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.topic!==undefined){topic=+b.dataset.topic;draw()}if(b.dataset.level!==undefined){level=+b.dataset.level;draw()}if(b.id==='save'){try{localStorage.setItem('seq50-'+topic+'-'+level,$('#notes').value);$('#status').textContent='저장 완료'}catch{$('#status').textContent='저장 실패'}}});draw();
</script></html>
