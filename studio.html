tems:center}.card details{margin:10px 0}.card summary{cursor:pointer;color:var(--green)}.item{border-top:1px solid var(--line);padding:13px 0}.item h3{font-size:16px}.item input[type=number]{width:84px;padding:5px}.item input.note{width:100%;margin-top:8px}.stack{position:sticky;top:80px}.total{font-size:24px;font-weight:700;color:var(--green)}label{display:block;font-size:13px;font-weight:650;margin:10px 0 4px}.rowform{display:flex;flex-wrap:wrap;gap:10px}.rowform label{flex:1}.rowform input,.rowform select{width:100%}.case{border-left:4px solid #508473;padding-left:14px}.hidden,[hidden]{display:none!important}#status{min-height:22px;font-size:13px;color:var(--green)}dl{display:grid;grid-template-columns:155px 1fr;gap:8px;margin:12px 0}dt{font-weight:700;color:var(--green)}dd{margin:0}.steps{font-size:16px}.steps li{margin:9px 0}.card .mini{font-size:14px}.timer{font-size:42px;text-align:center;font-variant-numeric:tabular-nums}.teach-box{max-width:740px;margin:auto}.source{font-size:13px;color:var(--muted)}@media(max-width:800px){main{padding:18px 12px 55px}.workspace{grid-template-columns:1fr}.stack{position:static}.hero{padding:20px}header{padding:14px}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:8px}}@media print{nav,header,.no-print,#status,.filters{display:none!important}body{background:white}.panel,.card{break-inside:avoid}.workspace{display:block}.workspace>div:first-child{display:none}}

const practiceCases=[["매트 · 첫 수업 전신","매트","초급",["m9","m5","m10","m1","m3","m2","m8","m17","m20","m21"],[4,4,4,5,5,5,4,4,5,5],"누워 골반과 다리를 구분 → 양발 지지 → 옆으로 누워 한쪽 다리 → 네발기기 → 앉아 마무리. 처음에는 순서와 자세 전환만 익힌다."],["매트 · 복부와 골반 조절","매트","초급",["m9","m5","m10","m11","m14","m1","m8","m18","m19"],[4,4,4,5,4,5,5,5,4],"누워 다리 한쪽씩 움직이다 호흡과 몸통 지지 요구를 늘리고, 네발기기에서 교차 지지로 연결."],["매트 · 엉덩이와 옆구리","매트","초급",["m9","m1","m3","m2","m22","m4","m8","m21"],[4,6,5,5,5,5,5,5],"양발 신전 → 옆누운 외회전·벌림·앞뒤 움직임 → 네발기기 신전 → 측굴. 골반 움직임을 비교한다."],["매트 · 흉곽과 견갑대","매트","초급",["m7","m15","m16","m8","m17","m6","m20","m21"],[5,5,5,5,4,5,5,6],"옆누운 회전 → 엎드린 신전 → 손 지지 → 벽 지지 → 앉은 회전과 측굴. 통증 없는 범위에서 진행."],["리포머 · 첫 만남 전신","리포머","초급",["r1","r2","r11","r3","r18","r4","r7"],[7,6,5,6,6,8,7],"누운 풋바 시리즈 → 몸통 → 누운 팔 → 앉은 팔과 마무리. 장비 전환마다 캐리지 정지 확인."],["리포머 · 하체와 발목","리포머","초급",["r1","r2","r9","r10","r11","r13","r14","r15","r7"],[5,5,4,4,5,5,6,6,5],"풋워크 발 위치를 바꿔 비교한 뒤 발목 움직임, 익숙한 경우 스트랩 고관절 동작, 앉은 마무리."],["리포머 · 몸통과 손 지지","리포머","중급",["r1","r3","r18","r4","r5","r6","r16","r8","r7"],[5,5,5,5,5,5,5,5,5],"누운 지지 → 앉은 지지 → 무릎 지지에서 척추 모양 비교 → 서기 → 마무리. 기구에 익숙한 사람 대상."],["체어 · 앉은 자세 전신","체어","초급",["c1","c2","c7","c3","c11","p9","c10","m21"],[6,6,5,5,6,5,6,6],"앉은 페달 → 몸통과 팔 → 고정 지지 서기 → 옆구리. 페달을 통제할 수 있는 범위."],["체어 · 하체 지지와 균형","체어","중급",["c1","c2","c8","c3","c9","c10","c12","c11"],[5,5,5,5,6,5,7,7],"양발 페달에서 한발 과제로 진행한 뒤 바닥 지지와 체중이동을 연습. 탑승·페달 통제 조건 확인."],["체어 · 척추와 견갑대","체어","중급",["c11","p9","c4","c5","c6","m21"],[6,6,7,10,8,8],"앉은 회전 → 팔 뻗기 → 서서 굴곡 → 엎드린 신전과 회전 → 앉아 마무리. 페달 동작은 배운 세팅 적용."],["배럴 · 고관절과 하체","배럴","초급",["b1","b8","b9","b2","b4","b7","b11","b3"],[5,6,5,6,6,5,5,7],"래더 지지 힙힌지 → 양발에서 체중이동 → 한쪽 다리 → 발목 → 흉곽 움직임."],["배럴 · 척추 가동성","배럴","중급",["b1","b11","b5","b6","b10","b3"],[6,6,8,8,9,8],"바닥에서 고관절과 회전 준비 → 배럴에서 굴곡·측굴·신전 → 서서 마무리. 승하차를 익힌 회원에게만."],["캐딜락 · 몸통과 팔다리","캐딜락","초급",["t5","t1","t2","t3","t4","m9","m21"],[5,7,6,7,7,6,7],"앉아 회전과 롤다운 준비 → 누워 팔과 다리 스프링 → 골반 움직임 → 앉아 마무리. 스프링 착탈과 바 안전 교육을 받은 경우."],["미니볼 · 몸통과 하체","소도구","초급",["p2","p5","p7","m10","m3","m2","p9","m21"],[5,5,6,5,5,5,5,4],"누워 볼로 위치 감각 → 압력과 브리지 → 옆으로 누워 다리 → 앉아 팔과 마무리."],["밴드 · 고관절과 상체","소도구","초급",["m9","p15","p16","m2","p6","p3","p13","m21"],[4,6,5,5,5,6,5,4],"맨몸 골반 준비 → 누워 밴드 → 옆누운 다리 → 서기 → 팔 저항 → 측굴."],["매직서클 · 전신","소도구","초급",["m9","p10","m1","m3","p11","p12","p1","m21"],[4,5,6,5,5,5,5,5],"누워 골반과 모음 저항 → 고관절 신전 → 옆누운 다리 → 앉은 팔과 회전."],["폼롤러 · 흉곽과 움직임 준비","소도구","초급",["m7","p17","p4","p18","m20","m21"],[5,5,5,5,5,5],"흉곽 회전 → 고관절 접기 → 손뻗기 → 벽 지지 → 앉은 마무리. 롤러가 불편하면 맨몸 버전."],["발·발목 · 15분 준비 루틴","매트","초급",["b7","b9","b8","b1"],[4,4,4,3],"고정 지지에서 발볼 지지와 뒤꿈치 들기 → 체중 이동 → 무릎 굽힘 → 힙힌지. 바닥 루틴이며 배럴 대신 안정된 지지물을 사용."],["매트 · 25분 기본 리허설","매트","초급",["m9","m1","m3","m2","m17","m18","m20","m21"],[3,4,3,3,3,3,3,3],"짧은 수업에서 자세 전환과 좌우 반복을 연습한다."],["리포머 · 25분 풋워크 연결","리포머","초급",["r1","r2","r11","r3","r18","r7"],[4,4,4,4,5,4],"같은 누운 자세에서 발 위치와 저항 과제를 연결한 뒤 팔과 앉은 마무리."]];
const templates=[
{name:'리포머 · 초급 전신',ids:['r1','r2','r11','r3','r18','r14','r4','r6','r7'],mins:[5,5,4,6,5,6,5,5,4]},

{name:'매트 · 견갑대와 흉곽',ids:['m20','m7','p9','m15','m16','m6','m17','m21'],mins:[5,5,5,6,5,6,6,7]},
{name:'발·하체 · 리포머',ids:['r1','r2','r9','r11','r13','r14','r15','r7'],mins:[6,5,5,5,5,7,7,5]}
];
const cases=[
{title:'숄더 브리지에서 허리만 꺾여요',observe:'골반이 높아졌을 때 대퇴골과 골반 사이 각도도 펴졌는지 옆에서 봐요. 갈비뼈·골반의 간격과 발 압력도 함께 관찰해요.',why:'대둔근과 햄스트링은 고관절 신전에 기여해요. 골반 높이는 척추 신전으로도 높아질 수 있어요. 감각 하나로 근육의 약화를 단정하지 않아요.',change:'높이를 낮추고 양발 지지가 편한지 확인해요. 같은 자세에서 2~3회 다시 시도한 뒤 고관절 신전을 비교해요.',cue:'“발바닥으로 지그시 누르고, 골반은 조금만 들어요.”',ids:['m9','m1','m4','b2']},
{title:'옆으로 다리를 들면 허벅지 앞바깥쪽만 느껴져요',observe:'허벅지가 앞으로 나가거나 골반이 같이 돌아가는지 봐요.',why:'중둔근과 대퇴근막장근 모두 벌림에 기여해요. 대둔근의 주요 과제는 신전이에요.',change:'높이와 다리 위치를 한 가지씩 바꿔요. 오늘 신전이 목표라면 낮은 브리지로 바꿔 연습해요.',cue:'“발뒤꿈치는 멀리, 높이는 조금만.”',ids:['m2','m3','m1','b4']},
{title:'팔을 뻗으면 어깨를 으쓱해요',observe:'팔이 움직일 때 목, 흉곽과 견갑골이 함께 어떻게 움직이는지 관찰해요.',why:'팔을 들 때 견갑골 위쪽돌림에 전거근과 승모근이 협력해요. 어깨를 무조건 내리게 할 필요는 없어요.',change:'팔 높이와 저항을 줄여 편안한 낮은 리치를 비교해요. 통증이 나타나면 동작을 중단해요.',cue:'“손끝이 조금 멀어져요. 숨은 그대로 이어가요.”',ids:['p9','m6','p4','r4']},
{title:'풋워크에서 무릎이 끝에서 튕겨요',observe:'무릎 펴는 마지막과 캐리지 복귀 속도를 봐요. 발 압력이 한쪽으로 쏠리는지 확인해요.',why:'고관절과 무릎이 같이 펴지고, 스프링이 캐리지를 되돌리는 힘을 조절해야 해요.',change:'완전히 펴기 직전까지만 밀고 돌아오는 시간을 길게 해요. 무릎이 불편하면 해당 동작을 멈춰요.',cue:'“끝까지 튕기지 않고 천천히 돌아와요.”',ids:['r1','r2','c1','b8']},
{title:'회전에서 골반이 같이 돌아가요',observe:'골반 움직임과 흉곽 움직임을 구분해 봐요. 앉은 자세와 발 지지가 편한지 확인해요.',why:'회전은 여러 척추 분절과 골반의 기여를 포함해요. 흉곽 회전만 연습하는 과제라면 골반의 움직임을 줄여 비교할 수 있어요.',change:'팔을 가슴에 두고 작은 회전부터. 좌우 범위는 각자 편하게 두어요.',cue:'“앉은뼈는 바닥에, 가슴이 옆으로 조금.”',ids:['m20','m7','c11','b11']},
{title:'체스트 리프트에서 목이 불편해요',observe:'머리를 드는 순간 증상이 생기는지 확인하고 동작을 중단해요.',why:'척추 굴곡 과제에서는 몸통과 목에 부하가 걸려요. 머리 위치나 레버 길이에 따라 부담이 달라져요.',change:'머리를 지지한 채 호흡 또는 편한 Heel Slide를 해요. 불편하면 해당 운동을 중단하고 지속되는 증상은 평가를 권해요.',cue:'“머리는 편하게 받쳐두고 발만 조금 움직여요.”',ids:['m5','m9','m10','m14']}
];
const cardBy=id=>[...data.cards,...state.custom].find(x=>x.id===id);
const allCards=()=>[...data.cards,...state.custom];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('저장 공간이 부족하거나 브라우저 저장이 차단됐어요. 백업 파일을 내려받으세요.');return false}}
function nav(v){clearInterval(clock);clock=null;view=v;location.hash=v;render()}
function add(id,minutes=4){if(!cardBy(id))return;state.draft.push({id,min:minutes,note:'',reps:'',spring:''});save();if(view==='library')render();else nav('library')}
function template(i){if(state.draft.length&&!confirm('현재 작업 중인 수업안을 이 예시로 바꿀까요? 필요하면 먼저 저장하세요.'))return;let t=templates[i];state.title=t.name;state.draft=t.ids.map((id,j)=>({id,min:t.mins[j],note:'',reps:'',spring:''}));save();nav('library')}
function renderNav(){$('#nav').innerHTML=Object.entries(modes).map(([k,v])=>'<button class="'+(view===k?'active':'')+'" data-nav="'+k+'">'+v+'</button>').join('')}
function heading(title,sub){return '<h1>'+title+'</h1><p class="lead">'+sub+'</p>'}
function render(){if(!data)return;renderNav();let f={home:home,practice:practiceView,library:library,anatomy:anatomy,cases:caseView,saved:savedView,teaching:teaching,records:records,resources:resources}[view]||home;$('#app').innerHTML=f();if(view==='library')drawCards();if(view==='anatomy')drawMuscles()}
function home(){return '<div class="hero">'+heading('수업을 만드는 공부','동작을 관찰하고, 조건을 바꾸고, 다시 확인하는 나만의 필라테스 작업실')+'<div class="actions"><button class="primary" data-nav="practice">시퀀스 사례부터 연습</button><button data-nav="library">시퀀스 만들기</button><button data-nav="cases">티칭 사례 연습</button></div></div><div class="grid"><div class="panel"><h2>동작 라이브러리</h2><p><span class="total">'+allCards().length+'</span>개 카드 · 기구별 검색과 수업 추가</p><button data-nav="library">동작 찾기</button></div><div class="panel"><h2>기능해부학</h2><p><span class="total">'+data.muscles.length+'</span>개 근육 데이터 · 기시, 정지와 동작 연결</p><button data-nav="anatomy">근육 찾아보기</button></div><div class="panel"><h2>내 수업</h2><p><span class="total">'+state.saved.length+'</span>개 저장 수업안</p><button data-nav="saved">수업안 열기</button></div></div><h2>기구별 수업안으로 시작</h2><div class="grid">'+templates.map((t,i)=>'<div class="panel"><h3>'+esc(t.name)+'</h3><p>'+t.ids.length+'개 동작 · '+t.mins.reduce((a,b)=>a+b,0)+'분 예시</p><button data-template="'+i+'">수업안 편집</button></div>').join('')+'</div><div class="panel"><h2>학습 흐름</h2><ol class="steps"><li>해부학에서 오늘의 움직임과 관련 근육을 공부해요.</li><li>동작 카드에서 지지, 움직임, 큐를 비교해 직접 해봐요.</li><li>티칭 사례를 보고 조건 하나만 바꿔 다시 관찰해요.</li><li>시퀀스에 카드를 넣고 시간, 반복, 장비 세팅을 기록해요.</li><li>수업 모드에서 리허설하고, 실제 수업 후 기록을 남겨요.</li></ol></div>'}
function practiceView(){
const list=practiceCases.map((c,i)=>({c,i})).filter(x=>!practiceFilter||x.c[1]===practiceFilter);
const t=practiceCases[practiceSelected], log=state.practiceLogs?.[practiceSelected]||{};
const total=t[4].reduce((a,b)=>a+b,0);
let elapsed=0;
return heading('Sequence Practice (시퀀스 연습)','완성된 흐름을 먼저 직접 수행하고, 다음에 동작 하나씩 바꾸어 비교해요.')+
'<div class="filters">'+['','매트','리포머','체어','배럴','캐딜락','소도구'].map(v=>'<button class="'+(practiceFilter===v?'primary':'')+'" data-practice-filter="'+v+'">'+(v||'전체')+'</button>').join('')+'</div>'+
'<div class="workspace"><div>'+list.map(({c,i})=>'<div class="panel"><span class="tag">'+esc(c[2])+' · '+c[4].reduce((a,b)=>a+b,0)+'분</span><h3>'+esc(c[0])+'</h3><p>'+esc(c[5])+'</p><button data-practice-open="'+i+'">'+(state.practiceLogs?.[i]?.done?'✓ 연습 완료 · 다시 보기':'흐름 보기')+'</button></div>').join('')+'</div><div class="panel"><h2>'+esc(t[0])+'</h2><p>'+total+'분 · '+t[3].length+'개 동작</p><p>'+esc(t[5])+'</p><p class="muted">시간은 반복, 안내, 좌우 교대, 기구 세팅 및 휴식을 포함한 연습 블록이에요. 처음에는 익숙한 장비와 편한 범위만 사용하세요.</p>'+t[3].map((id,i)=>{const c=cardBy(id),start=elapsed;elapsed+=t[4][i];return '<div class="item"><span class="tag">'+start+'–'+elapsed+'분 · '+(i===0?'준비':i===t[3].length-1?'마무리':'본 운동')+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.setup)+'</p><details><summary>동작과 큐 확인</summary><p>'+esc(c.anatomy)+'</p><p>'+esc(c.cue)+'</p></details></div>'}).join('')+
'<h3>직접 해본 뒤 기록</h3><label>좋았던 동작과 이유</label><textarea data-practice-log="keep">'+esc(log.keep)+'</textarea><label>빼거나 바꿔보고 싶은 동작과 이유</label><textarea data-practice-log="change">'+esc(log.change)+'</textarea><label>다음 연습에서 비교할 조건 하나</label><textarea data-practice-log="next">'+esc(log.next)+'</textarea><div class="actions"><button data-practice-done="1">'+(log.done?'연습 완료 ✓':'연습 완료 표시')+'</button><button class="primary" data-practice-load="1">수업 모드용으로 복사</button></div></div></div>';
}
function library(){return heading('Movement Library & Builder','기구와 목표를 검색하고, 수업에 넣고, 순서와 세팅을 수정해요.')+'<div class="workspace"><div><div class="filters"><input id="q" placeholder="동작, 근육, 목표 검색" value="'+esc(query)+'"><select id="equip"><option value="">전체 기구</option>'+['매트','리포머','체어','배럴','캐딜락','소도구'].map(x=>'<option '+(equip===x?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="goal"><option value="">모든 목표</option>'+['고관절','척추','몸통','견갑대','상체','하체','발목','호흡'].map(x=>'<option '+(goal===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><p id="count" class="muted"></p><div id="cards"></div><details class="panel"><summary>직접 동작 추가</summary><form id="custom"><label>영어명 (한글명)</label><input name="name" required><label>기구</label><select name="equipment">'+['매트','리포머','체어','배럴','캐딜락','소도구'].map(x=>'<option>'+x+'</option>').join('')+'</select><label>목표</label><input name="goal" required><label>시작 자세와 수행</label><textarea name="setup" required></textarea><label>해부학</label><textarea name="anatomy"></textarea><label>큐와 조절</label><textarea name="cue"></textarea><button class="primary">저장</button></form></details></div><div class="panel stack"><h2>내 시퀀스</h2><label>수업 제목</label><input id="title" value="'+esc(state.title)+'" style="width:100%"><p class="total">'+sum()+'분 <small style="font-size:13px">· '+state.draft.length+'개 동작</small></p><div class="actions"><button class="primary" data-action="save">수업안 저장</button><button data-nav="teaching">수업 모드</button><button data-action="clear">비우기</button></div><p id="status" role="status"></p>'+state.draft.map((x,i)=>{let c=cardBy(x.id);return c?'<div class="item"><span class="tag">'+(i+1)+' · '+esc(c.equipment)+'</span><h3>'+esc(c.name)+'</h3><div class="actions"><input type="number" data-min="'+i+'" min="1" max="60" value="'+x.min+'" aria-label="분"> 분 <button data-move="'+i+',-1" '+(i===0?'disabled':'')+'>↑</button><button data-move="'+i+',1" '+(i===state.draft.length-1?'disabled':'')+'>↓</button><button data-remove="'+i+'">삭제</button></div><input class="note" data-field="'+i+',reps" placeholder="반복·세트" value="'+esc(x.reps)+'"><input class="note" data-field="'+i+',spring" placeholder="기구/스프링 세팅 (센터 기준)" value="'+esc(x.spring)+'"><input class="note" data-field="'+i+',note" placeholder="내 큐·전환 메모" value="'+esc(x.note)+'"></div>':''}).join('')+'</div></div>'}
function sum(){return state.draft.reduce((n,x)=>n+Number(x.min||0),0)}
function drawCards(){let cards=allCards().filter(c=>(!equip||c.equipment===equip)&&(!goal||[c.goal,c.anatomy].join(' ').includes(goal))&&Object.values(c).join(' ').toLowerCase().includes(query.trim().toLowerCase()));$('#count').textContent=cards.length+'개 동작';$('#cards').innerHTML=cards.map(c=>'<article class="card"><span class="tag">'+esc(c.equipment)+' · '+esc(c.goal)+'</span><h3>'+esc(c.name)+'</h3><p>'+esc(c.setup)+'</p><details><summary>해부학 · 큐잉 · 조건 변경</summary><p><b>움직임</b> '+esc(c.anatomy)+'</p><p><b>티칭</b> '+esc(c.cue)+'</p><p class="source">움직임이 달라지는지 먼저 관찰하고, 저항·범위·지지 중 하나를 바꾸어 다시 확인해요. 기구 세팅은 배운 모델의 지침을 사용해요.</p><label>내 동작 메모</label><textarea data-note="'+esc(c.id)+'">'+esc(state.notes[c.id])+'</textarea></details><button class="primary" data-add="'+esc(c.id)+'">＋ 수업에 추가</button></article>').join('')}
function anatomy(){return heading('Functional Anatomy','근육의 부착점과 작용을 본 뒤 관련 동작으로 이동해요.')+'<div class="panel"><a href="./core-textbook.html">기존 기능해부학 상세 교재 ↗</a> · <a href="./index.html#c3">어깨·상지 ↗</a> · <a href="./index.html#c2">골반·고관절 ↗</a> · <a href="./index.html#c4">무릎·발목·발 ↗</a></div><input id="muscle-q" placeholder="근육 검색 (전거근, 대둔근, Serratus)" style="width:100%;margin-bottom:15px"><div id="muscles"></div>'}
function drawMuscles(){let q=$('#muscle-q').value.toLowerCase();$('#muscles').innerHTML=data.muscles.filter(m=>[m.name,...m.fields.flat()].join(' ').toLowerCase().includes(q)).map(m=>{let name=m.name.match(/\(([^)]+)\)/)?.[1]||m.name,related=allCards().filter(c=>c.anatomy.includes(name)||c.anatomy.toLowerCase().includes(m.name.split(' (')[0].toLowerCase()));return '<article class="card"><h2>'+esc(m.name)+'</h2><dl>'+m.fields.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl><h3>관련 동작</h3><div class="actions">'+(related.length?related.map(c=>'<button data-add="'+esc(c.id)+'">＋ '+esc(c.name)+'</button>').join(''):'<button data-nav="library">동작 사전에서 찾아보기</button>')+'</div><label>내 해부학 메모</label><textarea data-muscle="'+esc(m.name)+'">'+esc(state.anatomyNotes[m.name])+'</textarea></article>'}).join('')}
function caseView(){let c=cases[caseIndex];return heading('Teaching Lab (티칭 실습)','회원의 움직임을 보고 어떤 조건부터 바꿀지 연습해요.')+'<div class="filters">'+cases.map((x,i)=>'<button data-case="'+i+'" class="'+(i===caseIndex?'primary':'')+'">'+esc(x.title)+'</button>').join('')+'</div><div class="panel"><h2>'+esc(c.title)+'</h2><h3>관찰</h3><p>'+esc(c.observe)+'</p><h3>해부학적 근거</h3><p>'+esc(c.why)+'</p><h3>조건 변경</h3><p>'+esc(c.change)+'</p><h3>첫 큐</h3><p class="case">'+esc(c.cue)+'</p><h3>관련 동작</h3><div class="actions">'+c.ids.map(id=>'<button data-add="'+id+'">＋ '+esc(cardBy(id).name)+'</button>').join('')+'</div><label>내 관찰과 바꿔본 조건</label><textarea data-note="case-'+caseIndex+'">'+esc(state.notes['case-'+caseIndex])+'</textarea></div>'}
function savedView(){return heading('내 수업안','저장한 시퀀스를 복사해 다음 수업에 사용해요.')+(state.saved.length?state.saved.map((s,i)=>'<div class="panel"><h3>'+esc(s.title)+'</h3><p>'+s.items.length+'개 · '+s.items.reduce((a,x)=>a+x.min,0)+'분</p><div class="actions"><button data-load="'+i+'">편집용 복사</button><button data-delete="'+i+'">삭제</button></div></div>').join(''):'<div class="panel">아직 저장된 수업안이 없어요. <button data-nav="library">수업 만들기</button></div>')}
function teaching(){let x=state.draft[teachIndex],c=x&&cardBy(x.id);if(!c)return heading('수업 모드','수업안을 먼저 만들거나 불러와요.')+'<button data-nav="library">수업안 편집</button>';remaining=remaining||x.min*60;return '<div class="teach-box">'+heading(esc(state.title), (teachIndex+1)+' / '+state.draft.length+' · '+esc(c.equipment))+'<div class="panel"><h2>'+esc(c.name)+'</h2><p>'+esc(c.setup)+'</p><p><b>티칭 큐</b> '+esc(c.cue)+'</p><p>'+esc(x.reps)+' · '+esc(x.spring)+'</p><p class="case">'+esc(x.note)+'</p><div class="timer" id="timer">'+fmt()+'</div><div class="actions no-print"><button data-action="timer">시작/정지</button><button data-action="reset">시간 초기화</button><button data-action="prev" '+(teachIndex===0?'disabled':'')+'>이전</button><button data-action="next" '+(teachIndex===state.draft.length-1?'disabled':'')+'>다음</button><button data-nav="records">수업 기록</button></div></div><p>다음 동작 · '+esc(cardBy(state.draft[teachIndex+1]?.id)?.name||'마무리')+'</p></div>'}
function fmt(){return String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function records(){return heading('수업 기록','실제 수업에서 어떤 변화가 있었는지 짧게 기록해요. 회원 이름이나 민감한 건강정보 대신 익명 그룹 코드 사용을 권장해요.')+'<form id="record" class="panel"><div class="rowform"><label>날짜<input name="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></label><label>그룹 코드<input name="group" placeholder="예: A그룹"></label></div><label>시퀀스</label><input name="title" value="'+esc(state.title)+'" required><label>잘 됐던 큐와 동작</label><textarea name="worked" required></textarea><label>다음 수업에 바꿀 조건</label><textarea name="next"></textarea><button class="primary">기록 저장</button></form>'+state.records.slice().reverse().map(r=>'<div class="panel"><h3>'+esc(r.date)+' · '+esc(r.group)+' · '+esc(r.title)+'</h3><p>'+esc(r.worked)+'</p><p><b>다음</b> '+esc(r.next)+'</p></div>').join('')}
function resources(){return heading('참고자료 및 백업','검증할 자료와 내 기록을 관리해요.')+'<div class="panel"><h2>참고 자료</h2><ul><li><a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/11-5-muscles-of-the-pectoral-girdle-and-upper-limbs">OpenStax · 상지 근육</a></li><li><a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/11-6-appendicular-muscles-of-the-pelvic-girdle-and-lower-limbs">OpenStax · 하지 근육</a></li><li><a href="https://www.pilates.com/support/safety-guides/">Balanced Body · 기구별 안전 가이드</a></li><li><a href="./movement-manual.html">기존 지도자과정 동작 교재</a></li></ul><p>기본 카드는 기존 학습 교재를 바탕으로 구성했으며, 학교별 명칭과 정확한 스프링 세팅은 해당 교재 및 센터 모델을 대조해 기록해야 해요.</p></div><div class="panel"><h2>내 데이터 백업</h2><p>작성한 기록은 현재 브라우저에 저장돼요. 다른 기기에서 사용하거나 브라우저 데이터를 지우기 전에는 JSON 백업을 내려받으세요.</p><div class="actions"><button data-action="export">백업 다운로드</button><label>백업 복원<input type="file" id="import" accept=".json,application/json"></label></div></div>'}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;
if(d.nav){if(d.nav==='teaching'){teachIndex=0;remaining=0}nav(d.nav)}
else if(d.practiceFilter!==undefined){practiceFilter=d.practiceFilter;let i=practiceCases.findIndex(c=>!practiceFilter||c[1]===practiceFilter);if(i>=0)practiceSelected=i;render()}
else if(d.practiceOpen!==undefined){practiceSelected=+d.practiceOpen;render()}
else if(d.practiceDone){state.practiceLogs??={};let log=state.practiceLogs[practiceSelected]??={};log.done=!log.done;save();render()}
else if(d.practiceLoad){if(state.draft.length&&!confirm('현재 작성 중인 수업안을 바꿀까요?'))return;let t=practiceCases[practiceSelected];state.title=t[0];state.draft=t[3].map((id,j)=>({id,min:t[4][j],note:'',reps:'',spring:''}));save();teachIndex=0;remaining=0;nav('teaching')}
else if(d.add)add(d.add)
else if(d.template)template(+d.template)
else if(d.case!==undefined){caseIndex=+d.case;render()}
else if(d.remove!==undefined){state.draft.splice(+d.remove,1);save();render()}
else if(d.move){let [i,dir]=d.move.split(',').map(Number),j=i+dir;if(j>=0&&j<state.draft.length){[state.draft[i],state.draft[j]]=[state.draft[j],state.draft[i]];save();render()}}
else if(d.load!==undefined){if(state.draft.length&&!confirm('현재 작업 중인 수업안을 바꿀까요?'))return;let s=state.saved[+d.load];state.title=s.title;state.draft=structuredClone(s.items);save();nav('library')}
else if(d.delete!==undefined){if(confirm('저장 수업안을 삭제할까요?')){state.saved.splice(+d.delete,1);save();render()}}
else if(d.action==='save'){if(!state.draft.length){$('#status').textContent='동작을 먼저 추가하세요.';return}state.saved.push({title:state.title.trim()||'새 수업',items:structuredClone(state.draft)});if(save())$('#status').textContent='수업안 저장 완료'}
else if(d.action==='clear'){if(confirm('현재 작업 중인 수업안을 비울까요?')){state.draft=[];state.title='새 수업';save();render()}}
else if(d.action==='timer'){if(clock){clearInterval(clock);clock=null}else if(remaining>0)clock=setInterval(()=>{remaining--;$('#timer').textContent=fmt();if(remaining<=0){clearInterval(clock);clock=null}},1000)}
else if(['prev','next','reset'].includes(d.action)){clearInterval(clock);clock=null;if(d.action==='next')teachIndex++;if(d.action==='prev')teachIndex--;remaining=state.draft[teachIndex].min*60;render()}
else if(d.action==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='pilates-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
});
document.addEventListener('input',e=>{let t=e.target,d=t.dataset;if(t.id==='q'){query=t.value;drawCards()}else if(t.id==='muscle-q')drawMuscles();else if(t.id==='title'){state.title=t.value;save()}else if(d.practiceLog){state.practiceLogs??={};let log=state.practiceLogs[practiceSelected]??={};log[d.practiceLog]=t.value;save()}else if(d.note!==undefined){state.notes[d.note]=t.value;save()}else if(d.muscle){state.anatomyNotes[d.muscle]=t.value;save()}else if(d.field){let [i,k]=d.field.split(',');state.draft[+i][k]=t.value;save()}});
document.addEventListener('change',async e=>{let t=e.target,d=t.dataset;if(t.id==='equip'){equip=t.value;drawCards()}else if(t.id==='goal'){goal=t.value;drawCards()}else if(d.min!==undefined){state.draft[+d.min].min=Math.max(1,Math.min(60,Number(t.value)||1));save();render()}else if(t.id==='import'&&t.files[0]){try{let x=JSON.parse(await t.files[0].text());if(!Array.isArray(x.draft)||!Array.isArray(x.saved)||!Array.isArray(x.custom)||!Array.isArray(x.records))throw Error();if(confirm('현재 브라우저 기록을 백업 내용으로 바꿀까요?')){state={...initial,...x};save();nav('home')}}catch{alert('올바른 백업 파일을 선택하세요.')}}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,x=Object.fromEntries(new FormData(f));if(f.id==='custom'){state.custom.push({...x,id:'own-'+Date.now()});save();render()}else if(f.id==='record'){state.records.push(x);save();render()}});
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(modes[v]&&v!==view){clearInterval(clock);clock=null;view=v;render()}});
fetch('./studio-data.json').then(r=>{if(!r.ok)throw Error('데이터를 불러오지 못했어요.');return r.json()}).then(d=>{data=d;view=modes[location.hash.slice(1)]?location.hash.slice(1):'home';render()}).catch(e=>$('#app').textContent=e.message);
</script></body></html>
