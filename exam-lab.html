<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilates Atlas · Exam Lab</title><style>body{margin:0;background:#f4f5f1;color:#253a31;font:16px/1.7 system-ui,sans-serif}header{background:#163f37;color:white;padding:28px max(20px,calc((100vw - 850px)/2))}header a{color:#d4ebdd}main{max-width:850px;margin:auto;padding:24px 18px 80px}.card{background:white;border:1px solid #d9e2d9;border-radius:14px;padding:25px;margin:16px 0}h1{margin:5px 0}button{font:inherit;cursor:pointer;border:1px solid #aec2b2;background:#f3f8f3;border-radius:9px;padding:11px 15px}button.primary{background:#246b56;color:white;border:0}.controls{display:flex;gap:10px;flex-wrap:wrap}.option{display:block;width:100%;text-align:left;margin:9px 0}.option:disabled{cursor:default}.correct{background:#d8f0de!important;border-color:#4e9a69!important}.incorrect{background:#f9e0dc!important;border-color:#c96e63!important}.note{background:#edf4ee;padding:13px;border-left:4px solid #5d9874;margin:15px 0}small{color:#61776b}footer{text-align:center;padding:25px;color:#6a796f}</style></head><body><header><a href="./index.html#home">← Pilates Atlas 홈</a><h1>Exam Lab (실전 평가실)</h1><p>40문항 · 즉시 해설 · 오답 복습 · 무작위 출제</p></header><main><div class="card"><div class="controls"><button class="primary" id="all">전체 문제</button><button id="random">무작위 10문항</button><button id="wrong">오답만 복습</button><button id="clear">오답 기록 초기화</button></div><p id="stats" aria-live="polite"></p></div><div id="stage" class="card"></div><footer>교육용 학습 평가이며 자격시험 공식 기출문제가 아닙니다.</footer></main><script>const bank=[["Which plane primarily describes flexion/extension? (굽힘·폄의 주 운동면은?)",["Sagittal (시상면)","Frontal (관상면)","Transverse (횡단면)","None"],0,"Flexion/extension is generally described in the sagittal plane."],["Which plane primarily describes abduction/adduction? (벌림·모음의 주 운동면은?)",["Sagittal","Frontal","Transverse","Oblique only"],1,"Abduction/adduction is typically described in the frontal plane."],["What is the scapulothoracic articulation? (견갑흉곽 연결은?)",["A synovial joint","A functional articulation","A wrist joint","A hip joint"],1,"The scapula moves on the thorax through a functional articulation."],["Which nerve innervates gluteus medius? (중둔근의 신경지배는?)",["Inferior gluteal","Superior gluteal","Femoral","Tibial"],1,"Superior gluteal nerve supplies gluteus medius and minimus."],["Which muscle crosses both hip and knee? (고관절·무릎을 모두 지나는 근육은?)",["Vastus intermedius","Soleus","Rectus femoris","Gluteus medius"],2,"Rectus femoris crosses the hip and knee."],["Which muscle does not cross the knee? (무릎을 지나지 않는 종아리근은?)",["Gastrocnemius","Soleus","Plantaris","Biceps femoris"],1,"Soleus acts at the ankle, unlike gastrocnemius."],["What happens to radius in forearm pronation? (전완 엎침에서 요골은?)",["Crosses ulna","Fuses with ulna","Stops moving","Becomes parallel only"],0,"Radius rotates relative to ulna and crosses it in pronation."],["Foot pronation includes which combination? (발 회내의 조합은?)",["Inversion, adduction, plantarflexion","Eversion, abduction, dorsiflexion","Flexion, extension, rotation","Only eversion"],1,"Pronation is a triplanar combination, not just eversion."],["Foot supination includes which combination? (발 회외의 조합은?)",["Eversion, abduction, dorsiflexion","Inversion, adduction, plantarflexion","Only plantarflexion","Only inversion"],1,"Supination combines inversion, adduction and plantarflexion."],["What is a moment arm? (모멘트암이란?)",["Muscle length","Perpendicular distance to force line","Body mass","Joint cartilage"],1,"Moment arm is the perpendicular distance from axis to force line."],["What is an appropriate interpretation of rounded shoulders? (둥근어깨의 해석은?)",["Proof of pain source","A postural observation","Definite nerve injury","A diagnosis"],1,"Posture alone cannot establish a pain diagnosis."],["How should a painful movement be approached? (통증 유발 움직임은?)",["Repeatedly provoke it","Ignore it","Adjust load/range and assess response","Force end range"],2,"Modify the task and seek medical evaluation for concerning or persistent symptoms."],["What is a sensible bridge modification? (브리지 수정 방법은?)",["Force maximum height","Adjust foot position and range","Hold breath","Move faster"],1,"Foot position and height change task demands."],["What is the role of serratus anterior? (전거근의 역할은?)",["Scapular upward rotation","Knee extension","Ankle inversion","Hip flexion"],0,"Serratus anterior contributes to protraction and upward rotation."],["What does progressive overload mean? (점진적 과부하란?)",["Always add all variables","Adjust demand progressively","Always train to pain","Never rest"],1,"Progress load variables based on goal and response."],["What does immediate performance prove? (즉시 수행 개선은 무엇을 증명하나?)",["Permanent learning","No learning ever","Only immediate change, not necessarily retention","Diagnosis"],2,"Retention and transfer help assess learning."],["What is a safe instructor record? (안전한 지도 기록은?)",["Definitive diagnosis","Observed facts and re-test response","Unverified cause","Private medical history on public GitHub"],1,"Separate observation from inference; avoid public sensitive data."],["What should be checked before Reformer work? (리포머 시작 전 확인은?)",["Only music","Springs, stopper, footbar, straps","Only socks","Only mirror"],1,"Equipment checks are essential for safe setup."],["Which is a primary breathing muscle? (주요 들숨근은?)",["Diaphragm","Gluteus maximus","Soleus","Rectus femoris"],0,"The diaphragm is a major muscle of inspiration."],["Which statement about neutral pelvis is best? (골반 중립에 대한 적절한 설명은?)",["One exact angle for everyone","A task- and individual-dependent range","Never changes","Always posterior tilt"],1,"Neutral pelvis is not one fixed universal angle."],["Which muscle group extends the knee? (무릎 폄 근육군은?)",["Hamstrings","Quadriceps","Rotator cuff","Deep hip rotators"],1,"Quadriceps femoris is the primary knee extensor group."],["What does the rotator cuff contribute to? (회전근개는 무엇에 기여하나?)",["Only rotation","Shoulder rotation and joint stability","Only scapular elevation","Only elbow extension"],1,"The cuff contributes to humeral rotation and glenohumeral stability."],["What is appropriate with dizziness during exercise? (운동 중 어지럼이 있다면?)",["Continue faster","Stop and assess safety","Increase spring load","Ignore"],1,"Stop the activity and assess; seek medical help if indicated."],["What is a regression? (난이도 하향은?)",["Increase complexity","Reduce task demand while preserving goal","Add every prop","Remove all instruction"],1,"Regress by modifying lever, load, range or support."],["What does single-leg stance test? (한발 서기는 무엇을 관찰하나?)",["Only one muscle strength","Integrated balance and control","Exact hip diagnosis","Only ankle"],1,"Single-leg stance involves integrated sensory and motor control."],["Which cue may be problematic for overhead reach? (팔 올림에서 주의할 큐는?)",["Allow comfortable scapular motion","Keep shoulders forcibly down throughout","Breathe naturally","Reduce range if needed"],1,"Forcing depression may interfere with natural upward rotation."],["What is an open-chain example? (열린 사슬의 예는?)",["Seated knee extension","Standing squat","Fixed-foot lunge","Standing heel raise"],0,"The foot is free in seated knee extension."],["Which is a closed-chain example? (닫힌 사슬의 예는?)",["Seated knee extension","Standing squat","Free-leg hip abduction","Open-arm reach"],1,"The foot is supported in a standing squat."],["What is the first step in assessment? (평가의 첫 단계는?)",["Diagnose tissue injury","Interview goals and concerns","Force max range","Choose hardest exercise"],1,"Begin with goals, history relevant to exercise, and safety screening."],["What does a re-test establish? (재평가는 무엇을 확인하나?)",["Absolute cause","Response to a change","Permanent cure","Muscle isolation"],1,"A re-test checks whether the modification changed the observed task."],["Which action is appropriate for persistent unexplained pain? (지속적 원인불명 통증은?)",["Self-diagnose","Refer for appropriate medical evaluation","Force stretch","Ignore"],1,"Persistent or concerning symptoms warrant medical assessment."],["Which statement about soreness is correct? (근육통은?)",["Required for adaptation","Not required to prove exercise benefit","Proof of tissue damage","A training goal"],1,"Soreness is not a necessary marker of effective training."],["What does hip hinge emphasize? (힙힌지는?)",["Hip motion relative to trunk","Only cervical flexion","Only wrist rotation","Only ankle eversion"],0,"Hip hinge emphasizes movement around the hip."],["What is a good beginner teaching strategy? (초보자 지도는?)",["Many cues at once","Clear single goal and manageable task","Maximal instability","No rest"],1,"Simple tasks and concise cues support learning."],["What is a special consideration for older adults? (시니어 지도 고려사항은?)",["Age alone defines ability","Balance and safe transfers","Avoid all resistance","Always use hardest task"],1,"Assess function and provide safe support."],["What is important for prenatal exercise? (산전 운동은?)",["Ignore symptoms","Individualize with medical guidance and warning signs","Ban all movement","Force breath holds"],1,"Pregnancy exercise requires individualized assessment and safety."],["What is appropriate for hypermobility? (과운동성은?)",["Always push end range","Develop control and progressive loading","Avoid all movement","Diagnose by one pose"],1,"Control and gradual loading can be appropriate; individualize."],["What does a foot arch observation prove? (발 아치 관찰은?)",["Exact diagnosis","A descriptive observation only","Muscle rupture","No function"],1,"Arch appearance alone does not establish pathology."],["What is a reasonable shoulder modification? (어깨 동작 수정은?)",["Painful repetition","Reduce range and load","Force elevation","Ignore fatigue"],1,"Modify range and load based on symptoms."],["What is a practical cue for heel raise? (뒤꿈치 들기 큐는?)",["Grip toes hard","Press through feet and rise with control","Lock breath","Jump quickly"],1,"Controlled plantarflexion with balanced foot pressure is useful."]];let wrong=[];try{wrong=JSON.parse(localStorage.getItem('atlas-exam-wrong-v1')||'[]')}catch(e){}let deck=[],index=0,answered=false,correct=0;const stage=document.getElementById('stage'),stats=document.getElementById('stats');function persist(){localStorage.setItem('atlas-exam-wrong-v1',JSON.stringify(wrong))}function start(mode){let ids=bank.map((_,i)=>i);if(mode==='random'){ids.sort(()=>Math.random()-.5);ids=ids.slice(0,10)}if(mode==='wrong')ids=ids.filter(i=>wrong.includes(i));deck=ids;index=0;answered=false;correct=0;render()}function render(){stats.textContent='진행 '+Math.min(index+1,deck.length)+' / '+deck.length+' · 이번 회차 정답 '+correct+' · 저장된 오답 '+wrong.length;if(!deck.length){stage.textContent='복습할 오답이 없습니다.';return}if(index>=deck.length){stage.innerHTML='<h2>학습 완료</h2><p>정답 '+correct+' / '+deck.length+'</p>';return}const id=deck[index],x=bank[id];stage.replaceChildren();const title=document.createElement('h2');title.textContent=(index+1)+'. '+x[0];stage.appendChild(title);x[1].forEach((option,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>answer(i);stage.appendChild(b)});answered=false}function answer(choice){if(answered)return;answered=true;const id=deck[index],x=bank[id],ok=choice===x[2];if(ok){correct++;wrong=wrong.filter(v=>v!==id)}else if(!wrong.includes(id))wrong.push(id);persist();[...stage.querySelectorAll('.option')].forEach((b,i)=>{b.disabled=true;if(i===x[2])b.classList.add('correct');else if(i===choice)b.classList.add('incorrect')});const p=document.createElement('div');p.className='note';p.textContent=(ok?'정답! ':'오답. ')+x[3];stage.appendChild(p);const next=document.createElement('button');next.className='primary';next.textContent=index+1===deck.length?'결과 보기':'다음 문제';next.onclick=()=>{index++;render()};stage.appendChild(next);stats.textContent='진행 '+(index+1)+' / '+deck.length+' · 이번 회차 정답 '+correct+' · 저장된 오답 '+wrong.length}document.getElementById('all').onclick=()=>start('all');document.getElementById('random').onclick=()=>start('random');document.getElementById('wrong').onclick=()=>start('wrong');document.getElementById('clear').onclick=()=>{wrong=[];persist();start('all')};start('all');</script></body></html>
